*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#151226;--ink2:#3a3550;--muted:#7d7794;--line:#eceaf3;--bg:#f2eff8;--card:#fff;
--pink:#e4187a;--violet:#7a2c9e;--magenta:#b31c8e;--grad:linear-gradient(120deg,#e4187a 0%,#c01f9e 50%,#7a2c9e 100%);
--grad-hero:linear-gradient(150deg,#7b2c99 0%,#c81fa0 42%,#ff0a6e 100%);--dark:#141026;--up:#1fae5f;--down:#e33124;
--shadow:0 1px 2px rgba(20,16,38,.05),0 10px 28px rgba(20,16,38,.07);--shadow-lift:0 8px 22px rgba(122,44,158,.16);}
html{-webkit-text-size-adjust:100%}
body{font-family:'Isidora Sans',system-ui,'Segoe UI',sans-serif;color:var(--ink2);line-height:1.5;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
background:radial-gradient(900px 520px at 100% -4%,rgba(228,24,122,.12),transparent 60%),radial-gradient(820px 520px at -6% 12%,rgba(122,44,158,.12),transparent 55%),var(--bg);}
.shell{width:100%;max-width:940px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:transparent;overflow:hidden}
.topbar{flex:none;z-index:40;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:14px;padding:11px clamp(16px,4vw,30px)}
.logo{height:32px;width:auto;display:block}
.topbar .period{font-weight:800;font-size:12px;letter-spacing:.08em;background:linear-gradient(120deg,#e4187a,#7a2c9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:#fff;color:var(--muted);height:36px;min-width:36px;padding:0 14px;border-radius:10px;font-family:inherit;font-weight:700;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.iconbtn:hover{color:#fff;background:var(--grad);border-color:transparent;box-shadow:var(--shadow-lift)}
.iconbtn svg{width:15px;height:15px}
.progress{height:4px;background:var(--line);position:relative;overflow:hidden}
.progress-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--grad);transition:width .5s cubic-bezier(.4,0,.1,1)}
.stage{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:clamp(20px,4vw,34px) clamp(16px,4vw,34px) 40px;animation:fade .45s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.progress-fill{transition:none}*{scroll-behavior:auto!important}}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.page-title{font-weight:900;color:var(--ink);font-size:clamp(25px,5vw,38px);line-height:1.04;margin:6px 0 12px;letter-spacing:-.015em}
.rule{height:4px;width:100%;background:var(--grad);border-radius:4px;margin-bottom:22px;box-shadow:0 4px 14px rgba(228,24,122,.22)}
.section-band{display:inline-flex;align-items:center;gap:10px;background:var(--grad);color:#fff;font-weight:800;letter-spacing:.05em;font-size:14px;padding:10px 20px;border-radius:30px;margin:28px 0 16px;box-shadow:0 8px 20px rgba(180,20,120,.26)}
.pink-head{display:flex;align-items:center;gap:11px;color:var(--pink);font-weight:900;font-size:clamp(17px,3.4vw,21px);margin:26px 0 14px;letter-spacing:.01em}
.pink-head::before{content:"";width:24px;height:5px;border-radius:4px;background:var(--grad);flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}.g4.markets,.g3.kpis{grid-template-columns:1fr 1fr}}
ul.bul{list-style:none;display:flex;flex-direction:column;gap:9px}
ul.bul li{position:relative;padding-left:20px;font-size:14.5px;color:var(--ink2)}
ul.bul li::before{content:"";position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--grad)}
b,.b{color:var(--ink);font-weight:800}
.perf-top{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
@media(max-width:720px){.perf-top{grid-template-columns:1fr}}
.hero-stat{color:#fff;border-radius:20px;padding:26px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 85% 8%,rgba(255,160,255,.55),transparent 55%),var(--grad-hero);box-shadow:0 20px 44px rgba(180,20,120,.32)}
.hero-stat::after{content:"";position:absolute;right:-34px;top:-34px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.4),transparent 68%)}
.hero-stat .lbl{position:relative;font-weight:800;letter-spacing:.05em;font-size:13px}
.hero-stat .big{position:relative;font-weight:900;font-size:70px;line-height:1;margin:8px 0 2px;text-shadow:0 6px 22px rgba(70,0,40,.25)}
.hero-stat .big .u{font-size:32px;vertical-align:super;margin-left:3px}
.hero-stat .chips{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero-stat .chip{background:rgba(255,255,255,.94);border-radius:9px;padding:5px 12px;font-weight:800;font-size:13.5px;box-shadow:0 4px 12px rgba(60,0,40,.18)}
.chip.pos{color:#0a8f4d}.chip.neg{color:#c8145e}
.hero-stat .nt{position:relative;font-size:12px;color:rgba(255,255,255,.92);margin-top:14px;font-style:italic;line-height:1.5}
.statbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px 14px;text-align:center;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
.statbox::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.statbox:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.statbox .head{font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--ink);background:#f6f2fa;border-radius:8px;padding:6px;margin-bottom:10px}
.statbox .val{font-weight:900;color:var(--ink);font-size:34px;line-height:1}
.statbox .val .u{font-size:15px;font-weight:800;margin-left:1px;color:var(--pink)}
.statbox .sub{font-size:11px;color:var(--muted);font-weight:700;margin-top:3px}
.statbox .dl{font-size:12px;font-weight:800;color:var(--up);margin-top:3px}
.mkt .name{font-size:12px;font-weight:800;letter-spacing:.03em;color:var(--ink)}
.mkt .val{font-size:30px}.mkt .dl{color:var(--up)}
.kpi{text-align:center}
.kpi .icon{width:46px;height:46px;margin:0 auto;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 18px rgba(180,20,120,.28)}
.kpi .klbl{font-size:12px;font-weight:800;color:var(--pink);letter-spacing:.04em;margin-top:9px}
.kpi .kval{font-weight:900;color:var(--ink);font-size:40px;line-height:1;margin:6px 0}
.kpi .kdl{font-weight:800;font-size:14px}.kpi .kdl.up{color:var(--up)}.kpi .kdl.down{color:var(--down)}
.kpi .knote{margin:12px -20px -18px;background:var(--grad);color:#fff;font-size:11.5px;font-weight:700;padding:12px 16px;line-height:1.4;white-space:pre-line}
.footnote{font-size:10.5px;color:var(--violet);font-weight:800;text-align:right;margin-top:10px;letter-spacing:.02em}
.rel{display:flex;flex-direction:column;gap:12px}
.rel .n{font-weight:900;font-size:32px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.imgslot{position:relative;border-radius:12px;overflow:hidden;background:#f4f2f9;border:1px solid var(--line)}
.imgslot img{display:block;width:100%;height:100%;object-fit:cover}
.rel .imgslot{aspect-ratio:1/1}.rel .cap{font-size:14px}
.awards{display:grid;grid-template-columns:1fr 1fr;margin-top:28px;border-radius:16px;overflow:hidden;background:var(--grad);color:#fff;box-shadow:0 12px 30px rgba(180,20,120,.28)}
@media(max-width:600px){.awards{grid-template-columns:1fr}}
.awards .aw{padding:18px 20px;font-size:13.5px}.awards .aw:first-child{border-right:1px solid rgba(255,255,255,.25)}.awards .aw .tag{font-weight:900}
.upcoming li{font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 4px}
@media(max-width:720px){.gallery{grid-template-columns:repeat(2,1fr)}}
.gallery .imgslot{aspect-ratio:4/3;box-shadow:var(--shadow)}.gallery .imgslot.tall{grid-row:span 2;aspect-ratio:3/4}
.opcard{font-size:14px}
.bhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.bleft{display:flex;align-items:center;gap:12px;min-width:0}
.bname{font-weight:900;color:var(--ink);font-size:17px;letter-spacing:.02em}
.badge{white-space:nowrap;text-align:right}.badge .p{font-weight:900;color:var(--ink);font-size:23px;line-height:1}
.badge .p .u{font-size:12px;color:var(--pink)}.badge .s{display:block;font-size:10px;font-weight:800;color:var(--pink);letter-spacing:.03em}
.logoslot{height:44px;max-width:150px;background:transparent;border:none;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logoslot img{max-width:150px;max-height:44px;width:auto;height:auto;object-fit:contain;display:block}
.logoslot.empty{display:none}
.editing .logoslot{display:flex;align-items:center;justify-content:center}
.editing .logoslot.empty{width:118px;height:44px;border:1.5px dashed #e79cc4;background:#fdeef6;border-radius:9px}
.editing .logoslot.empty .imgtool{opacity:1;position:absolute;inset:0;background:transparent;color:var(--pink);border-radius:9px}
.editing .logoslot.empty .imgtool svg{display:none}
.deepdive{display:grid;grid-template-columns:1fr 1.15fr;gap:22px;align-items:center;margin-top:8px}
@media(max-width:720px){.deepdive{grid-template-columns:1fr}}
.dd-text p{font-size:14.5px;margin-bottom:12px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 16px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.chart::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.legend{display:flex;gap:16px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.legend span{font-size:11px;font-weight:800;color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.bars{display:flex;gap:26px;justify-content:space-around;align-items:flex-end;height:210px;padding:0 6px}
@media(max-width:600px){.bars{gap:12px}}

<script src="jszip.min.js"></script><script>
const DATA=JSON.parse(document.getElementById('aura-data').textContent);
let cur=0,edit=false;
const $=s=>document.querySelector(s);
const stage=$('#stage'),dotsEl=$('#dots'),fill=$('#pfill'),counter=$('#counter');var pending={};function resolveSrc(id){return (pending[id]&&pending[id].url)||DATA.assets[id]||'';}
function getP(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k.match(/^\d+$/)?+k:k],o);}
function setP(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){let k=ks[i];k=k.match(/^\d+$/)?+k:k;a=a[k];}let last=ks[ks.length-1];a[last.match(/^\d+$/)?+last:last]=v;}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slot(id,extra){const src=resolveSrc(id);return `<div class="imgslot ${extra||''}" data-slot="${id}" style="--bgimg:url('${src}')"><img src="${src}" alt=""><div class="imgtool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15l-5-5L5 21"/><path d="M3 3h18v18H3z"/></svg>Drop image or click to replace</div></div>`;}
function logoSlot(id){const src=resolveSrc(id);const f=!!src;return `<div class="imgslot logoslot ${f?'filled':'empty'}" data-slot="${id}" data-logo="1"><img src="${src}" alt=""><div class="imgtool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Upload logo</div></div>`;}
function iconSlot(id,emoji){const src=resolveSrc(id);const f=!!src;return `<div class="imgslot iconslot ${f?'filled':'empty'}" data-slot="${id}" data-icon="1"><img src="${src}" alt=""><span class="emoji">${esc(emoji)}</span><div class="imgtool"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>PNG</div></div>`;}
function runs(obj,base){let out='';['bold','text','bold2','text2','bold3','text3'].forEach(k=>{if(obj[k]!==undefined&&obj[k]!==''){const isB=k.startsWith('bold');out+=`<span class="ed ${isB?'b':''}" data-bind="${base}.${k}">${esc(obj[k])}</span>`;}});return out;}
function paraRuns(arr,base){return arr.map((r,i)=>{const k=r.bold!==undefined?'bold':'text';const isB=k==='bold';return `<span class="ed ${isB?'b':''}" data-bind="${base}.${i}.${k}">${esc(r[k])}</span>`;}).join('');}
function edList(arr,base,liCls){let out=`<ul class="bul ${liCls||''}" data-list="${base}">`;arr.forEach((v,i)=>{out+=`<li><span class="ed" data-bind="${base}.${i}">${esc(v)}</span><button class="li-del" data-del="${base}.${i}">×</button></li>`;});out+=`</ul><button class="li-add" data-add="${base}">+ Add line</button>`;return out;}
function feBadge(base,br){return `<div class="badge"><div class="p"><span class="ed" data-bind="${base}.value">${esc(br.value)}</span><span class="u ed" data-bind="${base}.unit">${esc(br.unit||'%')}</span></div><span class="s ed" data-bind="${base}.feLabel">${esc(br.feLabel||'FE Linkage')}</span></div>`;}
function renderPage(pi){
  const p=DATA.pages[pi],B=`pages.${pi}`;
  let head=`<div class="eyebrow ed" data-bind="${B}.kicker">${esc(p.kicker)}</div><h1 class="page-title ed" data-bind="${B}.title">${esc(p.title)}</h1><div class="rule"></div>`;
  let body='';
  if(p.layout==='performance'){const hs=p.hero_stat;
    body+=`<div class="perf-top"><div class="card"><ul class="bul">${p.highlights.map((v,i)=>`<li>${v.map((sg,j)=>`<span class="ed hl-${sg.s||'plain'}" data-bind="${B}.highlights.${i}.${j}.t">${esc(sg.t)}</span>`).join('')}<button class="li-del" data-del="${B}.highlights.${i}">×</button></li>`).join('')}</ul><button class="li-add" data-add="${B}.highlights">+ Add line</button></div>
      <div class="hero-stat"><div class="lbl ed" data-bind="${B}.hero_stat.label">${esc(hs.label)}</div><div class="big"><span class="ed" data-bind="${B}.hero_stat.value">${esc(hs.value)}</span><span class="u ed" data-bind="${B}.hero_stat.unit">${esc(hs.unit)}</span></div><div class="chips"><span class="chip pos ed" data-bind="${B}.hero_stat.delta_pos">${esc(hs.delta_pos)}</span><span class="chip neg ed" data-bind="${B}.hero_stat.delta_neg">${esc(hs.delta_neg)}</span></div><div class="nt ed" data-bind="${B}.hero_stat.note">${esc(hs.note)}</div></div></div>`;
    body+=`<div class="pink-head ed" data-bind="${B}.division_title">${esc(p.division_title)}</div><div class="grid g4">`;
    p.divisions.forEach((d,i)=>{body+=`<div class="statbox"><div class="head ed" data-bind="${B}.divisions.${i}.name">${esc(d.name)}</div><div class="val"><span class="ed" data-bind="${B}.divisions.${i}.value">${esc(d.value)}</span><span class="u ed" data-bind="${B}.divisions.${i}.unit">${esc(d.unit)}</span></div><div class="sub ed" data-bind="${B}.divisions.${i}.sub">${esc(d.sub)}</div><div class="dl ed" data-bind="${B}.divisions.${i}.delta">${esc(d.delta)}</div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.market_title">${esc(p.market_title)}</div><div class="grid g4 markets">`;
    p.markets.forEach((m,i)=>{body+=`<div class="statbox mkt"><div class="flag">${iconSlot('icon_mkt_'+i,m.flag)}</div><div class="name ed" data-bind="${B}.markets.${i}.name">${esc(m.name)}</div><div class="val"><span class="ed" data-bind="${B}.markets.${i}.value">${esc(m.value)}</span><span class="u ed" data-bind="${B}.markets.${i}.unit">${esc(m.unit)}</span></div><div class="dl ed" data-bind="${B}.markets.${i}.delta">${esc(m.delta)}</div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.kpi_title">${esc(p.kpi_title)}</div><div class="grid g3 kpis">`;
    
    p.kpis.forEach((k,i)=>{body+=`<div class="card kpi"><div class="icon">${iconSlot('icon_kpi_'+i,k.icon||'\u2B50')}</div><div class="klbl ed" data-bind="${B}.kpis.${i}.label">${esc(k.label)}</div><div class="kval ed" data-bind="${B}.kpis.${i}.value">${esc(k.value)}</div><div class="kdl ${k.dir}"><span class="ed" data-bind="${B}.kpis.${i}.delta">${esc(k.delta)}</span></div><div class="knote ed" data-bind="${B}.kpis.${i}.note">${esc(k.note)}</div></div>`;});
    body+=`</div><div class="footnote ed" data-bind="${B}.kpi_footnote">${esc(p.kpi_footnote)}</div>`;
  } else if(p.layout==='product'){
    body+=`<div class="pink-head ed" data-bind="${B}.releases_title">${esc(p.releases_title)}</div><div class="grid g3">`;
    p.releases.forEach((r,i)=>{body+=`<div class="card rel"><div class="n ed" data-bind="${B}.releases.${i}.n">${esc(r.n)}</div>${slot(r.img,'mediafill')}<div class="cap"><span class="ed b" data-bind="${B}.releases.${i}.bold">${esc(r.bold)}</span><span class="ed" data-bind="${B}.releases.${i}.text">${esc(r.text)}</span></div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.upcoming_title">${esc(p.upcoming_title)}</div><div class="card">${edList(p.upcoming,B+'.upcoming','upcoming')}</div>`;
    body+=`<div class="awards">`+p.awards.map((a,i)=>`<div class="aw"><span class="ed tag" data-bind="${B}.awards.${i}.tag">${esc(a.tag)}</span><span class="ed" data-bind="${B}.awards.${i}.text">${esc(a.text)}</span></div>`).join('')+`</div>`;
  } else if(p.layout==='operations'){
    body+=`<div class="pink-head ed" data-bind="${B}.highlights_title">${esc(p.highlights_title)}</div><div class="grid g3">`;
    p.op_cards.forEach((c,i)=>{body+=`<div class="card opcard">${runs(c,`${B}.op_cards.${i}`)}</div>`;});
    body+=`</div><div class="gallery">`+p.gallery.map((g,i)=>slot(g,i===3?'tall':'')).join('')+`</div>`;
    body+=`<div class="pink-head ed" data-bind="${B}.focus_title">${esc(p.focus_title)}</div><div class="card">${edList(p.focus,B+'.focus')}</div>`;
  } else if(p.layout==='brands'){
    p.sections.forEach((sec,si)=>{body+=`<div class="section-band ed" data-bind="${B}.sections.${si}.name">${esc(sec.name)}</div><div class="grid g2">`;
      sec.brands.forEach((br,bi)=>{const base=`${B}.sections.${si}.brands.${bi}`;const bul=br.bullets.map((x,xi)=>`<li>${runs(x,base+'.bullets.'+xi)}</li>`).join('');
        body+=`<div class="card brandcard" ${br.wide?'style="grid-column:1/-1"':''}><div class="bhead"><div class="bleft">${logoSlot(br.logoSlot)}<div class="bname ed" data-bind="${base}.name">${esc(br.name)}</div></div>${feBadge(base,br)}</div><ul class="bul">${bul}</ul></div>`;});
      body+=`</div>`;});
  } else if(p.layout==='brands2'){
    const pm=p.primark,base=`${B}.primark`;
    body+=`<div class="section-band ed" data-bind="${B}.primark_band">${esc(p.primark_band)}</div><div class="card brandcard"><div class="bhead"><div class="bleft">${logoSlot(pm.logoSlot)}<div class="bname ed" data-bind="${base}.name">${esc(pm.name)}</div></div>${feBadge(base,pm)}</div><p style="font-size:14.5px;margin-bottom:10px" class="ed" data-bind="${base}.intro">${esc(pm.intro)}</p><ul class="bul">${pm.bullets.map((x,xi)=>`<li>${runs(x,base+'.bullets.'+xi)}</li>`).join('')}</ul><p style="font-size:14.5px;margin-top:10px">${runs(pm.next,base+'.next')}</p></div>`;
    body+=`<div class="section-band ed" data-bind="${B}.hospitality_title">${esc(p.hospitality_title)}</div><div class="grid g3">`;
    p.hospitality.forEach((br,bi)=>{const hb=`${B}.hospitality.${bi}`;body+=`<div class="card brandcard"><div class="bhead"><div class="bleft">${logoSlot(br.logoSlot)}<div class="bname ed" data-bind="${hb}.name">${esc(br.name)}</div></div>${feBadge(hb,br)}</div><ul class="bul">${br.bullets.map((x,xi)=>`<li>${runs(x,hb+'.bullets.'+xi)}</li>`).join('')}</ul></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.deepdive_title">${esc(p.deepdive_title)}</div>`;
    const c=p.chart;
    const legend=c.legend.map((l,i)=>`<span><i style="background:${c.colors[i]}"></i><span class="ed" data-bind="${B}.chart.legend.${i}">${esc(l)}</span></span>`).join('');
    const bars=c.groups.map((g,gi)=>`<div class="bgroup">`+g.values.map((v,vi)=>`<div class="bar" style="background:${c.colors[vi]};height:${v}%"><span class="pct ed" data-bind="${B}.chart.groups.${gi}.values.${vi}" data-chart="1">${esc(v)}</span></div>`).join('')+`</div>`).join('');
    const blabels=c.groups.map((g,gi)=>`<div class="ed" data-bind="${B}.chart.groups.${gi}.label">${esc(g.label)}</div>`).join('');
    body+=`<div class="deepdive"><div class="dd-text">${p.deepdive_paras.map((pr,pri)=>`<p>${paraRuns(pr,B+'.deepdive_paras.'+pri)}</p>`).join('')}</div><div class="chart"><div class="legend">${legend}</div><div class="bars">${bars}</div><div class="blabels">${blabels}</div></div></div>`;
  } else if(p.layout==='campaigns'){
    body+=`<div class="pink-head ed" data-bind="${B}.campaigns_title">${esc(p.campaigns_title)}</div><div class="kpibar ed" data-bind="${B}.kpi_bar">${esc(p.kpi_bar)}</div><div class="camps">`;
    p.campaigns.forEach((c,i)=>{const base=`${B}.campaigns.${i}`;body+=`<div class="card camp">${slot(c.img,'mediafill')}<div class="cbody"><div class="cdate ed" data-bind="${base}.date">${esc(c.date)}</div><div class="cname ed" data-bind="${base}.name">${esc(c.name)}</div><div class="row"><span class="k ed" data-bind="${base}.objLabel">${esc(c.objLabel)}</span> <span class="ed" data-bind="${base}.objective">${esc(c.objective)}</span></div><div class="row"><span class="k ed" data-bind="${base}.mechLabel">${esc(c.mechLabel)}</span> <span class="ed" data-bind="${base}.mechanic">${esc(c.mechanic)}</span></div></div></div>`;});
    body+=`</div>`;
    if(p.closing){body+=`<div class="closing"><div class="big ed" data-bind="${B}.closing.big">${esc(p.closing.big)}</div><div class="small"><span class="ed" data-bind="${B}.closing.small_pre">${esc(p.closing.small_pre)}</span><b class="ed" data-bind="${B}.closing.small_bold">${esc(p.closing.small_bold)}</b></div></div>`;}
  }
