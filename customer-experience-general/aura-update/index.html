  if(p.layout==='performance'){const hs=p.hero_stat;
    body+=`<div class="perf-top"><div class="card"><ul class="bul">${p.highlights.map((v,i)=>`<li><span class="ed" data-bind="${B}.highlights.${i}">${esc(v)}</span><button class="li-del" data-del="${B}.highlights.${i}">×</button></li>`).join('')}</ul><button class="li-add" data-add="${B}.highlights">+ Add line</button></div>
      <div class="hero-stat"><div class="lbl ed" data-bind="${B}.hero_stat.label">${esc(hs.label)}</div><div class="big"><span class="ed" data-bind="${B}.hero_stat.value">${esc(hs.value)}</span><span class="u ed" data-bind="${B}.hero_stat.unit">${esc(hs.unit)}</span></div><div class="chips"><span class="chip pos ed" data-bind="${B}.hero_stat.delta_pos">${esc(hs.delta_pos)}</span><span class="chip neg ed" data-bind="${B}.hero_stat.delta_neg">${esc(hs.delta_neg)}</span></div><div class="nt ed" data-bind="${B}.hero_stat.note">${esc(hs.note)}</div></div></div>`;
    body+=`<div class="pink-head ed" data-bind="${B}.division_title">${esc(p.division_title)}</div><div class="grid g4">`;
    p.divisions.forEach((d,i)=>{body+=`<div class="statbox"><div class="head ed" data-bind="${B}.divisions.${i}.name">${esc(d.name)}</div><div class="val"><span class="ed" data-bind="${B}.divisions.${i}.value">${esc(d.value)}</span><span class="u ed" data-bind="${B}.divisions.${i}.unit">${esc(d.unit)}</span></div><div class="sub ed" data-bind="${B}.divisions.${i}.sub">${esc(d.sub)}</div><div class="dl ed" data-bind="${B}.divisions.${i}.delta">${esc(d.delta)}</div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.market_title">${esc(p.market_title)}</div><div class="grid g4 markets">`;
    p.markets.forEach((m,i)=>{body+=`<div class="statbox mkt"><div class="flag">${iconSlot('icon_mkt_'+i,m.flag)}</div><div class="name ed" data-bind="${B}.markets.${i}.name">${esc(m.name)}</div><div class="val"><span class="ed" data-bind="${B}.markets.${i}.value">${esc(m.value)}</span><span class="u ed" data-bind="${B}.markets.${i}.unit">${esc(m.unit)}</span></div><div class="dl ed" data-bind="${B}.markets.${i}.delta">${esc(m.delta)}</div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.kpi_title">${esc(p.kpi_title)}</div><div class="grid g3 kpis">`;
    
    p.kpis.forEach((k,i)=>{body+=`<div class="card kpi"><div class="icon">${iconSlot('icon_kpi_'+i,k.icon||'\u2B50')}</div><div class="klbl ed" data-bind="${B}.kpis.${i}.label">${esc(k.label)}</div><div class="kval ed" data-bind="${B}.kpis.${i}.value">${esc(k.value)}</div><div class="kdl ${k.dir}"><span class="ed" data-bind="${B}.kpis.${i}.delta">${esc(k.delta)}</span></div><div class="knote ed" data-bind="${B}.kpis.${i}.note">${esc(k.note)}</div></div>`;});
    body+=`</div><div class="footnote ed" data-bind="${B}.kpi_footnote">${esc(p.kpi_footnote)}</div>`;
  } else if(p.layout==='product'){
    body+=`<div class="pink-head ed" data-bind="${B}.releases_title">${esc(p.releases_title)}</div><div class="grid g3">`;
    p.releases.forEach((r,i)=>{body+=`<div class="card rel"><div class="n ed" data-bind="${B}.releases.${i}.n">${esc(r.n)}</div>${slot(r.img)}<div class="cap"><span class="ed b" data-bind="${B}.releases.${i}.bold">${esc(r.bold)}</span><span class="ed" data-bind="${B}.releases.${i}.text">${esc(r.text)}</span></div></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.upcoming_title">${esc(p.upcoming_title)}</div><div class="card">${edList(p.upcoming,B+'.upcoming','upcoming')}</div>`;
    body+=`<div class="awards">`+p.awards.map((a,i)=>`<div class="aw"><span class="ed tag" data-bind="${B}.awards.${i}.tag">${esc(a.tag)}</span><span class="ed" data-bind="${B}.awards.${i}.text">${esc(a.text)}</span></div>`).join('')+`</div>`;
  } else if(p.layout==='operations'){
    body+=`<div class="pink-head ed" data-bind="${B}.highlights_title">${esc(p.highlights_title)}</div><div class="grid g3">`;
    p.op_cards.forEach((c,i)=>{body+=`<div class="card opcard">${runs(c,`${B}.op_cards.${i}`)}</div>`;});
    body+=`</div><div class="gallery">`+p.gallery.map((g,i)=>slot(g,i===3?'tall':'')).join('')+`</div>`;
    body+=`<div class="pink-head ed" data-bind="${B}.focus_title">${esc(p.focus_title)}</div><div class="card">${edList(p.focus,B+'.focus')}</div>`;
  } else if(p.layout==='brands'){
    p.sections.forEach((sec,si)=>{body+=`<div class="section-band ed" data-bind="${B}.sections.${si}.name">${esc(sec.name)}</div><div class="grid g2">`;
      sec.brands.forEach((br,bi)=>{const base=`${B}.sections.${si}.brands.${bi}`;const bul=br.bullets.map((x,xi)=>`<li>${runs(x,base+'.bullets.'+xi)}</li>`).join('');
        body+=`<div class="card brandcard" ${br.wide?'style="grid-column:1/-1"':''}><div class="bhead"><div class="bleft">${logoSlot(br.logoSlot)}<div class="bname ed" data-bind="${base}.name">${esc(br.name)}</div></div>${feBadge(base,br)}</div><ul class="bul">${bul}</ul></div>`;});
      body+=`</div>`;});
  } else if(p.layout==='brands2'){
    const pm=p.primark,base=`${B}.primark`;
    body+=`<div class="section-band ed" data-bind="${B}.primark_band">${esc(p.primark_band)}</div><div class="card brandcard"><div class="bhead"><div class="bleft">${logoSlot(pm.logoSlot)}<div class="bname ed" data-bind="${base}.name">${esc(pm.name)}</div></div>${feBadge(base,pm)}</div><p style="font-size:14.5px;margin-bottom:10px" class="ed" data-bind="${base}.intro">${esc(pm.intro)}</p><ul class="bul">${pm.bullets.map((x,xi)=>`<li>${runs(x,base+'.bullets.'+xi)}</li>`).join('')}</ul><p style="font-size:14.5px;margin-top:10px">${runs(pm.next,base+'.next')}</p></div>`;
    body+=`<div class="section-band ed" data-bind="${B}.hospitality_title">${esc(p.hospitality_title)}</div><div class="grid g3">`;
    p.hospitality.forEach((br,bi)=>{const hb=`${B}.hospitality.${bi}`;body+=`<div class="card brandcard"><div class="bhead"><div class="bleft">${logoSlot(br.logoSlot)}<div class="bname ed" data-bind="${hb}.name">${esc(br.name)}</div></div>${feBadge(hb,br)}</div><ul class="bul">${br.bullets.map((x,xi)=>`<li>${runs(x,hb+'.bullets.'+xi)}</li>`).join('')}</ul></div>`;});
    body+=`</div><div class="pink-head ed" data-bind="${B}.deepdive_title">${esc(p.deepdive_title)}</div>`;
    const c=p.chart;
    const legend=c.legend.map((l,i)=>`<span><i style="background:${c.colors[i]}"></i><span class="ed" data-bind="${B}.chart.legend.${i}">${esc(l)}</span></span>`).join('');
    const bars=c.groups.map((g,gi)=>`<div class="bgroup">`+g.values.map((v,vi)=>`<div class="bar" style="background:${c.colors[vi]};height:${v}%"><span class="pct ed" data-bind="${B}.chart.groups.${gi}.values.${vi}" data-chart="1">${esc(v)}</span></div>`).join('')+`</div>`).join('');
    const blabels=c.groups.map((g,gi)=>`<div class="ed" data-bind="${B}.chart.groups.${gi}.label">${esc(g.label)}</div>`).join('');
    body+=`<div class="deepdive"><div class="dd-text">${p.deepdive_paras.map((pr,pri)=>`<p>${paraRuns(pr,B+'.deepdive_paras.'+pri)}</p>`).join('')}</div><div class="chart"><div class="legend">${legend}</div><div class="bars">${bars}</div><div class="blabels">${blabels}</div></div></div>`;
  } else if(p.layout==='campaigns'){
    body+=`<div class="pink-head ed" data-bind="${B}.campaigns_title">${esc(p.campaigns_title)}</div><div class="kpibar ed" data-bind="${B}.kpi_bar">${esc(p.kpi_bar)}</div><div class="camps">`;
    p.campaigns.forEach((c,i)=>{const base=`${B}.campaigns.${i}`;body+=`<div class="card camp">${slot(c.img)}<div class="cbody"><div class="cdate ed" data-bind="${base}.date">${esc(c.date)}</div><div class="cname ed" data-bind="${base}.name">${esc(c.name)}</div><div class="row"><span class="k ed" data-bind="${base}.objLabel">${esc(c.objLabel)}</span> <span class="ed" data-bind="${base}.objective">${esc(c.objective)}</span></div><div class="row"><span class="k ed" data-bind="${base}.mechLabel">${esc(c.mechLabel)}</span> <span class="ed" data-bind="${base}.mechanic">${esc(c.mechanic)}</span></div></div></div>`;});
    body+=`</div>`;
    if(p.closing){body+=`<div class="closing"><div class="big ed" data-bind="${B}.closing.big">${esc(p.closing.big)}</div><div class="small"><span class="ed" data-bind="${B}.closing.small_pre">${esc(p.closing.small_pre)}</span><b class="ed" data-bind="${B}.closing.small_bold">${esc(p.closing.small_bold)}</b></div></div>`;}
  }
  return `<section class="page" data-i="${pi}">${head}${body}</section>`;
}
function render(){stage.innerHTML=DATA.pages.map((_,i)=>renderPage(i)).join('');dotsEl.innerHTML=DATA.pages.map((_,i)=>`<button class="dot" data-i="${i}" aria-label="Go to page ${i+1}"></button>`).join('');go(cur,true);applyEdit();}
function go(i){cur=Math.max(0,Math.min(DATA.pages.length-1,i));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',+p.dataset.i===cur));document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',+d.dataset.i===cur));fill.style.width=((cur+1)/DATA.pages.length*100)+'%';counter.textContent=String(cur+1).padStart(2,'0')+' / '+String(DATA.pages.length).padStart(2,'0');$('#prev').disabled=cur===0;$('#next').disabled=cur===DATA.pages.length-1;stage.scrollTop=0;if(stage.scrollTo)stage.scrollTo(0,0);var _ap=document.querySelector('.page.active');if(_ap)_ap.scrollTop=0;}
function applyEdit(){document.body.classList.toggle('editing',edit);document.querySelectorAll('.ed').forEach(e=>e.contentEditable=edit);}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900);}
stage.addEventListener('input',e=>{const el=e.target.closest('.ed');if(!el||!edit)return;const path=el.getAttribute('data-bind');if(path)setP(DATA,path,el.innerText);if(el.dataset.chart){const bar=el.closest('.bar');const n=parseFloat(el.innerText)||0;bar.style.height=Math.max(0,Math.min(100,n))+'%';}});
stage.addEventListener('click',e=>{if(!edit)return;const s=e.target.closest('.imgslot');if(s){pickImage(s);return;}const del=e.target.closest('[data-del]');if(del){const p=del.getAttribute('data-del');const parts=p.split('.');const idx=+parts.pop();getP(DATA,parts.join('.')).splice(idx,1);const pg=cur;render();go(pg);return;}const add=e.target.closest('[data-add]');if(add){getP(DATA,add.getAttribute('data-add')).push('New line');const pg=cur;render();go(pg);}});
let fileInput;
function pickImage(s){const id=s.dataset.slot;if(!fileInput){fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='image/*';document.body.appendChild(fileInput);}fileInput.onchange=()=>{const f=fileInput.files[0];if(f)readImg(f,id,s);fileInput.value='';};fileInput.click();}
function readImg(f,id,s){var ext=(f.name.split('.').pop()||'png').toLowerCase().replace(/[^a-z0-9]/g,'')||'png';var path='images/'+id+'.'+ext;var url=URL.createObjectURL(f);pending[id]={blob:f,url:url,path:path};DATA.assets[id]=path;s.querySelector('img').src=url;s.classList.remove('empty');s.classList.add('filled');toast(s.dataset.logo?'Logo added':(s.dataset.icon?'Icon updated':'Image updated'));}
stage.addEventListener('dragover',e=>{if(!edit)return;const s=e.target.closest('.imgslot');if(s){e.preventDefault();s.classList.add('drag');}});
stage.addEventListener('dragleave',e=>{const s=e.target.closest('.imgslot');if(s)s.classList.remove('drag');});
stage.addEventListener('drop',e=>{if(!edit)return;const s=e.target.closest('.imgslot');if(s){e.preventDefault();s.classList.remove('drag');const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))readImg(f,s.dataset.slot,s);}});
function openLock(){if(edit){exitEdit();return;}$('#pcInput').value='';$('#pcErr').textContent='';$('#pcModal').classList.add('on');setTimeout(()=>$('#pcInput').focus(),50);}
function tryUnlock(){if($('#pcInput').value===DATA.meta.passcode){$('#pcModal').classList.remove('on');edit=true;applyEdit();toast('Edit mode on — click any text, or a logo box to upload');}else{$('#pcErr').textContent='Incorrect passcode';}}
function exitEdit(){edit=false;applyEdit();toast('Edit mode off');}
function changePass(){const n=prompt('Set a new edit passcode:',DATA.meta.passcode);if(n&&n.trim()){DATA.meta.passcode=n.trim();toast('Passcode updated — download to save');}}
function exportSite(){if(document.activeElement)document.activeElement.blur();if(typeof JSZip==='undefined'){alert('The packaging library did not load. Please open and edit your published site link, then export.');return;}toast('Building ZIP\u2026');var zip=new JSZip();var ds=document.getElementById('aura-data');ds.textContent=JSON.stringify(DATA).replace(/</g,'\\u003c');var app=document.getElementById('stage');var keep=app.innerHTML;app.innerHTML='';var wasE=document.body.classList.contains('editing');document.body.classList.remove('editing');var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;app.innerHTML=keep;if(wasE)document.body.classList.add('editing');zip.file('index.html',html);var jobs=[];var seen={};var missing=[];for(var id in DATA.assets){var path=DATA.assets[id];if(!path||seen[path])continue;seen[path]=1;if(pending[id]&&pending[id].path===path){zip.file(path,pending[id].blob);}else{(function(pp){jobs.push(fetch(pp).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(bl){zip.file(pp,bl);}).catch(function(){missing.push(pp);}));})(path);}}['fonts/IsidoraSans-Regular.ttf','fonts/IsidoraSans-Medium.ttf','fonts/IsidoraSans-Bold.ttf','jszip.min.js'].forEach(function(f){jobs.push(fetch(f).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(bl){zip.file(f,bl);}).catch(function(){}));});Promise.all(jobs).then(function(){return zip.generateAsync({type:'blob'});}).then(function(blob){var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='aura-newsletter-site.zip';a.click();URL.revokeObjectURL(url);if(missing.length){alert('Exported, but '+missing.length+' existing image(s) could not be read \u2014 this happens when editing the local file. For a complete site, open and edit your published link instead.');}else{toast('ZIP ready \u2014 unzip and upload the folder to your site');}});}
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
dotsEl.addEventListener('click',e=>{const d=e.target.closest('.dot');if(d)go(+d.dataset.i);});
$('#lockBtn').onclick=openLock;$('#pcGo').onclick=tryUnlock;$('#pcCancel').onclick=()=>$('#pcModal').classList.remove('on');
$('#pcInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryUnlock();});
$('#eDownload').onclick=exportSite;$('#eExit').onclick=exitEdit;$('#ePass').onclick=changePass;
document.addEventListener('keydown',e=>{if(edit||$('#pcModal').classList.contains('on'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
let sx=0;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{if(edit)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){if(dx<0)go(cur+1);else go(cur-1);}});
render();
</script></body></html>
