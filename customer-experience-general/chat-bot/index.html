"}, "source": {"en": "The Art of Service Recovery", "ar": "فن معالجة الخدمة"}}, {"id": "sr-follow", "keywords_en": "following through promise kept check another store speak manager follow up reliability integrity", "keywords_ar": "الوفاء بالوعد التزام تحقق فرع آخر التحدث مع المدير متابعة موثوقية نزاهة عميل عملاء", "en": {"title": "Following through", "body": "A promise only builds trust when it's kept. If you tell a customer you'll check another store, speak with a manager, follow up, or find more information — make sure it happens. Reliability strengthens customer confidence, and following through demonstrates integrity."}, "ar": {"title": "الوفاء بما وعدت", "body": "الوعد لا يبني ثقة إلا إذا نُفّذ. إن قلت للزبون إنك ستتحقّق من فرع آخر، أو ستتحدّث مع المدير، أو ستتابع الأمر، أو ستجد معلومات إضافية — فتأكّد أن ذلك يحدث فعلاً. الموثوقية تقوّي ثقة الزبون، والوفاء يُظهر النزاهة."}, "source": {"en": "The Art of Service Recovery", "ar": "فن معالجة الخدمة"}}, {"id": "sr-mistakes", "keywords_en": "recovery mistakes avoid interrupting defensive blaming negative language promises rushing policy only ending early", "keywords_ar": "أخطاء المعالجة تجنب مقاطعة دفاعي لوم لغة سلبية وعود استعجال سياسة فقط عميل عملاء", "en": {"title": "Common service recovery mistakes", "body": "Avoid: interrupting the customer; becoming defensive; blaming colleagues or other departments; using negative language; making promises you can't keep; rushing the conversation; ignoring customer emotions; focusing only on policy instead of possible solutions; and ending the conversation before confirming satisfaction. Customers remember how challenges were handled."}, "ar": {"title": "أخطاء شائعة في معالجة الخدمة", "body": "تجنّب: مقاطعة الزبون؛ الدفاع عن النفس؛ لوم الزملاء أو الأقسام الأخرى؛ اللغة السلبية؛ قطع وعود لا يمكنك الوفاء بها؛ استعجال الحوار؛ تجاهل مشاعر الزبون؛ التركيز على السياسة فقط بدل الحلول الممكنة؛ وإنهاء الحوار قبل التأكّد من الرضا. الزبائن يتذكّرون كيف عولجت التحديات."}, "source": {"en": "The Art of Service Recovery", "ar": "فن معالجة الخدمة"}}, {"id": "ac-why", "keywords_en": "angry customer emotions why frustrated reasons expectations delays miscommunication personal stress not personal", "keywords_ar": "زبون غاضب مشاعر لماذا محبط أسباب توقعات تأخير سوء تفاهم ضغط شخصي ليس شخصياً عميل عملاء", "en": {"title": "Understanding customer anger", "body": "Customers rarely become angry without a reason — it may be unmet expectations, delays or waiting, product concerns, miscommunication, confusion about policies, previous experiences, or personal stress unrelated to the store. Remember: the frustration is usually directed at the situation, not at you personally. Understanding this helps you respond professionally instead of emotionally."}, "ar": {"title": "فهم غضب الزبون", "body": "نادراً ما يغضب الزبون بلا سبب — قد يكون توقّعات لم تُلبَّ، أو تأخيراً وانتظاراً، أو مخاوف بشأن المنتج، أو سوء تفاهم، أو التباساً في السياسات، أو تجارب سابقة، أو ضغطاً شخصياً لا علاقة له بالمتجر. تذكّر: الإحباط غالباً موجّه للموقف لا لك شخصياً. فهم ذلك يساعدك على الرد بمهنية لا بانفعال."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-calm", "keywords_en": "stay calm first attitude tone voice steady body language mirror contagious defending upset shouting", "keywords_ar": "ابق هادئاً أولاً نبرة صوت ثابت لغة الجسد يعكس معدٍ دفاع منزعج صراخ عميل عملاء", "en": {"title": "Stay calm first", "body": "Your attitude sets the tone. When customers become upset: take a moment before responding, keep your voice calm and steady, maintain positive body language, avoid showing frustration, and focus on helping rather than defending. Customers often begin to mirror your calm behaviour — professionalism is contagious."}, "ar": {"title": "ابقَ هادئاً أولاً", "body": "موقفك يحدّد أجواء الحوار. حين ينزعج الزبون: خذ لحظة قبل الرد، وحافظ على هدوء صوتك وثباته، والزم لغة جسد إيجابية، وتجنّب إظهار الانزعاج، وركّز على المساعدة لا على الدفاع. غالباً ما يبدأ الزبون بمحاكاة هدوئك — فالمهنية مُعدية."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-language", "keywords_en": "positive language words instead i dont know impossible you cant its policy let me find out options", "keywords_ar": "لغة إيجابية كلمات بدل لا أعرف مستحيل لا تستطيع إنها السياسة دعني أتحقق خيارات عميل عملاء", "en": {"title": "Choose positive language", "body": "The words you use influence how customers feel. Instead of \"I don't know,\" \"that's impossible,\" \"you can't,\" or \"it's policy,\" try: \"let me find out,\" \"here's what we can do,\" \"let's explore the available options,\" \"I'll explain how this works.\" Positive language creates hope without making unrealistic promises."}, "ar": {"title": "اختر لغة إيجابية", "body": "الكلمات التي تستخدمها تؤثّر على شعور الزبون. بدل «لا أعرف» أو «هذا مستحيل» أو «لا تستطيع» أو «هذه هي السياسة»، جرّب: «دعني أتحقّق»، «إليك ما يمكننا فعله»، «لنستكشف الخيارات المتاحة»، «سأشرح لك كيف يعمل هذا». اللغة الإيجابية تصنع أملاً دون وعود غير واقعية."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-policy", "keywords_en": "explaining policy thats our policy empathy reason alternatives outcome hoping not the answer wanted", "keywords_ar": "شرح السياسة هذه سياستنا تعاطف سبب بدائل نتيجة يأمل ليست الإجابة عميل عملاء", "en": {"title": "When policies need explaining", "body": "Sometimes the answer isn't the one the customer hoped for. Start with empathy, then explain the reason clearly, then explore any available alternatives. Instead of \"that's our policy,\" try: \"I understand this isn't the outcome you were hoping for. Let me explain how our policy works and see what options are available.\" Customers accept more when they understand both the reason and the choices."}, "ar": {"title": "حين تحتاج السياسة إلى شرح", "body": "أحياناً لا تكون الإجابة هي ما تمنّاه الزبون. ابدأ بالتعاطف، ثم اشرح السبب بوضوح، ثم استكشف البدائل المتاحة. بدل «هذه سياستنا» جرّب: «أتفهّم أن هذه ليست النتيجة التي تمنّيتها. دعني أشرح كيف تعمل سياستنا ونرى الخيارات المتاحة». الزبائن يتقبّلون أكثر حين يفهمون السبب والخيارات معاً."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-escalating", "keywords_en": "escalating situation emotions rising space one issue at a time slowly arguing raising voice manager", "keywords_ar": "تصاعد الموقف مشاعر مساحة مسألة واحدة ببطء جدال رفع الصوت مدير عميل عملاء", "en": {"title": "Managing escalating situations", "body": "If emotions keep rising: remain calm, speak slowly, avoid arguing, avoid raising your voice, give the customer space if appropriate, and focus on one issue at a time. If the situation continues to escalate, involve your manager or the appropriate colleague according to store procedures. Seeking support demonstrates professionalism."}, "ar": {"title": "إدارة المواقف المتصاعدة", "body": "إذا استمرّت المشاعر بالتصاعد: ابقَ هادئاً، وتحدّث ببطء، وتجنّب الجدال، وتجنّب رفع صوتك، وامنح الزبون مساحة إن كان مناسباً، وركّز على مسألة واحدة في كل مرة. وإن استمر التصاعد فأشرك مديرك أو الزميل المناسب حسب إجراءات المتجر. طلب الدعم دليل مهنية."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-space", "keywords_en": "personal space body language distance pointing open posture eye contact non verbal comfortable", "keywords_ar": "مساحة شخصية لغة الجسد مسافة إشارة وضعية منفتحة تواصل بصري غير لفظي راحة عميل عملاء", "en": {"title": "Respect personal space", "body": "Body language matters. Maintain an appropriate distance, avoid pointing, keep an open posture, maintain appropriate eye contact, and allow customers enough personal space to feel comfortable. Your non-verbal communication often speaks louder than your words."}, "ar": {"title": "احترم المساحة الشخصية", "body": "لغة الجسد مهمة. حافظ على مسافة مناسبة، وتجنّب الإشارة بالإصبع، والزم وضعية منفتحة، وحافظ على تواصل بصري مناسب، وامنح الزبون مساحة شخصية كافية ليشعر بالراحة. تواصلك غير اللفظي غالباً أعلى صوتاً من كلماتك."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-winning", "keywords_en": "never about winning right prove argument blaming defensive matching tone technically correct treated", "keywords_ar": "ليس فوزاً على حق إثبات جدال لوم دفاع محاكاة النبرة صحيح تقنياً معاملة عميل عملاء", "en": {"title": "Never make it about winning", "body": "The objective is not to prove who is right — it's to create the best possible customer experience. Avoid arguing, interrupting, blaming, becoming defensive, or matching the customer's tone. Instead focus on understanding, respect, solutions and professionalism. Customers remember how they were treated far more than who was technically correct."}, "ar": {"title": "لا تجعلها معركة تُربح", "body": "الهدف ليس إثبات من على حق — بل صنع أفضل تجربة ممكنة للزبون. تجنّب الجدال، والمقاطعة، واللوم، والدفاع عن النفس، ومحاكاة نبرة الزبون. وركّز بدلاً من ذلك على الفهم والاحترام والحلول والمهنية. الزبائن يتذكّرون كيف عوملوا أكثر بكثير ممن كان على صواب تقنياً."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "ac-mistakes", "keywords_en": "angry mistakes avoid interrupting raising voice personally calm down blaming policy arguing walking away", "keywords_ar": "أخطاء الغضب تجنب مقاطعة رفع الصوت شخصياً اهدأ لوم السياسة جدال الانصراف عميل عملاء", "en": {"title": "Common mistakes with angry customers", "body": "During difficult conversations avoid: interrupting; raising your voice; taking comments personally; saying \"calm down\"; blaming company policy; arguing about facts; promising outcomes you cannot deliver; speaking negatively about colleagues or other departments; walking away without explanation; and forgetting to thank the customer. These behaviours increase frustration rather than reduce it."}, "ar": {"title": "أخطاء شائعة مع الزبون الغاضب", "body": "في الحوارات الصعبة تجنّب: المقاطعة؛ رفع الصوت؛ أخذ الكلام على محمل شخصي؛ قول «اهدأ»؛ لوم سياسة الشركة؛ الجدال حول الوقائع؛ الوعد بنتائج لا يمكنك تحقيقها؛ التحدّث سلباً عن الزملاء أو الأقسام؛ الانصراف دون توضيح؛ ونسيان شكر الزبون. هذه السلوكيات تزيد الإحباط بدل أن تخفّفه."}, "source": {"en": "Handling Angry Customers", "ar": "التعامل مع الزبائن الغاضبين"}}, {"id": "gs-atv", "keywords_en": "atv average transaction value what is spend more complete handbag wallet trainers socks measures", "keywords_ar": "متوسط قيمة الفاتورة ما هو إنفاق أكثر مكمل حقيبة محفظة حذاء جوارب مقاييس عميل عملاء", "en": {"title": "What is ATV (Average Transaction Value)?", "body": "ATV is simply the average amount a customer spends in one purchase. It doesn't mean encouraging customers to spend unnecessarily — it means helping them discover products that genuinely improve their purchase. A customer buying a handbag may appreciate a matching wallet or care product; someone buying trainers may benefit from suitable socks or shoe care. The goal is a more complete shopping experience."}, "ar": {"title": "ما هو متوسط قيمة الفاتورة؟", "body": "متوسط قيمة الفاتورة هو ببساطة المبلغ الوسطي الذي ينفقه الزبون في عملية شراء واحدة. لا يعني تشجيع الزبون على الإنفاق بلا داعٍ — بل مساعدته على اكتشاف منتجات تحسّن شراءه فعلاً. من يشتري حقيبة قد يقدّر محفظة مطابقة أو منتج عناية؛ ومن يشتري حذاءً رياضياً قد يستفيد من جوارب مناسبة أو عناية بالأحذية. الهدف تجربة تسوّق أكمل."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "gs-solutions", "keywords_en": "recommend solutions not products problems anything else make purchase better outfit routine coordinating", "keywords_ar": "أوصِ بحلول لا منتجات مشاكل أي شيء آخر تحسين الشراء إطلالة روتين تنسيق عميل عملاء", "en": {"title": "Recommend solutions, not products", "body": "Customers aren't simply buying products — they're solving problems. Instead of asking \"would you like anything else?\", think \"what would make this purchase even better for this customer?\" Fashion: complete the outfit with accessories. Beauty: recommend products that work together as a routine. Home: suggest coordinating or practical items. Health: recommend products that support their goals. Recommendations should always feel helpful."}, "ar": {"title": "أوصِ بحلول لا بمنتجات", "body": "الزبائن لا يشترون منتجات فحسب — بل يحلّون مشكلات. بدل سؤال «هل تريد شيئاً آخر؟» فكّر «ما الذي يجعل هذا الشراء أفضل لهذا الزبون؟» الأزياء: أكمل الإطلالة بالإكسسوارات. التجميل: أوصِ بمنتجات تعمل معاً كروتين. المنزل: اقترح قطعاً منسّقة أو عملية. الصحة: أوصِ بما يدعم أهدافه. يجب أن تبدو التوصية مفيدة دائماً."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "gs-timing", "keywords_en": "timing when recommend moments ask questions compare try on advice deciding checkout interrupting browsing", "keywords_ar": "التوقيت متى توصي لحظات أسئلة مقارنة تجربة نصيحة قرار دفع مقاطعة تصفح عميل عملاء", "en": {"title": "Timing makes the difference", "body": "Customers are more open to recommendations at certain moments — when they ask questions, compare products, try something on, ask for advice, decide between options, or prepare to check out. Avoid interrupting customers while they're still browsing independently. Good timing makes recommendations feel natural."}, "ar": {"title": "التوقيت يصنع الفرق", "body": "الزبائن أكثر تقبّلاً للتوصيات في لحظات معيّنة — حين يسألون، أو يقارنون المنتجات، أو يجرّبون شيئاً، أو يطلبون النصيحة، أو يوازنون بين خيارين، أو يستعدّون للدفع. تجنّب مقاطعتهم أثناء تصفّحهم المستقل. التوقيت الجيد يجعل التوصية تبدو طبيعية."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "gs-choices", "keywords_en": "offer choices not pressure many customers choose you may also like works well with obligated trust", "keywords_ar": "قدم خيارات لا ضغطاً كثير من الزبائن يختارون قد يعجبك يعمل جيداً مع إلزام ثقة عميل عملاء", "en": {"title": "Offer choices, not pressure", "body": "Customers enjoy making informed decisions. Present options confidently: \"Many customers choose this because…\", \"You may also like…\", \"This works really well with…\" Avoid making customers feel obligated. Helpful recommendations build trust; pressure damages it."}, "ar": {"title": "قدّم خيارات لا ضغطاً", "body": "الزبائن يستمتعون باتخاذ قرارات مبنية على معرفة. اعرض الخيارات بثقة: «كثير من الزبائن يختارون هذا لأن…»، «قد يعجبك أيضاً…»، «هذا يتناسب جيداً مع…». وتجنّب أن تجعل الزبون يشعر بالإلزام. التوصيات المفيدة تبني الثقة، والضغط يهدمها."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "gs-complete", "keywords_en": "complete journey didnt realise need garment care travel size matching replacement protective gift packaging", "keywords_ar": "إكمال الرحلة لم يدرك حاجته عناية بالملابس حجم سفر مطابق بديل واقي تغليف هدايا عميل عملاء", "en": {"title": "Complete the customer's journey", "body": "Sometimes customers don't realise they need something until you mention it. Helpful examples: a garment care product with clothing, a travel-size product for frequent travellers, matching accessories, replacement items, protective products, and gift packaging where appropriate. These suggestions often improve convenience for the customer."}, "ar": {"title": "أكمل رحلة الزبون", "body": "أحياناً لا يدرك الزبون حاجته لشيء حتى تذكره له. أمثلة مفيدة: منتج عناية بالأقمشة مع الملابس، أو حجم سفر لكثيري التنقّل، أو إكسسوارات مطابقة، أو قطع بديلة، أو منتجات حماية، أو تغليف هدايا عند الحاجة. هذه الاقتراحات غالباً تزيد راحة الزبون."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "gs-different", "keywords_en": "every customer different level assistance conversation independence cues adapt flexible personalisation", "keywords_ar": "كل زبون مختلف مستوى المساعدة حوار استقلالية إشارات تكيف مرونة تخصيص عميل عملاء", "en": {"title": "Every customer is different", "body": "Not every customer wants the same level of assistance — some enjoy conversation, some prefer independence. Observe customer cues and adapt your approach. Exceptional service is flexible, and personalisation creates stronger connections."}, "ar": {"title": "كل زبون مختلف", "body": "ليس كل زبون يريد نفس مستوى المساعدة — بعضهم يستمتع بالحوار، وبعضهم يفضّل الاستقلالية. راقب إشارات الزبون وكيّف أسلوبك. الخدمة الاستثنائية مرنة، والتخصيص يصنع تواصلاً أقوى."}, "source": {"en": "The Art of Growing Every Sale", "ar": "فن تنمية كل عملية بيع"}}, {"id": "on-onebrand", "keywords_en": "online in store one brand ecommerce app website same experience seamless channel click collect", "keywords_ar": "إلكتروني متجر علامة واحدة تطبيق موقع نفس التجربة سلس قناة استلام عميل عملاء", "en": {"title": "One brand, one customer experience", "body": "Customers don't separate \"online\" from \"in-store\" — to them it's one brand. Whether they bought through a website, app, or in store, they expect the same warm welcome, helpful advice, professional support, respect and clear communication. Even if the store can't directly resolve every online issue, every colleague can help customers take the next step."}, "ar": {"title": "علامة واحدة، تجربة واحدة", "body": "الزبائن لا يفصلون بين «الإلكتروني» و«المتجر» — فهي عندهم علامة واحدة. سواء اشتروا عبر الموقع أو التطبيق أو من المتجر، يتوقّعون نفس الترحيب الدافئ والنصيحة المفيدة والدعم المهني والاحترام والتواصل الواضح. وحتى إن لم يستطع المتجر حل كل مسألة إلكترونية، يستطيع كل زميل مساعدة الزبون على الخطوة التالية."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-questions", "keywords_en": "common online questions order status delivery delay returns exchanges missing damaged refund click collect", "keywords_ar": "أسئلة إلكترونية شائعة حالة الطلب تأخير توصيل إرجاع استبدال مفقود تالف استرداد عميل عملاء", "en": {"title": "Common online questions", "body": "Customers may visit the store asking about: order status, delivery delays, returns, exchanges, missing items, damaged products, incorrect items received, payment enquiries, refund updates, Click & Collect (where available), and product availability. Knowing these common enquiries helps you respond with confidence."}, "ar": {"title": "الأسئلة الإلكترونية الشائعة", "body": "قد يزور الزبون المتجر ليسأل عن: حالة الطلب، أو تأخير التوصيل، أو الإرجاع، أو الاستبدال، أو قطع مفقودة، أو منتجات تالفة، أو أصناف خاطئة، أو استفسارات الدفع، أو تحديثات الاسترداد، أو الاستلام من المتجر (حيثما توفّر)، أو توفّر المنتج. معرفة هذه الاستفسارات تساعدك على الرد بثقة."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-listen", "keywords_en": "listen before answer online when placed which brand confirmation delivered delivery payment product", "keywords_ar": "أصغِ قبل الإجابة إلكتروني متى الطلب أي علامة تأكيد تم التوصيل دفع منتج عميل عملاء", "en": {"title": "Listen before giving an answer", "body": "Before suggesting a solution, understand the situation. Ask simple questions: When was the order placed? Which brand was ordered? Has the customer received an order confirmation? Has the item already been delivered? Is the enquiry about delivery, payment, or the product itself? Taking time to understand avoids unnecessary confusion."}, "ar": {"title": "أصغِ قبل أن تجيب", "body": "قبل اقتراح حل، افهم الموقف. اطرح أسئلة بسيطة: متى تم الطلب؟ أي علامة تجارية؟ هل وصل الزبون تأكيد الطلب؟ هل تم التوصيل فعلاً؟ هل الاستفسار عن التوصيل أم الدفع أم المنتج نفسه؟ أخذ الوقت للفهم يمنع الالتباس."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-returns", "keywords_en": "online returns exchanges policy vary brand unused packaging proof purchase hygiene cosmetics lingerie swimwear", "keywords_ar": "إرجاع إلكتروني استبدال سياسة تختلف علامة غير مستخدم تغليف إثبات شراء صحية مستحضرات عميل عملاء", "en": {"title": "Online returns and exchanges", "body": "Many Alshaya brands allow online purchases to be returned or exchanged if the brand's conditions are met. In general: policies may vary between brands; items are usually expected to be unused with original packaging and proof of purchase; hygiene-sensitive products such as cosmetics, earrings, lingerie or swimwear may only be returnable if faulty or permitted by the brand's policy; and some returns may need to go through online customer support rather than in-store. Always confirm the latest policy for that specific brand before advising."}, "ar": {"title": "الإرجاع والاستبدال الإلكتروني", "body": "تسمح كثير من علامات ألشايا بإرجاع أو استبدال المشتريات الإلكترونية عند استيفاء شروط العلامة. عموماً: السياسات قد تختلف بين العلامات؛ ويُتوقّع عادة أن تكون القطعة غير مستخدمة مع تغليفها الأصلي وإثبات الشراء؛ والمنتجات الحسّاسة صحياً مثل مستحضرات التجميل والأقراط والملابس الداخلية وملابس السباحة قد لا تُرجع إلا إذا كانت معيبة أو سمحت سياسة العلامة؛ وبعض الإرجاعات قد تتم عبر دعم العملاء الإلكتروني لا من المتجر. تأكّد دائماً من أحدث سياسة للعلامة قبل نصح الزبون."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-refund", "keywords_en": "refund enquiries anxious waiting processing times payment method original approved track status promise date", "keywords_ar": "استفسارات الاسترداد قلق انتظار مدة المعالجة طريقة الدفع الأصلية موافقة تتبع حالة وعد بتاريخ عميل عملاء", "en": {"title": "Supporting refund enquiries", "body": "Customers sometimes become anxious waiting for a refund — stay reassuring. Explain that refund processing times vary depending on payment method and brand; that once a return is approved the refund is normally processed back to the original payment method; and that they can track or enquire through the official support channels. Never promise a specific refund date unless it's confirmed by the relevant brand policy."}, "ar": {"title": "دعم استفسارات الاسترداد", "body": "قد يقلق الزبون أثناء انتظار الاسترداد — كن مطمئناً. اشرح أن مدة معالجة الاسترداد تختلف حسب طريقة الدفع والعلامة؛ وأن الاسترداد يُعاد عادة إلى طريقة الدفع الأصلية بعد الموافقة على الإرجاع؛ وأنه يمكنه التتبّع أو الاستفسار عبر قنوات الدعم الرسمية. لا تعِد أبداً بتاريخ استرداد محدّد إلا إذا أكّدته سياسة العلامة."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-delivery", "keywords_en": "delivery questions delayed late acknowledge stock availability location busy periods courier track order", "keywords_ar": "أسئلة التوصيل تأخر اعتراف توفر المخزون الموقع مواسم الازدحام شركة الشحن تتبع عميل عملاء", "en": {"title": "Delivery questions", "body": "If a customer asks about a delayed delivery, first acknowledge their concern. Then explain that delivery times may vary depending on stock availability, delivery location, busy shopping periods, and courier operations. Encourage them to check their order status via the brand's website, app, or support channels if further updates are needed."}, "ar": {"title": "أسئلة التوصيل", "body": "إذا سأل الزبون عن تأخّر التوصيل، اعترف بقلقه أولاً. ثم اشرح أن مدد التوصيل قد تختلف حسب توفّر المخزون، وموقع التوصيل، ومواسم الازدحام، وعمليات شركة الشحن. وشجّعه على متابعة حالة طلبه عبر موقع العلامة أو تطبيقها أو قنوات الدعم إن أراد تحديثات إضافية."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-wrongstore", "keywords_en": "wrong store online issue not our department cannot process here point right team resolve guidance", "keywords_ar": "متجر خاطئ مسألة إلكترونية ليس قسمنا لا يمكن المعالجة هنا الفريق المناسب إرشاد عميل عملاء", "en": {"title": "When customers visit the wrong store", "body": "Sometimes customers expect immediate help with an online order that can't be processed in store. Never simply say \"this is an online issue.\" Instead try: \"I'll explain the best way to get this resolved and point you to the right team.\" Helping customers find the correct solution is part of exceptional service."}, "ar": {"title": "حين يأتي الزبون إلى المكان الخطأ", "body": "أحياناً يتوقّع الزبون مساعدة فورية بشأن طلب إلكتروني لا يمكن معالجته في المتجر. لا تقل أبداً «هذه مسألة إلكترونية» فحسب. جرّب بدلاً من ذلك: «سأشرح لك أفضل طريقة لحل هذا وأدلّك على الفريق المناسب». مساعدة الزبون على إيجاد الحل الصحيح جزء من الخدمة الاستثنائية."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-digital", "keywords_en": "digital support tools track order start return live chat faq guide access self service", "keywords_ar": "دعم رقمي أدوات تتبع الطلب بدء الإرجاع دردشة مباشرة أسئلة شائعة إرشاد عميل عملاء", "en": {"title": "Helping customers use digital support", "body": "Many Alshaya brands provide online support tools. Depending on the brand, customers may be able to track their order, start a return request, follow refund progress, contact customer support through Live Chat, and find answers to frequently asked questions. Where appropriate, guide customers on how to access these services rather than expecting them to figure it out alone."}, "ar": {"title": "مساعدة الزبون على استخدام الدعم الرقمي", "body": "توفّر كثير من علامات ألشايا أدوات دعم إلكترونية. وحسب العلامة، قد يتمكّن الزبون من تتبّع طلبه، أو بدء طلب إرجاع، أو متابعة تقدّم الاسترداد، أو التواصل مع الدعم عبر الدردشة المباشرة، أو إيجاد إجابات للأسئلة الشائعة. وحين يكون ذلك مناسباً، أرشده لكيفية الوصول لهذه الخدمات بدل تركه يكتشفها وحده."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}, {"id": "on-mistakes", "keywords_en": "online mistakes avoid guessing policies promising dates assuming brands identical negative online team sending away", "keywords_ar": "أخطاء إلكترونية تجنب تخمين السياسات الوعد بتواريخ افتراض تطابق العلامات سلبية الفريق الإلكتروني عميل عملاء", "en": {"title": "Common mistakes with online enquiries", "body": "Avoid: guessing online policies; promising delivery or refund dates; assuming all Alshaya brands follow identical procedures; speaking negatively about the online team; saying \"it's an online problem\"; sending customers away without guidance; and using complicated technical language. Customers value clear, confident and honest communication — it's better to verify than to guess."}, "ar": {"title": "أخطاء شائعة في الاستفسارات الإلكترونية", "body": "تجنّب: تخمين السياسات الإلكترونية؛ الوعد بتواريخ توصيل أو استرداد؛ افتراض أن كل علامات ألشايا تتبع نفس الإجراءات؛ التحدّث سلباً عن الفريق الإلكتروني؛ قول «هذه مشكلة إلكترونية»؛ صرف الزبون دون إرشاد؛ واستخدام لغة تقنية معقّدة. الزبائن يقدّرون التواصل الواضح الواثق الصادق — والتحقّق أفضل من التخمين."}, "source": {"en": "Supporting Online Customers", "ar": "دعم زبائن التسوّق الإلكتروني"}}]},
  hospitality: {"meta": {"division": "hospitality", "title": "ATLAS Library — Hospitality (Art of Guest Experience)", "note": "Only edit this file to change HOSPITALITY content. Replace the example card with real topics.", "videoTypes": "link | youtube | stream | mp4"}, "cards": [{"id": "hw-why", "keywords_en": "why welcome matters 7 seconds first impression 23% spend gen z 89 emotional loyalty 70 stats", "keywords_ar": "لماذا الترحيب مهم سبع ثوان انطباع أول إنفاق جيل زد عاطفي ولاء إحصاءات ضيف ضيوف زبون عميل", "en": {"title": "Why the welcome matters", "body": "First impressions form in under 7 seconds — that's all it takes for a guest to decide if they feel seen and valued. Guests who feel welcomed spend up to 23% more and are more likely to return. 89% of Gen Z say experience matters more than price, and 70% of loyalty is emotional, not transactional. When you connect, you create value."}, "ar": {"title": "لماذا الترحيب مهم", "body": "يتكوّن الانطباع الأول في أقل من ٧ ثوانٍ — وهذا كل ما يحتاجه الضيف ليقرّر إن كان يشعر بأنه مرئي وذو قيمة. الضيوف الذين يشعرون بالترحيب ينفقون حتى ٢٣٪ أكثر ويعودون غالباً. و٨٩٪ من جيل Z يقولون إن التجربة أهم من السعر، و٧٠٪ من الولاء عاطفي لا تعاملي. حين تتواصل، تصنع قيمة."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-what", "keywords_en": "what makes warm welcome smile eye contact body language tone personal not robotic fast not rushed", "keywords_ar": "ما يصنع ترحيباً حاراً ابتسامة تواصل بصري لغة الجسد نبرة شخصي غير آلي سريع دون استعجال ضيف ضيوف زبون عميل", "en": {"title": "What makes a warm welcome", "body": "It starts in the first few seconds: a real friendly smile, open and positive body language, a warm welcoming tone, and eye contact. Be personal, not robotic — use a friendly greeting, recognise repeat guests when you can, and respect cultural differences and personal space. Think of it as: fast but never rushed, personal but not scripted, friendly but real."}, "ar": {"title": "ما الذي يصنع ترحيباً حاراً", "body": "يبدأ في الثواني الأولى: ابتسامة حقيقية ودودة، ولغة جسد منفتحة وإيجابية، ونبرة دافئة مرحّبة، وتواصل بصري. كن شخصياً لا آلياً — استخدم تحية ودودة، وتعرّف على الضيوف المتكرّرين حين تستطيع، واحترم الاختلافات الثقافية والمساحة الشخصية. فكّر فيه هكذا: سريع لكن غير مستعجل، شخصي لكن غير محفوظ، ودود لكن حقيقي."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-personalize", "keywords_en": "personalizing welcome not one size fits all name returning match mood energy space culture age adapt", "keywords_ar": "تخصيص الترحيب ليس مقاساً واحداً اسم عائد مجاراة المزاج طاقة مساحة ثقافة عمر تكيف ضيف ضيوف زبون عميل", "en": {"title": "Personalising the welcome", "body": "A warm welcome isn't one-size-fits-all. Watch, listen and adapt: use the guest's name when known, acknowledge returning guests, match their mood and energy, respect their space and timing, and adjust based on culture, age and situation. If they seem quiet, match that; if they're upbeat, join in. A great welcome fits the guest, not the script."}, "ar": {"title": "تخصيص الترحيب", "body": "الترحيب الحار ليس مقاساً واحداً يناسب الجميع. راقب وأصغِ وتكيّف: استخدم اسم الضيف إن عرفته، ورحّب بالعائدين، وجارِ مزاجه وطاقته، واحترم مساحته وتوقيته، وعدّل حسب الثقافة والعمر والموقف. إن بدا هادئاً فجارِه، وإن كان مفعماً بالحيوية فشاركه. الترحيب الرائع يناسب الضيف لا النص المحفوظ."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-returning", "keywords_en": "returning guests welcome back recognise loyal trust assumptions lovely to see you again regular", "keywords_ar": "الضيوف العائدون أهلاً بعودتك تعرف ولاء ثقة افتراضات سعدنا برؤيتك منتظم ضيف زبون عميل", "en": {"title": "Recognising returning guests", "body": "Returning guests are placing their trust in us again. Welcome them back warmly, acknowledge their return naturally, thank them for visiting again, and keep delivering exceptional service without making assumptions about what they want. A simple \"Welcome back — it's lovely to see you again\" can make a guest feel recognised and appreciated."}, "ar": {"title": "التعرّف على الضيوف العائدين", "body": "الضيوف العائدون يمنحوننا ثقتهم مجدداً. رحّب بعودتهم بحرارة، واعترف بعودتهم بشكل طبيعي، واشكرهم على زيارتهم مرة أخرى، وواصل تقديم خدمة استثنائية دون افتراض ما يريدونه. عبارة بسيطة مثل «أهلاً بعودتك — سعدنا برؤيتك مجدداً» تكفي ليشعر الضيف بأنه معروف ومقدَّر."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-arrival", "keywords_en": "comfortable arrival seating menus waiting time refreshments busy forgotten first minutes relax", "keywords_ar": "وصول مريح جلوس قوائم وقت الانتظار مرطبات ازدحام منسي دقائق أولى استرخاء ضيف ضيوف زبون عميل", "en": {"title": "Creating a comfortable arrival", "body": "The first few minutes should help guests relax. Depending on your restaurant and brand standards this may include assisting with seating, offering menus promptly, explaining any waiting time clearly, offering refreshments where available and appropriate, and making sure guests know someone will be with them shortly. Even when it's busy, guests should never feel forgotten."}, "ar": {"title": "صنع وصول مريح", "body": "الدقائق الأولى يجب أن تساعد الضيف على الاسترخاء. وحسب مطعمك ومعايير علامتك قد يشمل ذلك المساعدة في الجلوس، وتقديم القوائم بسرعة، وشرح أي وقت انتظار بوضوح، وتقديم المرطبات حين تتوفر ويكون مناسباً، والتأكّد من علم الضيف بأن أحدهم سيكون معه قريباً. وحتى في الازدحام يجب ألا يشعر الضيف بأنه منسي."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-busy", "keywords_en": "busy periods wait queue acknowledge immediately honest waiting time patience informed priority seating", "keywords_ar": "أوقات الازدحام انتظار طابور اعتراف فوري صدق وقت الانتظار صبر إبقاء على اطلاع أولوية ضيف ضيوف زبون عميل", "en": {"title": "Managing busy periods with care", "body": "Busy restaurants don't have to create rushed experiences. If there's a wait: acknowledge guests immediately, explain the expected waiting time honestly, thank them for their patience, and keep them informed if circumstances change. For eligible priority or loyalty guests, follow your restaurant's approved procedures on priority seating or queue management. Every guest should feel respected throughout."}, "ar": {"title": "إدارة أوقات الازدحام بعناية", "body": "المطاعم المزدحمة لا يجب أن تصنع تجارب مستعجلة. إن كان هناك انتظار: رحّب بالضيوف فوراً، واشرح مدة الانتظار المتوقّعة بصدق، واشكرهم على صبرهم، وأبقهم على اطلاع إن تغيّرت الظروف. وللضيوف المؤهّلين لخدمة الأولوية أو الولاء، اتبع الإجراءات المعتمدة في مطعمك بشأن أولوية الجلوس أو إدارة الطابور. كل ضيف يستحق الاحترام طوال الوقت."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-conversations", "keywords_en": "start conversations not scripts ready to order first visit in the mood help choose questions connection", "keywords_ar": "ابدأ حواراً لا نصاً جاهز للطلب أول زيارة مزاج مساعدة في الاختيار أسئلة تواصل ضيف ضيوف زبون عميل", "en": {"title": "Start conversations, not scripts", "body": "The menu is important — the conversation is equally important. Rather than immediately asking \"Are you ready to order?\", take time to understand your guests. Simple questions make it personal: \"Is this your first visit with us?\", \"Have you dined with us before?\", \"Is there anything you're in the mood for today?\", \"Can I help you choose something?\" Conversations create connections."}, "ar": {"title": "ابدأ حواراً لا نصاً محفوظاً", "body": "القائمة مهمة — والحوار مهم بالقدر نفسه. بدل السؤال مباشرة «هل أنت جاهز للطلب؟»، خذ وقتاً لفهم ضيوفك. الأسئلة البسيطة تجعل الأمر شخصياً: «هل هذه زيارتك الأولى لنا؟»، «هل تناولت الطعام معنا من قبل؟»، «هل هناك شيء يناسب مزاجك اليوم؟»، «هل أساعدك في الاختيار؟» الحوارات تصنع تواصلاً."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-styles", "keywords_en": "three styles curated conversation explorer confirmer elevator unsure confident loyal read the guest", "keywords_ar": "ثلاثة أساليب حوار مدروس المستكشف المؤكد المرتقي متردد واثق وفي قراءة الضيف ضيوف زبون عميل", "en": {"title": "The 3 styles of curated conversation", "body": "Use the style that meets the guest where they are. Explorer — new or unsure guests: \"Can I help you choose a favourite?\" Goal: build comfort and guide gently. Confirmer — confident or returning guests: \"Same go-to today? Or trying something new?\" Goal: add value while respecting their usual choice. Elevator — curious or loyal guests: \"Want to add what everyone's loving this week?\" Goal: surprise and delight with new ideas."}, "ar": {"title": "أساليب الحوار المدروس الثلاثة", "body": "استخدم الأسلوب الذي يلتقي بالضيف حيث هو. المستكشف — ضيف جديد أو متردد: «هل أساعدك في اختيار طبق مفضّل؟» الهدف: بناء الراحة والإرشاد بلطف. المؤكِّد — ضيف واثق أو عائد: «نفس طلبك المعتاد اليوم؟ أم تجرّب شيئاً جديداً؟» الهدف: إضافة قيمة مع احترام اختياره المعتاد. المرتقي — ضيف فضولي أو وفيّ: «هل تضيف ما يحبّه الجميع هذا الأسبوع؟» الهدف: المفاجأة والإسعاد بأفكار جديدة."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-listening", "keywords_en": "active listening preferences dietary requirements allergies favourite flavours occasions interrupting", "keywords_ar": "إصغاء فعال تفضيلات متطلبات غذائية حساسية نكهات مفضلة مناسبات مقاطعة ضيف ضيوف زبون عميل", "en": {"title": "Active listening creates better experiences", "body": "Guests often tell us exactly what they need — our role is to listen. Listen for preferences, dietary requirements, allergies, favourite flavours, dining occasions, and any questions or uncertainty. Avoid interrupting, and listen carefully before recommending. The better you understand your guests, the better you can serve them."}, "ar": {"title": "الإصغاء الفعّال يصنع تجارب أفضل", "body": "غالباً ما يخبرنا الضيوف بما يحتاجونه بالضبط — ودورنا أن نصغي. أصغِ للتفضيلات، والمتطلبات الغذائية، والحساسية، والنكهات المفضّلة، ومناسبات تناول الطعام، وأي أسئلة أو تردّد. تجنّب المقاطعة، وأصغِ جيداً قبل أن توصي. كلما فهمت ضيفك أكثر، خدمته أفضل."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-occasions", "keywords_en": "special occasions birthdays anniversaries milestones graduations celebrating ask naturally noticed", "keywords_ar": "مناسبات خاصة أعياد ميلاد ذكرى سنوية إنجازات تخرج احتفال سؤال طبيعي ملاحظة ضيف ضيوف زبون عميل", "en": {"title": "Discovering special occasions", "body": "Some visits become unforgettable simply because someone noticed. Where appropriate, ask naturally if guests are celebrating a birthday, anniversary, family milestone, graduation or other special occasion. Recognising these moments lets the team create memorable experiences in line with your restaurant's procedures — thoughtful recognition often becomes the highlight of the visit."}, "ar": {"title": "اكتشاف المناسبات الخاصة", "body": "بعض الزيارات تصبح لا تُنسى لمجرد أن أحدهم لاحظ. حين يكون مناسباً، اسأل بطبيعية إن كان الضيوف يحتفلون بعيد ميلاد أو ذكرى سنوية أو إنجاز عائلي أو تخرّج أو مناسبة خاصة أخرى. ملاحظة هذه اللحظات تتيح للفريق صنع تجارب تُذكر وفق إجراءات مطعمك — والاهتمام المدروس غالباً يصبح أجمل ما في الزيارة."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-aura", "keywords_en": "aura introduce naturally loyalty points benefits member helping not promoting sign up app", "keywords_ar": "أورا تقديم طبيعي ولاء نقاط مزايا عضو مساعدة لا ترويج اشتراك تطبيق ضيف ضيوف زبون عميل", "en": {"title": "Introducing AURA naturally", "body": "Loyalty conversations should always add value. Where appropriate, introduce AURA naturally: \"Are you already enjoying the benefits of AURA?\", \"You can collect AURA points on today's visit,\" or \"If you're not yet an AURA member, I'd be happy to explain how it works.\" The conversation should feel like helping — not promoting."}, "ar": {"title": "تقديم أورا بشكل طبيعي", "body": "حوارات الولاء يجب أن تضيف قيمة دائماً. حين يكون مناسباً، قدّم أورا بطبيعية: «هل تستمتع بالفعل بمزايا أورا؟»، «يمكنك جمع نقاط أورا في زيارة اليوم»، أو «إن لم تكن عضواً في أورا بعد، يسعدني أن أشرح لك كيف يعمل». يجب أن يبدو الحوار مساعدة — لا ترويجاً."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "hw-mistakes", "keywords_en": "welcome mistakes avoid no eye contact robotic rushed only taking orders interrupting ignoring occasions assumptions", "keywords_ar": "أخطاء الترحيب تجنب دون تواصل بصري آلي مستعجل الطلبات فقط مقاطعة تجاهل المناسبات افتراضات ضيف ضيوف زبون عميل", "en": {"title": "Common welcome mistakes", "body": "Avoid: greeting guests without eye contact; using rushed or robotic welcomes; focusing only on taking orders; interrupting guests; ignoring special occasions; forgetting to introduce relevant loyalty benefits; making assumptions about guest preferences; and talking more than listening. Great hospitality starts with genuine curiosity."}, "ar": {"title": "أخطاء شائعة في الترحيب", "body": "تجنّب: تحية الضيوف دون تواصل بصري؛ الترحيب المستعجل أو الآلي؛ التركيز على أخذ الطلبات فقط؛ مقاطعة الضيوف؛ تجاهل المناسبات الخاصة؛ نسيان تقديم مزايا الولاء المناسبة؛ افتراض تفضيلات الضيف؛ والكلام أكثر من الإصغاء. الضيافة الرائعة تبدأ بفضول صادق."}, "source": {"en": "Warm Welcome & Curated Conversations", "ar": "الترحيب الحار والحوارات المدروسة"}}, {"id": "cs-story", "keywords_en": "every dish story ingredients flavours freshness cooking style texture signature chicken burger describe", "keywords_ar": "كل طبق قصة مكونات نكهات طزاجة طريقة طهي قوام مميز وصف ضيف ضيوف زبون عميل", "en": {"title": "Every dish has a story", "body": "Guests connect with stories more than lists of ingredients. Rather than just naming a dish, help guests imagine the experience — talk about flavours, freshness, cooking style, texture, signature ingredients, and what makes it unique. Instead of \"this is our chicken burger,\" try: \"It's one of our most popular choices, freshly prepared with a crispy coating, served with our signature sauce, with a satisfying balance of flavour and texture.\""}, "ar": {"title": "لكل طبق قصة", "body": "يتواصل الضيوف مع القصص أكثر من قوائم المكوّنات. بدل تسمية الطبق فحسب، ساعد الضيف على تخيّل التجربة — تحدّث عن النكهات، والطزاجة، وطريقة الطهي، والقوام، والمكوّنات المميزة، وما يجعله فريداً. بدل «هذا برجر الدجاج لدينا» جرّب: «من أكثر خياراتنا رواجاً، يُحضّر طازجاً بطبقة مقرمشة، ويُقدّم مع صلصتنا المميّزة، بتوازن ممتع بين النكهة والقوام.»"}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-enthusiasm", "keywords_en": "genuine enthusiasm passion influences confident naturally smile popular memorised scripts authentic", "keywords_ar": "حماس صادق شغف يؤثر ثقة طبيعي ابتسامة رائج نصوص محفوظة أصيل ضيف ضيوف زبون عميل", "en": {"title": "Speak with genuine enthusiasm", "body": "Your passion influences your guests. When you genuinely enjoy talking about the menu, guests feel more confident in your recommendations. Speak naturally, smile, and share what makes certain dishes popular. Avoid memorised scripts — guests respond to authentic enthusiasm. Guests connect more with genuine energy than perfect words."}, "ar": {"title": "تحدّث بحماس صادق", "body": "شغفك يؤثّر في ضيوفك. حين تستمتع فعلاً بالحديث عن القائمة، يشعر الضيف بثقة أكبر في توصياتك. تحدّث بطبيعية، وابتسم، وشارك ما يجعل بعض الأطباق مفضّلة. وتجنّب النصوص المحفوظة — فالضيوف يتفاعلون مع الحماس الأصيل. الضيوف يتواصلون مع الطاقة الصادقة أكثر من الكلمات المثالية."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-understand", "keywords_en": "understand before recommend questions mood light filling visited before something new dietary preferences", "keywords_ar": "افهم قبل التوصية أسئلة مزاج خفيف مشبع زيارة سابقة شيء جديد تفضيلات غذائية ضيف ضيوف زبون عميل", "en": {"title": "Understand before you recommend", "body": "The best recommendations begin with curiosity. Ask: \"What are you in the mood for today?\", \"Do you prefer something light or more filling?\", \"Have you visited us before?\", \"Are you looking to try something new?\", \"Are there any dietary preferences we should know about?\" Listening carefully lets you personalise every recommendation."}, "ar": {"title": "افهم قبل أن توصي", "body": "أفضل التوصيات تبدأ بالفضول. اسأل: «ما الذي يناسب مزاجك اليوم؟»، «تفضّل شيئاً خفيفاً أم أكثر إشباعاً؟»، «هل زرتنا من قبل؟»، «هل تودّ تجربة شيء جديد؟»، «هل هناك تفضيلات غذائية يجب أن نعرفها؟» الإصغاء الجيد يتيح لك تخصيص كل توصية."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-match", "keywords_en": "match menu to guest comfort healthier celebrating children taste appetite occasion dietary previous favourites", "keywords_ar": "مطابقة القائمة للضيف راحة صحي احتفال أطفال ذوق شهية مناسبة غذائي مفضلات سابقة ضيوف زبون عميل", "en": {"title": "Match the menu to the guest", "body": "Different guests have different expectations — some want comfort, some want healthier choices, some are celebrating, some are dining with children. Tailor your recommendations based on taste preferences, appetite, occasion, dietary needs, and previous favourites. Personalised recommendations create memorable experiences."}, "ar": {"title": "طابِق القائمة مع الضيف", "body": "الضيوف يختلفون في توقّعاتهم — بعضهم يريد الراحة، وبعضهم خيارات أصح، وبعضهم يحتفل، وبعضهم مع أطفال. كيّف توصياتك حسب تفضيلات الذوق، والشهية، والمناسبة، والاحتياجات الغذائية، والمفضّلات السابقة. التوصيات المخصّصة تصنع تجارب تُذكر."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-signature", "keywords_en": "signature seasonal dishes chef recommendations limited time new additions unique special why", "keywords_ar": "أطباق مميزة موسمية توصيات الشيف وقت محدود إضافات جديدة فريد خاص لماذا ضيف ضيوف زبون عميل", "en": {"title": "Introduce signature and seasonal dishes", "body": "Guests often appreciate discovering something unique. Where available, confidently introduce signature dishes, chef's recommendations, seasonal specials, limited-time menu items, and new additions — and explain why they're special. Guests are more likely to try something new when they understand its value."}, "ar": {"title": "قدّم الأطباق المميزة والموسمية", "body": "يقدّر الضيوف اكتشاف شيء فريد. وحيثما توفّر، قدّم بثقة الأطباق المميّزة، وتوصيات الشيف، والعروض الموسمية، وأصناف القائمة محدودة الوقت، والإضافات الجديدة — واشرح لماذا هي مميّزة. الضيوف أكثر ميلاً لتجربة الجديد حين يفهمون قيمته."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-pairings", "keywords_en": "thoughtful pairings drink side dessert sharing starter children option complement balance enhance", "keywords_ar": "اقتراحات متناغمة مشروب طبق جانبي حلوى مقبلات للمشاركة خيار أطفال يكمل توازن ضيف ضيوف زبون عميل", "en": {"title": "Thoughtful pairings add value", "body": "A great meal is often made better by the right combination. Suggest pairings that naturally complement the order: a refreshing drink that balances the flavours, a side that completes the dish, a dessert that provides the perfect ending, a sharing starter for the table, or a children's option for families. The goal isn't to add more items — it's to enhance the overall dining experience."}, "ar": {"title": "الاقتراحات المتناغمة تضيف قيمة", "body": "الوجبة الرائعة تصبح أفضل غالباً بالتركيبة الصحيحة. اقترح ما يكمّل الطلب طبيعياً: مشروب منعش يوازن النكهات، أو طبق جانبي يُكمل الطبق، أو حلوى تختم الوجبة بشكل مثالي، أو مقبلات للمشاركة على الطاولة، أو خيار للأطفال للعائلات. الهدف ليس إضافة أصناف — بل تحسين تجربة تناول الطعام كاملة."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-purpose", "keywords_en": "recommend with purpose how does this improve experience available texture refresh palate finishes trust", "keywords_ar": "أوصِ بهدف كيف يحسن التجربة متوفر قوام ينعش الحنك يختم ثقة ضيف ضيوف زبون عميل", "en": {"title": "Recommend with purpose", "body": "Every recommendation should answer one question: \"How does this improve the guest's experience?\" Avoid recommending items simply because they're available — instead explain how they complement the meal: a side that adds texture, a drink that refreshes the palate, a dessert that finishes the meal perfectly. Purpose creates trust."}, "ar": {"title": "أوصِ بهدف", "body": "كل توصية يجب أن تجيب على سؤال واحد: «كيف يحسّن هذا تجربة الضيف؟» تجنّب التوصية بشيء لمجرد توفّره — بل اشرح كيف يكمّل الوجبة: طبق جانبي يضيف قواماً، أو مشروب ينعش الحنك، أو حلوى تختم الوجبة بشكل مثالي. الهدف يصنع الثقة."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-premium", "keywords_en": "premium choices larger option upgrade sharing complete meal added value not pressure tasting menu", "keywords_ar": "خيارات مميزة حجم أكبر ترقية مشاركة وجبة كاملة قيمة مضافة لا ضغط قائمة تذوق ضيف ضيوف زبون عميل", "en": {"title": "Premium choices should feel like better experiences", "body": "Sometimes guests appreciate premium options — introduce them by focusing on the experience. Rather than \"Would you like the larger option?\", explain the benefit: \"Many guests choose this option because it's perfect for sharing, or if you're looking for a more complete meal.\" Premium recommendations should always feel like added value, not added pressure."}, "ar": {"title": "الخيارات المميزة يجب أن تبدو تجربة أفضل", "body": "أحياناً يقدّر الضيف الخيارات المميّزة — قدّمها بالتركيز على التجربة. بدل «هل تريد الحجم الأكبر؟» اشرح الفائدة: «كثير من الضيوف يختارون هذا لأنه مثالي للمشاركة، أو إن كنت تبحث عن وجبة أكمل». التوصية المميّزة يجب أن تبدو قيمة مضافة لا ضغطاً إضافياً."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "cs-mistakes", "keywords_en": "storytelling mistakes avoid reading menu same dish everyone too quickly overloading technical terminology declined", "keywords_ar": "أخطاء سرد القصة تجنب القراءة من القائمة نفس الطبق للجميع بسرعة إغراق مصطلحات تقنية رفض ضيف ضيوف زبون عميل", "en": {"title": "Common recommendation mistakes", "body": "Avoid: reading directly from the menu; recommending the same dish to every guest; speaking too quickly; overloading guests with too many choices; suggesting extra items without explaining their value; using technical food terminology guests may not understand; and continuing to recommend after the guest has politely declined. Guests appreciate guidance — not pressure."}, "ar": {"title": "أخطاء شائعة في التوصية", "body": "تجنّب: القراءة مباشرة من القائمة؛ التوصية بنفس الطبق لكل ضيف؛ التحدّث بسرعة؛ إغراق الضيف بخيارات كثيرة؛ اقتراح أصناف إضافية دون شرح قيمتها؛ استخدام مصطلحات طعام تقنية قد لا يفهمها الضيف؛ ومواصلة التوصية بعد رفض مهذّب. الضيوف يقدّرون الإرشاد — لا الضغط."}, "source": {"en": "Culinary Storytelling & Thoughtful Pairings", "ar": "فن سرد قصة الطبق والاقتراحات المتناغمة"}}, {"id": "mm-moments", "keywords_en": "memorable moments small touches birthday colouring napkin occasion checking back congratulations thoughtful", "keywords_ar": "لحظات لا تنسى لمسات صغيرة عيد ميلاد تلوين منديل مناسبة متابعة تهنئة اهتمام ضيف ضيوف زبون عميل", "en": {"title": "Creating memorable moments", "body": "Memorable moments don't require grand gestures — often it's the small, thoughtful touches that matter most: celebrating a birthday with enthusiasm, offering colouring activities for children where available, bringing an extra napkin before it's requested, noticing a special occasion, checking back at the right moment, and offering genuine congratulations or well wishes. Thoughtfulness shows guests they're cared for — not simply served."}, "ar": {"title": "صنع لحظات لا تُنسى", "body": "اللحظات التي تُذكر لا تحتاج بادرات كبيرة — غالباً اللمسات الصغيرة المدروسة هي الأهم: الاحتفال بعيد ميلاد بحماس، وتقديم أنشطة تلوين للأطفال حيث تتوفر، وإحضار منديل إضافي قبل طلبه، وملاحظة مناسبة خاصة، والمرور في اللحظة المناسبة للاطمئنان، وتقديم تهنئة أو تمنيات صادقة. الاهتمام يُظهر للضيف أنه محل رعاية — لا مجرد خدمة."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-surprise", "keywords_en": "surprise delight complimentary treat handwritten message birthday dessert family moment approved never promise", "keywords_ar": "مفاجأة إسعاد ضيافة مجانية رسالة مكتوبة حلوى عيد ميلاد لحظة عائلية معتمد لا تعد ضيف ضيوف زبون عميل", "en": {"title": "The power of surprise and delight", "body": "Unexpected moments often become unforgettable memories. Where appropriate and in line with brand guidelines, small gestures may include a complimentary treat, a handwritten celebration message, a birthday dessert, helping create a memorable family moment, or recognising a returning guest. The value isn't in the gesture itself — it's in how it makes the guest feel. Never promise or provide complimentary items unless approved by your brand's procedures."}, "ar": {"title": "قوة المفاجأة والإسعاد", "body": "اللحظات غير المتوقّعة تصبح غالباً ذكريات لا تُنسى. حين يكون مناسباً ووفق إرشادات العلامة، قد تشمل البادرات الصغيرة ضيافة مجانية، أو رسالة تهنئة مكتوبة بخط اليد، أو حلوى عيد ميلاد، أو المساعدة في صنع لحظة عائلية، أو التعرّف على ضيف عائد. القيمة ليست في البادرة نفسها — بل في شعور الضيف بها. لا تعِد أو تقدّم ضيافة مجانية إلا إذا كانت معتمدة في إجراءات علامتك."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-team", "keywords_en": "every team member hosts servers cashiers kitchen managers teamwork one seamless journey roles", "keywords_ar": "كل فرد في الفريق مضيف نادل كاشير مطبخ مدراء عمل جماعي رحلة واحدة أدوار ضيوف زبون عميل", "en": {"title": "Every team member creates the experience", "body": "Memorable moments aren't created by one person — they're created through teamwork. Hosts, servers, cashiers, kitchen teams and managers all contribute to the guest's overall experience. Guests don't separate individual roles; they remember the experience as one seamless journey."}, "ar": {"title": "كل فرد في الفريق يصنع التجربة", "body": "اللحظات التي تُذكر لا يصنعها شخص واحد — بل يصنعها العمل الجماعي. المضيفون والنادلون وموظفو الصندوق وفرق المطبخ والمدراء جميعهم يساهمون في تجربة الضيف. الضيوف لا يفصلون بين الأدوار؛ بل يتذكّرون التجربة كرحلة واحدة متكاملة."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-payment", "keywords_en": "seamless payment bill simple efficient stress free attentive accurate final questions rushed", "keywords_ar": "دفع سلس فاتورة بسيط كفء دون توتر منتبه دقيق أسئلة أخيرة استعجال ضيف ضيوف زبون عميل", "en": {"title": "The seamless payment experience", "body": "Paying the bill should feel simple, efficient and stress-free — keep providing hospitality right until the final moment. During payment: remain attentive, handle payment accurately, answer any final questions, thank guests sincerely, and avoid making guests feel rushed. The service shouldn't stop when the meal ends."}, "ar": {"title": "تجربة دفع سلسة", "body": "دفع الفاتورة يجب أن يكون بسيطاً وسريعاً وخالياً من التوتر — واصل الضيافة حتى اللحظة الأخيرة. أثناء الدفع: ابقَ منتبهاً، وتعامل مع الدفع بدقة، وأجب عن أي أسئلة أخيرة، واشكر الضيوف بصدق، وتجنّب أن تجعلهم يشعرون بالاستعجال. الخدمة لا تتوقّف بانتهاء الوجبة."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-aura", "keywords_en": "aura payment stage collect points scan membership rewards benefits do you have aura value", "keywords_ar": "أورا مرحلة الدفع جمع النقاط مسح العضوية مكافآت مزايا قيمة ضيف ضيوف زبون عميل", "en": {"title": "Introducing AURA at payment", "body": "The payment stage is often the ideal time to make sure guests enjoy AURA's benefits. Rather than simply asking \"Do you have AURA?\", create value: \"May I help you collect your AURA points today?\", \"Are you already enjoying the benefits of AURA?\", or \"Let's make sure you receive your AURA rewards from today's visit.\" If the guest isn't a member, briefly explain the benefits in a friendly, natural way — focus on helping them enjoy future rewards, not on promoting a programme."}, "ar": {"title": "تقديم أورا عند الدفع", "body": "مرحلة الدفع غالباً الوقت المثالي لضمان استفادة الضيف من مزايا أورا. بدل السؤال «هل لديك أورا؟» اصنع قيمة: «هل أساعدك في جمع نقاط أورا اليوم؟»، «هل تستمتع بالفعل بمزايا أورا؟»، أو «لنتأكّد من حصولك على مكافآت أورا من زيارة اليوم». وإن لم يكن عضواً، اشرح المزايا باختصار بأسلوب ودود طبيعي — وركّز على مساعدته للاستفادة مستقبلاً لا على الترويج للبرنامج."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-farewell", "keywords_en": "farewell final words thank you dining hope welcome again wonderful evening safe travels smile lasting", "keywords_ar": "وداع كلمات أخيرة شكراً على تناول الطعام نأمل الترحيب مجدداً أمسية رائعة رحلة آمنة ابتسامة ضيف ضيوف زبون عميل", "en": {"title": "Making every farewell memorable", "body": "The final words guests hear often become the lasting memory of their visit. A genuine farewell might be: \"Thank you for dining with us,\" \"We hope to welcome you again soon,\" \"Have a wonderful evening,\" \"Safe travels,\" or \"We look forward to seeing you again.\" Smile, make eye contact where appropriate, and leave guests feeling appreciated."}, "ar": {"title": "اجعل كل وداع يُذكر", "body": "آخر الكلمات التي يسمعها الضيف تصبح غالباً ذكرى زيارته الباقية. الوداع الصادق قد يكون: «شكراً لتناولك الطعام معنا»، «نأمل الترحيب بك قريباً»، «أتمنى لك أمسية رائعة»، «رحلة آمنة»، أو «نتطلّع لرؤيتك مجدداً». ابتسم، وتواصل بالعين حين يكون مناسباً، واترك الضيف يشعر بالتقدير."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-consistency", "keywords_en": "consistency creates loyalty know what to expect warm hospitality attentive great food genuine care confidence", "keywords_ar": "الاتساق يصنع الولاء توقع ضيافة دافئة خدمة منتبهة طعام رائع عناية صادقة ثقة ضيف ضيوف زبون عميل", "en": {"title": "Consistency creates loyalty", "body": "Guests return because they know what to expect. Every visit should consistently deliver warm hospitality, attentive service, great food, genuine care, memorable moments and a seamless farewell. Consistency builds confidence — and confidence builds loyalty."}, "ar": {"title": "الاتساق يصنع الولاء", "body": "يعود الضيوف لأنهم يعرفون ما يتوقّعونه. كل زيارة يجب أن تقدّم باستمرار ضيافة دافئة، وخدمة منتبهة، وطعاماً رائعاً، وعناية صادقة، ولحظات تُذكر، ووداعاً سلساً. الاتساق يبني الثقة — والثقة تبني الولاء."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "mm-mistakes", "keywords_en": "farewell mistakes avoid transaction forgetting aura rushing finished scripted robotic ignoring returning promising", "keywords_ar": "أخطاء الوداع تجنب معاملة نسيان أورا استعجال بعد الانتهاء نص آلي تجاهل العائدين وعود ضيف ضيوف زبون عميل", "en": {"title": "Common farewell mistakes", "body": "Avoid: treating payment as simply a transaction; forgetting to mention AURA where applicable; rushing guests once they've finished dining; using scripted or robotic farewells; ignoring returning guests; promising complimentary items that aren't approved; forgetting to thank guests; and ending the interaction without genuine warmth. Often, the final few moments are the ones guests remember most."}, "ar": {"title": "أخطاء شائعة في الوداع", "body": "تجنّب: التعامل مع الدفع كمجرد معاملة؛ نسيان ذكر أورا حين ينطبق؛ استعجال الضيوف بعد انتهائهم؛ الوداع المحفوظ أو الآلي؛ تجاهل الضيوف العائدين؛ الوعد بضيافة مجانية غير معتمدة؛ نسيان شكر الضيوف؛ وإنهاء التعامل دون دفء صادق. غالباً ما تكون اللحظات الأخيرة هي الأكثر بقاءً في ذاكرة الضيف."}, "source": {"en": "Memorable Moments & Seamless Farewell", "ar": "لحظات لا تُنسى ووداع سلس"}}, {"id": "gg-gratitude", "keywords_en": "gratitude more than thank you appreciation sincere smile name personally wishing inviting processed", "keywords_ar": "امتنان أكثر من شكراً تقدير ابتسامة صادقة اسم شخصياً تمنيات دعوة ضيف ضيوف زبون عميل", "en": {"title": "Gratitude is more than saying thank you", "body": "Every guest deserves appreciation, but genuine gratitude goes beyond words — it means showing guests their visit truly matters. Simple actions make a lasting difference: a sincere smile, using the guest's name where appropriate, thanking them personally, wishing them a wonderful day, and inviting them to visit again. Guests should leave feeling appreciated — not processed."}, "ar": {"title": "الامتنان أكثر من كلمة شكراً", "body": "كل ضيف يستحق التقدير، لكن الامتنان الصادق يتجاوز الكلمات — فهو إظهار أن زيارته تعني لنا شيئاً حقاً. أفعال بسيطة تصنع فرقاً باقياً: ابتسامة صادقة، واستخدام اسم الضيف حين يكون مناسباً، وشكره شخصياً، وتمنّي يوم رائع له، ودعوته للزيارة مجدداً. يجب أن يغادر الضيف وهو يشعر بالتقدير — لا بأنه مجرد معاملة."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-personal", "keywords_en": "personal thank you celebrating with us family enjoy rest evening look forward welcoming back tailor", "keywords_ar": "شكر شخصي الاحتفال معنا عائلة استمتع ببقية الأمسية نتطلع للترحيب تخصيص ضيف ضيوف زبون عميل", "en": {"title": "Make every thank you personal", "body": "A personalised farewell feels genuine. Whenever appropriate, tailor your appreciation: \"Thank you for celebrating with us today,\" \"It was wonderful having you and your family with us,\" \"We hope you enjoy the rest of your evening,\" \"We look forward to welcoming you back soon.\" The more personal the farewell, the more memorable the experience."}, "ar": {"title": "اجعل كل شكر شخصياً", "body": "الوداع المخصّص يبدو صادقاً. حين يكون مناسباً، خصّص تقديرك: «شكراً لاحتفالك معنا اليوم»، «كان من الرائع وجودك مع عائلتك معنا»، «نأمل أن تستمتع ببقية أمسيتك»، «نتطلّع للترحيب بك قريباً». كلما كان الوداع أكثر شخصية، كانت التجربة أكثر بقاءً في الذاكرة."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-future", "keywords_en": "encouraging future visits seasonal menus upcoming experiences app download loyalty exclusive offers value", "keywords_ar": "تشجيع الزيارات القادمة قوائم موسمية تجارب قادمة تحميل التطبيق ولاء عروض حصرية قيمة ضيف ضيوف زبون عميل", "en": {"title": "Encouraging future visits", "body": "Every visit is an opportunity to inspire the next one. Depending on the brand and current promotions you may invite guests to return for seasonal menus or upcoming experiences, introduce AURA benefits where applicable, encourage them to download the brand's app if available, explain how loyalty programmes enhance future visits, and mention exclusive offers available through approved channels. The goal isn't to sell another visit — it's to help guests discover additional value."}, "ar": {"title": "تشجيع الزيارات القادمة", "body": "كل زيارة فرصة لإلهام الزيارة التالية. وحسب العلامة والعروض الحالية، يمكنك دعوة الضيوف للعودة لقوائم موسمية أو تجارب قادمة، وتقديم مزايا أورا حين ينطبق، وتشجيعهم على تحميل تطبيق العلامة إن توفر، وشرح كيف تُثري برامج الولاء زياراتهم القادمة، وذكر العروض الحصرية عبر القنوات المعتمدة. الهدف ليس بيع زيارة أخرى — بل مساعدة الضيف على اكتشاف قيمة إضافية."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-promise", "keywords_en": "restaurant promise if its not perfect well fix it mindset listening ownership solution confidence care", "keywords_ar": "وعد المطعم إن لم يكن مثالياً سنصلحه عقلية إصغاء مسؤولية حل ثقة اهتمام ضيف ضيوف زبون عميل", "en": {"title": "The Restaurant Promise", "body": "Our mindset is simple: \"If it's not perfect, we'll fix it.\" This promise guides every recovery conversation. It means listening carefully, taking ownership, finding the best available solution, and restoring the guest's confidence. Guests don't expect perfection — they expect us to care."}, "ar": {"title": "وعد المطعم", "body": "عقليتنا بسيطة: «إن لم يكن مثالياً، سنصلحه». هذا الوعد يوجّه كل حوار معالجة. ويعني الإصغاء بعناية، وتحمّل المسؤولية، وإيجاد أفضل حل متاح، واستعادة ثقة الضيف. الضيوف لا يتوقّعون الكمال — بل يتوقّعون أن نهتم."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-empathy", "keywords_en": "respond empathy disappointed thank you for letting us know sorry make this right defensive understanding", "keywords_ar": "الرد بتعاطف خيبة شكراً لإخبارنا آسف نصلح الأمر دفاعي فهم ضيف ضيوف زبون عميل", "en": {"title": "Respond with empathy", "body": "Empathy creates connection. Simple responses: \"I understand why you're disappointed,\" \"Thank you for letting us know,\" \"I'm sorry your experience hasn't met your expectations,\" \"Let's see how we can make this right.\" Avoid becoming defensive or explaining the problem before acknowledging the guest's feelings — understanding comes before solutions."}, "ar": {"title": "استجب بتعاطف", "body": "التعاطف يصنع التواصل. ردود بسيطة: «أتفهّم سبب خيبة أملك»، «شكراً لإخبارنا»، «آسف لأن تجربتك لم ترقَ لتوقّعاتك»، «لنرَ كيف نصلح هذا». وتجنّب الدفاع عن النفس أو شرح المشكلة قبل الاعتراف بمشاعر الضيف — الفهم يسبق الحلول."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-solution", "keywords_en": "finding right solution replacing dish correcting order fresh meal goodwill gesture manager guidelines", "keywords_ar": "إيجاد الحل الصحيح استبدال طبق تصحيح الطلب وجبة طازجة بادرة حسن نية مدير إرشادات ضيف ضيوف زبون عميل", "en": {"title": "Focus on finding the right solution", "body": "Every situation is different. Depending on the circumstances and your brand's procedures, solutions may include replacing a dish, correcting an order, preparing a fresh meal, offering an approved goodwill gesture, or involving a manager when appropriate. The solution should always aim to restore the guest's confidence while following restaurant guidelines."}, "ar": {"title": "ركّز على إيجاد الحل الصحيح", "body": "كل موقف مختلف. وحسب الظروف وإجراءات علامتك، قد تشمل الحلول استبدال طبق، أو تصحيح طلب، أو تحضير وجبة طازجة، أو تقديم بادرة حسن نية معتمدة، أو إشراك المدير حين يكون مناسباً. يجب أن يهدف الحل دائماً لاستعادة ثقة الضيف مع الالتزام بإرشادات المطعم."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-goodwill", "keywords_en": "goodwill gestures complimentary dessert beverage invitation return discount voucher authorisation approved", "keywords_ar": "بادرات حسن نية حلوى مجانية مشروب دعوة للعودة خصم قسيمة تفويض معتمد ضيف ضيوف زبون عميل", "en": {"title": "Goodwill gestures", "body": "A thoughtful gesture can reinforce our commitment to guest satisfaction. Where approved by your restaurant's procedures, examples may include a complimentary dessert or beverage, an invitation to return, a discount or voucher for a future visit, or another approved recovery gesture. These should never be offered automatically or promised without authorisation — their purpose is to rebuild trust, not simply compensate for a mistake."}, "ar": {"title": "بادرات حسن النية", "body": "البادرة المدروسة تعزّز التزامنا برضا الضيف. وحين تكون معتمدة في إجراءات مطعمك، قد تشمل الأمثلة حلوى أو مشروباً مجانياً، أو دعوة للعودة، أو خصماً أو قسيمة لزيارة قادمة، أو بادرة معالجة معتمدة أخرى. ولا يجب تقديمها تلقائياً أو الوعد بها دون تفويض — فالغرض منها إعادة بناء الثقة لا مجرد التعويض عن خطأ."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "gg-learn", "keywords_en": "learn from every guest feedback caused prevented improve future continuous improvement reflect", "keywords_ar": "التعلم من كل ضيف ملاحظات سبب منع تحسين المستقبل تحسين مستمر تأمل ضيوف زبون عميل", "en": {"title": "Learn from every guest", "body": "Guest feedback is one of our greatest opportunities to improve. After every recovery, ask yourself: What caused the issue? Could it have been prevented? What can we learn? How can we improve the experience for future guests? Continuous improvement strengthens every restaurant."}, "ar": {"title": "تعلّم من كل ضيف", "body": "ملاحظات الضيوف من أعظم فرصنا للتحسّن. بعد كل معالجة، اسأل نفسك: ما الذي سبّب المشكلة؟ هل كان يمكن تفاديها؟ ما الذي نتعلّمه؟ كيف نحسّن التجربة للضيوف القادمين؟ التحسّن المستمر يقوّي كل مطعم."}, "source": {"en": "Genuine Gratitude & Service Recovery", "ar": "الامتنان الصادق ومعالجة الخدمة"}}, {"id": "ag-emotion", "keywords_en": "angry guest emotion behind complaint waiting wrong order food expectations missing items ignored occasion", "keywords_ar": "ضيف غاضب المشاعر خلف الشكوى انتظار طلب خاطئ طعام توقعات أصناف ناقصة تجاهل مناسبة ضيوف زبون عميل", "en": {"title": "Understand the emotion behind the complaint", "body": "Guests rarely become upset over a single issue — frustration usually builds from a combination: waiting longer than expected, receiving the wrong order, food not meeting expectations, missing items, poor communication, feeling ignored, or a special occasion not going as planned. Sometimes the complaint is about the food; sometimes it's about how the guest felt. Understanding the emotion helps you respond more effectively."}, "ar": {"title": "افهم المشاعر خلف الشكوى", "body": "نادراً ما ينزعج الضيف من مسألة واحدة — فالإحباط يتراكم عادة من مجموعة أسباب: انتظار أطول من المتوقّع، أو طلب خاطئ، أو طعام دون التوقّعات، أو أصناف ناقصة، أو تواصل ضعيف، أو الشعور بالتجاهل، أو مناسبة خاصة لم تسر كما خُطّط لها. أحياناً تكون الشكوى عن الطعام، وأحياناً عن شعور الضيف. فهم المشاعر يساعدك على الرد بفعالية أكبر."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-calm", "keywords_en": "stay calm first voice respectful open body language avoid matching tone helping defending reassurance", "keywords_ar": "ابق هادئاً أولاً صوت محترم لغة جسد منفتحة تجنب مجاراة النبرة مساعدة دفاع طمأنة ضيف ضيوف زبون عميل", "en": {"title": "Stay calm first", "body": "Guests look to you for reassurance. No matter how emotional the conversation becomes: keep your voice calm, speak respectfully, maintain open body language, avoid matching the guest's tone, and focus on helping rather than defending. Your calm approach often helps calm the guest — professionalism creates confidence."}, "ar": {"title": "ابقَ هادئاً أولاً", "body": "الضيوف ينظرون إليك بحثاً عن الطمأنينة. مهما بلغت حدّة الحوار: حافظ على هدوء صوتك، وتحدّث باحترام، والزم لغة جسد منفتحة، وتجنّب مجاراة نبرة الضيف، وركّز على المساعدة لا على الدفاع. هدوؤك غالباً يهدّئ الضيف — والمهنية تصنع الثقة."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-food", "keywords_en": "food issues immediate attention wrong order cold overcooked undercooked flavour missing presentation dietary dismiss", "keywords_ar": "مشاكل الطعام اهتمام فوري طلب خاطئ بارد زائد الطهي ناقص نكهة ناقص تقديم غذائي تجاهل ضيف ضيوف زبون عميل", "en": {"title": "Food issues need immediate attention", "body": "If a guest raises a concern about their meal, take it seriously. Common concerns: the dish isn't what was ordered, the food is cold, the meal is overcooked or undercooked, the flavour isn't as expected, an item is missing, the presentation isn't right, or a dietary request wasn't followed. Never dismiss the concern — every guest deserves to feel heard."}, "ar": {"title": "مشاكل الطعام تحتاج اهتماماً فورياً", "body": "إذا أثار الضيف مخاوف بشأن وجبته، فخذها على محمل الجد. المخاوف الشائعة: الطبق ليس ما طُلب، أو الطعام بارد، أو الوجبة زائدة أو ناقصة الطهي، أو النكهة ليست كما توقّع، أو صنف ناقص، أو التقديم غير مناسب، أو طلب غذائي لم يُنفّذ. لا تستهِن بالمخاوف أبداً — كل ضيف يستحق أن يشعر بأنه مسموع."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-blame", "keywords_en": "never blame kitchen colleagues chef busy someone forgot one restaurant one team ownership", "keywords_ar": "لا تلم المطبخ الزملاء الشيف مشغول أحدهم نسي مطعم واحد فريق واحد مسؤولية ضيف ضيوف زبون عميل", "en": {"title": "Never blame the kitchen or your colleagues", "body": "Guests see one restaurant and one team. Avoid saying \"the kitchen made a mistake,\" \"the chef is busy,\" or \"someone forgot.\" Instead say: \"I'm sorry this happened. Let me get this resolved for you.\" Taking ownership demonstrates professionalism and teamwork."}, "ar": {"title": "لا تلُم المطبخ أو زملاءك أبداً", "body": "الضيوف يرون مطعماً واحداً وفريقاً واحداً. تجنّب قول «المطبخ أخطأ» أو «الشيف مشغول» أو «أحدهم نسي». وقل بدلاً من ذلك: «آسف لحدوث هذا. دعني أحلّه لك». تحمّل المسؤولية دليل مهنية وروح فريق."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-informed", "keywords_en": "keep guest informed replacement takes time updated new meal being prepared patience silence uncertainty", "keywords_ar": "أبق الضيف على اطلاع بديل يستغرق وقتاً تحديث وجبة جديدة قيد التحضير صبر صمت غموض ضيوف زبون عميل", "en": {"title": "Keep the guest informed", "body": "If a replacement dish or solution will take time, tell the guest and keep them updated. Simple communication reduces frustration: \"Your new meal is being prepared now,\" \"Thank you for your patience — it will be with you shortly.\" Silence increases uncertainty; communication builds trust."}, "ar": {"title": "أبقِ الضيف على اطلاع", "body": "إن كان الطبق البديل أو الحل سيستغرق وقتاً، أخبر الضيف وأبقه على اطلاع. التواصل البسيط يقلّل الإحباط: «وجبتك الجديدة قيد التحضير الآن»، «شكراً لصبرك — ستصلك قريباً». الصمت يزيد الغموض، والتواصل يبني الثقة."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-occasions", "keywords_en": "special occasions extra care birthday anniversary milestone higher expectations act quickly recover team", "keywords_ar": "مناسبات خاصة عناية إضافية عيد ميلاد ذكرى إنجاز توقعات أعلى تصرف بسرعة معالجة فريق ضيف ضيوف زبون عميل", "en": {"title": "Special occasions need extra care", "body": "Guests celebrating birthdays, anniversaries or family milestones often have higher expectations. If something goes wrong during a special occasion: recognise the importance of the moment, act quickly, and work together with the team to recover the experience. Guests often remember how we responded more than the original problem."}, "ar": {"title": "المناسبات الخاصة تحتاج عناية إضافية", "body": "الضيوف الذين يحتفلون بأعياد الميلاد أو الذكرى السنوية أو الإنجازات العائلية لديهم توقّعات أعلى غالباً. وإن حدث خطأ خلال مناسبة خاصة: أدرك أهمية اللحظة، وتصرّف بسرعة، واعمل مع الفريق لمعالجة التجربة. غالباً يتذكّر الضيوف كيف استجبنا أكثر من المشكلة نفسها."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-manager", "keywords_en": "when involve manager requests speak cannot resolve goodwill approval dissatisfied safety allergies food quality", "keywords_ar": "متى تشرك المدير يطلب لا يمكن الحل بادرة موافقة غير راض سلامة حساسية جودة الطعام ضيف ضيوف زبون عميل", "en": {"title": "Know when to involve a manager", "body": "Some situations need extra support. Involve your manager when: a guest requests to speak with one, the issue can't be resolved within your role, a goodwill gesture requires approval, the guest remains dissatisfied, or safety, allergies or food quality concerns require management attention. Escalating appropriately ensures the guest receives the right support."}, "ar": {"title": "اعرف متى تشرك المدير", "body": "بعض المواقف تحتاج دعماً إضافياً. أشرك مديرك حين: يطلب الضيف التحدّث معه، أو لا يمكن حل المسألة ضمن دورك، أو تتطلّب بادرة حسن النية موافقة، أو يبقى الضيف غير راضٍ، أو تتطلّب مسائل السلامة أو الحساسية أو جودة الطعام اهتمام الإدارة. التصعيد المناسب يضمن حصول الضيف على الدعم الصحيح."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}, {"id": "ag-mistakes", "keywords_en": "angry mistakes avoid interrupting defensive arguing thats just how the dish is blaming promises walking away", "keywords_ar": "أخطاء الغضب تجنب مقاطعة دفاع جدال هكذا هو الطبق لوم وعود الانصراف ضيف ضيوف زبون عميل", "en": {"title": "Common mistakes with angry guests", "body": "Avoid: interrupting the guest; becoming defensive; arguing about the complaint; saying \"that's just how the dish is\"; blaming the kitchen or another team member; making promises you cannot keep; ignoring guest emotions; walking away without explaining the next step; and treating the complaint as an inconvenience. Every guest deserves respect, regardless of the situation."}, "ar": {"title": "أخطاء شائعة مع الضيف الغاضب", "body": "تجنّب: مقاطعة الضيف؛ الدفاع عن النفس؛ الجدال حول الشكوى؛ قول «هكذا هو الطبق ببساطة»؛ لوم المطبخ أو زميل آخر؛ قطع وعود لا يمكنك الوفاء بها؛ تجاهل مشاعر الضيف؛ الانصراف دون شرح الخطوة التالية؛ والتعامل مع الشكوى كإزعاج. كل ضيف يستحق الاحترام مهما كان الموقف."}, "source": {"en": "Handling Angry Guests", "ar": "التعامل مع الضيوف الغاضبين"}}]},
  starbucks: {"meta": {"division": "starbucks", "title": "ATLAS Library — Starbucks (Art of Connection)", "note": "Only edit this file to change STARBUCKS content. Replace the example card with real topics.", "videoTypes": "link | youtube | stream | mp4"}, "cards": [{"id": "sb-3cs", "keywords_en": "3cs three cs connect care contribute meaningful connection framework model seen served value", "keywords_ar": "الثلاثة سي تواصل اهتمام إضافة نموذج إطار مرئي خدمة قيمة زبون عميل ضيف", "en": {"title": "The 3Cs of meaningful connection", "body": "Great service is expected — connection is what customers remember. CONNECT: make the customer feel seen, not just served. CARE: show empathy, curiosity and genuine warmth. CONTRIBUTE: add value to their day, not just their order. When you do all three, the experience becomes more than a transaction — it becomes a reason to return."}, "ar": {"title": "الـ 3Cs للتواصل الحقيقي", "body": "الخدمة الجيدة أمر متوقّع — أما التواصل فهو ما يتذكّره الزبون. التواصل (Connect): اجعل الزبون يشعر بأنه مرئي لا مجرد مخدوم. الاهتمام (Care): أظهر التعاطف والفضول والدفء الصادق. الإضافة (Contribute): أضف قيمة ليومه لا لطلبه فقط. حين تفعل الثلاثة معاً، تتحوّل التجربة من معاملة إلى سبب للعودة."}, "source": {"en": "Warm Welcome & The Power of Connection", "ar": "الترحيب الحار وقوة التواصل"}}, {"id": "sb-connect", "keywords_en": "connect first c name notice order repeat back regular drink welcome back warm tone eye contact trust", "keywords_ar": "تواصل السي الأول اسم ملاحظة الطلب تكرار مشروب معتاد أهلاً بعودتك نبرة دافئة تواصل بصري ثقة زبون عميل ضيف", "en": {"title": "CONNECT — rebuild trust, one customer at a time", "body": "Learn and use their name — remind them they're not just another order. Notice their order or cues and repeat it back to show you're present. Remember their regular drink — it shows you were really listening. Welcome them back to rebuild familiarity one visit at a time. Use a warm tone and eye contact to create a space that feels safe, n
