<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --ink:#16181D; --muted:#5B6472;
    --line:#E7E9ED; --brand:#0C6E5E; --brand-ink:#0A5A4D; --brand-soft:#E7F2EF;
    --user:#16181D; --warn-soft:#FBF3DE;
    --radius:16px; --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{ background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  body[dir="rtl"]{ font-family:"Segoe UI",Tahoma,"Geeza Pro",Arial,sans-serif; }
  .app{ max-width:720px; margin:0 auto; height:100vh; display:flex; flex-direction:column; background:var(--surface); }
  @media(min-width:760px){ .app{ border-inline:1px solid var(--line); } }
  header{ padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; }
  .logo{ width:40px;height:40px;border-radius:11px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;letter-spacing:.5px; }
  .htext{ flex:1; min-width:0; } .htext h1{ font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em; }
  .htext p{ font-size:12.5px;margin:2px 0 0;color:var(--muted); }
  .toggle{ display:flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:3px; flex:none; }
  .toggle button{ border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;line-height:1; }
  .toggle button.on{ background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08); }
  .scroll{ flex:1; overflow-y:auto; padding:22px 20px; display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; } .row.me{ justify-content:flex-end; }

  .row.me .bubble{ background:var(--user); color:#fff; border-bottom-right-radius:6px; }
  body[dir="rtl"] .row.me .bubble{ border-bottom-right-radius:var(--radius); border-bottom-left-radius:6px; }
  .row.bot .bubble{ background:var(--surface); border:1px solid var(--line); color:var(--ink); border-bottom-left-radius:6px; box-shadow:var(--shadow); }
  body[dir="rtl"] .row.bot .bubble{ border-bottom-left-radius:var(--radius); border-bottom-right-radius:6px; }
  .bubble.warn{ background:var(--warn-soft); border-color:#EBDDB4; color:#5F4B14; }
  .a-title{ font-weight:650; margin-bottom:5px; }
  .video{ margin-top:11px; } .vcap{ font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:5px;align-items:center; }
  .vframe{ width:100%; aspect-ratio:16/9; border:0; border-radius:12px; background:#000; display:block; }
  .vids{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .openbtn{ display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--brand-ink);
    text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px;background:var(--surface);width:fit-content; }
  .openbtn:hover{ border-color:var(--brand); background:var(--brand-soft); } .openbtn svg{ width:14px;height:14px;flex:none }
  .doc{ margin-top:11px; }
  .src{ margin-top:11px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  .src svg{ width:13px;height:13px;opacity:.7;flex:none }
  .related{ margin-top:11px; display:flex; flex-direction:column; gap:6px; } .related .lbl{ font-size:11.5px; color:var(--muted); }
  .intro{ text-align:center; padding:14px 8px 4px; color:var(--muted); }
  .intro .big{ color:var(--ink); font-weight:650; font-size:15px; margin-bottom:4px; } .intro .small{ font-size:13px; }
  .chips{ display:flex; flex-wrap:wrap; gap:9px; margin-top:8px; }
  .chip{ border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:9px 13px; border-radius:999px; font-size:13px; cursor:pointer; transition:.15s; line-height:1.3; text-align:start; }
  .chip:hover{ border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft); }
  .dots{ display:inline-flex; gap:4px; padding:2px 0; } .dots i{ width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.5;animation:b 1.1s infinite; }
  .dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{ 0%,60%,100%{transform:translateY(0);opacity:.35} 30%{transform:translateY(-4px);opacity:.9} }
  .composer{ border-top:1px solid var(--line); padding:12px 16px 14px; }
  .field{ display:flex; align-items:flex-end; gap:9px; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:6px 6px 6px 14px; }
  body[dir="rtl"] .field{ padding:6px 14px 6px 6px; } .field:focus-within{ border-color:var(--brand); background:var(--surface); }
  textarea{ flex:1; border:0; background:transparent; resize:none; font:inherit; font-size:14.5px; color:var(--ink); padding:8px 0; max-height:120px; outline:none; }
  .send{ width:38px;height:38px;border-radius:10px;border:0;background:var(--brand);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;transition:.15s; }
  .send:disabled{ opacity:.4;cursor:default; } .send svg{ width:18px;height:18px }
  .foot{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:9px; }
</style>

const EMBEDDED = {"meta": {"title": "CX Assistant Library — Art of Selling (Retail)", "note": "This is the only file you edit to add content. Each item in 'cards' is one topic. Copy a card, change the text, and you've added knowledge. 'videos' and 'link' are optional — delete them if a card has none.", "videoTypes": "link (opens the video page — use for ConnectNow/SharePoint links that need sign-in) | youtube (use the video id) | stream (embed URL) | mp4 (direct file URL)"}, "cards": [{"id": "definition", "keywords_en": "conversion rate convert percentage formula calculate what is meaning definition visitors buyers footfall", "keywords_ar": "معدل التحويل نسبة معادلة حساب تعريف يعني ما هو زوار مشترين", "en": {"title": "What is a conversion rate?", "body": "Conversion rate is the percentage of store visitors who make a purchase. Formula: Number of Sales ÷ Number of Visitors × 100. Example: if 100 people enter and 20 buy, your conversion rate is 20% — 1 in every 5 visitors buys something."}, "ar": {"title": "ما هو معدل التحويل؟", "body": "معدل التحويل هو نسبة الزوّار الذين يقومون بالشراء من إجمالي من دخل المتجر. المعادلة: عدد المبيعات ÷ عدد الزوّار × ١٠٠. مثال: إذا دخل ١٠٠ شخص واشترى ٢٠، فمعدل التحويل ٢٠٪ — أي واحد من كل ٥ زوّار يشتري."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/275387/boosting-sales-through-conversion", "title": {"en": "Boosting Sales Through Conversion", "ar": "رفع المبيعات عبر التحويل"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/286720/conversion", "title": {"en": "Conversion", "ar": "التحويل"}}]}, {"id": "why", "keywords_en": "why important matters reason revenue satisfaction demand stock", "keywords_ar": "لماذا مهم أهمية سبب إيراد رضا طلب مخزون", "en": {"title": "Why does conversion rate matter?", "body": "A higher conversion rate means more sales from the same footfall — you don't need more visitors, just more buyers. It also reflects customer satisfaction: if people leave without buying, something needs fixing. And it helps forecast demand and manage stock."}, "ar": {"title": "لماذا معدل التحويل مهم؟", "body": "ارتفاع معدل التحويل يعني مبيعات أكثر من نفس عدد الزوّار — لست بحاجة لزوّار أكثر بل لمشترين أكثر. كما يعكس رضا العملاء: إذا غادروا دون شراء فهناك ما يجب تحسينه. ويساعد في توقّع الطلب وإدارة المخزون."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "sales-math", "keywords_en": "sales atv average transaction footfall one percent 1% increase impact revenue calculate math formula kd more sales", "keywords_ar": "مبيعات متوسط الفاتورة زيادة تأثير حساب معادلة دينار واحد بالمئة مبيعات أكثر", "en": {"title": "How conversion impacts sales", "body": "Sales = Footfall × Conversion × ATV (average transaction value). Example: 10,000 × 25% × 14 KD = 35,000 KD. If you raise conversion by just 1% (to 26%), sales become 36,400 KD — about a 4% increase in sales from a single 1% gain."}, "ar": {"title": "كيف يؤثّر التحويل على المبيعات", "body": "المبيعات = عدد الزوّار × معدل التحويل × متوسط قيمة الفاتورة. مثال: ١٠٬٠٠٠ × ٢٥٪ × ١٤ د.ك = ٣٥٬٠٠٠ د.ك. وإذا رفعت التحويل ١٪ فقط (إلى ٢٦٪) تصبح المبيعات ٣٦٬٤٠٠ د.ك — أي زيادة نحو ٤٪."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "personalized", "keywords_en": "personalized personal needs name tailor recommend recommendation skincare individual", "keywords_ar": "شخصية احتياج اسم توصية تخصيص اهتمام", "en": {"title": "Personalized service", "body": "Understand each customer's needs. Greet warmly, ask open-ended questions, use their name if known, and tailor recommendations to what they're interested in. Customers buy more when they feel understood and valued."}, "ar": {"title": "الخدمة الشخصية", "body": "افهم احتياج كل عميل. رحّب به بحرارة، واطرح أسئلة مفتوحة، واستخدم اسمه إن عرفته، وقدّم توصيات تناسب اهتمامه. العميل يشتري أكثر حين يشعر بأنه مفهوم وذو قيمة."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "product-knowledge", "keywords_en": "product knowledge expert features benefits compare comparison know products trust advice", "keywords_ar": "معرفة المنتج خبير مزايا فوائد مقارنة ثقة نصيحة", "en": {"title": "Product knowledge", "body": "Be the expert. Know product features, benefits and uses, offer comparisons to help customers decide, and share tips or extra uses they may not know. Confidence in your knowledge builds trust — and trust leads to more sales."}, "ar": {"title": "المعرفة بالمنتج", "body": "كن الخبير. اعرف مزايا المنتجات وفوائدها واستخداماتها، وقدّم مقارنات تساعد العميل على القرار، وشارك نصائح قد لا يعرفها. ثقتك بمعرفتك تبني ثقة العميل — والثقة تقود إلى مبيعات أكثر."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "upsell", "keywords_en": "upsell upselling cross sell crosssell add more higher premium complement bundle suggest push without pushy extra item", "keywords_ar": "بيع أعلى بيع متقاطع منتج أعلى إضافة يكمل اقتراح دون إلحاح ضغط", "en": {"title": "Upselling & cross-selling", "body": "Upselling means suggesting a higher-end product and highlighting its added value. Cross-selling means suggesting items that go together (e.g. a t-shirt with new jeans). Keep it subtle and frame it as a benefit to the customer, not a sales push."}, "ar": {"title": "البيع الأعلى والبيع المتقاطع", "body": "البيع الأعلى هو اقتراح منتج أرقى مع إبراز قيمته المضافة. البيع المتقاطع هو اقتراح منتجات متكاملة (مثل قميص مع بنطال جينز). اجعله لطيفاً وقدّمه كفائدة للعميل لا كضغط للبيع."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "urgency", "keywords_en": "urgency limited stock offer deal fomo hurry scarcity ends today promotion now quick", "keywords_ar": "إلحاح عرض محدود مخزون ينتهي ترويج الآن سرعة فرصة", "en": {"title": "Creating urgency", "body": "Highlight limited-time offers or low stock to encourage action now. Use phrases like \"only a few left\" or \"offer ends today.\" Fear of missing out is a strong motivator. Example: \"This promotion is only available this weekend — don't miss out!\""}, "ar": {"title": "خلق شعور بالإلحاح", "body": "أبرز العروض محدودة الوقت أو قلّة المخزون لتشجيع العميل على التصرّف الآن. استخدم عبارات مثل «بقيت قطع قليلة» أو «العرض ينتهي اليوم». الخوف من تفويت الفرصة محفّز قوي. مثال: «هذا العرض متاح هذا الأسبوع فقط — لا تفوّته!»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "followup", "keywords_en": "follow up followup check back engage out of stock return relationship loyalty come back", "keywords_ar": "متابعة تواصل غير متوفر علاقة ولاء عودة", "en": {"title": "Follow-up", "body": "Stay engaged through the whole shopping journey. After helping a customer, check back to see if they need anything else. Offer to follow up on out-of-stock items. Consistent engagement builds relationships and brings customers back."}, "ar": {"title": "المتابعة", "body": "ابقَ متواصلاً طوال رحلة التسوّق. بعد مساعدة العميل، عُد إليه لتتأكد إن كان يحتاج شيئاً آخر. اعرض المتابعة بشأن المنتجات غير المتوفرة. التواصل المستمر يبني العلاقات ويعيد العملاء."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "greeting", "keywords_en": "greet greeting hello welcome smile eye contact approach start how to greet", "keywords_ar": "ترحيب تحية أهلا ابتسامة تواصل بصري استقبال كيف أرحب", "en": {"title": "Warm greeting", "body": "Smile genuinely, make eye contact, and use a warm, personal greeting — not a robotic one. Example: for an unsure customer, \"Hi! Let me know if there's anything specific you're looking for today.\""}, "ar": {"title": "الترحيب الحار", "body": "ابتسم بصدق، وحافظ على التواصل البصري، واستخدم ترحيباً حاراً وشخصياً لا آلياً. مثال: لعميل متردد، «أهلاً! أخبرني إن كنت تبحث عن شيء محدد اليوم.»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "listening", "keywords_en": "listen listening active understand paraphrase interrupt body language attention", "keywords_ar": "إصغاء استماع فهم مقاطعة لغة الجسد انتباه", "en": {"title": "Active listening", "body": "Focus fully on the customer, use body language like nodding, and paraphrase their needs to confirm — \"So you're looking for a gift for someone who loves skincare?\" Avoid interrupting or jumping to solutions too early."}, "ar": {"title": "الإصغاء الفعّال", "body": "ركّز كلياً على العميل، واستخدم لغة الجسد مثل الإيماء، وأعد صياغة احتياجه للتأكد — «إذاً أنت تبحث عن هدية لمن يحب العناية بالبشرة؟» تجنّب المقاطعة أو التسرّع في تقديم الحلول."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "open-questions", "keywords_en": "open ended questions ask questions conversation yes no what how engage talk", "keywords_ar": "أسئلة مفتوحة سؤال حوار نعم لا محادثة تفاعل", "en": {"title": "Open-ended questions", "body": "Open-ended questions gather more detail than yes/no ones. Instead of \"Are you looking for a specific item?\" ask \"What brings you in today? Are you shopping for yourself or someone else?\" This makes the interaction feel like a conversation, not a transaction."}, "ar": {"title": "الأسئلة المفتوحة", "body": "الأسئلة المفتوحة تجمع تفاصيل أكثر من أسئلة نعم/لا. بدل «هل تبحث عن منتج معيّن؟» اسأل «ما الذي أتى بك اليوم؟ هل تتسوّق لنفسك أم لشخص آخر؟» هذا يجعل التعامل حواراً لا مجرد معاملة."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "closing", "keywords_en": "close closing seal deal hesitant unsure not sure doubt reassure register checkout guide buy convince undecided", "keywords_ar": "إتمام إغلاق متردد غير متأكد طمأنة إقناع صندوق توجيه شراء حائر", "en": {"title": "Closing the sale", "body": "Closing should feel natural and supportive, not pushy. Use assumptive phrases like \"Would you like to take this to the register?\" Highlight benefits, and reassure hesitant customers: \"You can always exchange it if it's not the perfect fit.\""}, "ar": {"title": "إتمام البيع", "body": "إتمام البيع يجب أن يكون طبيعياً وداعماً لا ملحّاً. استخدم عبارات افتراضية مثل «هل تودّ أخذه إلى الصندوق؟» أبرز الفوائد، وطمئن العميل المتردد: «يمكنك دائماً استبداله إن لم يكن مناسباً.»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "journey", "keywords_en": "journey stages entry browsing decision checkout touchpoints steps where impact stage", "keywords_ar": "رحلة مراحل دخول تصفح قرار دفع خطوات أين مرحلة", "en": {"title": "Where you impact conversion", "body": "You can influence conversion at four stages: Entry & Greeting, Product Browsing, Decision Making, and Checkout. Improve engagement at each stage — a good greeting at entry, helpful guidance while browsing, reassurance at decision time, and a smooth checkout."}, "ar": {"title": "أين تؤثّر على التحويل", "body": "يمكنك التأثير على التحويل في أربع مراحل: الدخول والترحيب، تصفّح المنتجات، اتخاذ القرار، والدفع. حسّن التفاعل في كل مرحلة — ترحيب عند الدخول، إرشاد أثناء التصفّح، طمأنة عند القرار، ودفع سلس."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "measurement", "keywords_en": "measure measured cctv camera count footfall pos heat map track tool sensor how measured tracking", "keywords_ar": "قياس كاميرا عد زوار نقاط البيع خريطة حرارية أداة تتبع كيف يقاس", "en": {"title": "How conversion is measured", "body": "Stores use cameras and tools to measure conversion. Entrance cameras count footfall and filter out staff/non-target entries; floor cameras track engagement and wait times with heat mapping; POS cameras link transactions to actual customers. This data is combined with POS for an accurate rate."}, "ar": {"title": "كيف يُقاس التحويل", "body": "تستخدم المتاجر الكاميرات والأدوات لقياس التحويل. كاميرات المدخل تحسب الزوّار وتستبعد الموظفين؛ كاميرات الصالة تتابع التفاعل وأوقات الانتظار عبر الخرائط الحرارية؛ كاميرات الصندوق تربط المعاملات بالعملاء الفعليين."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "context", "keywords_en": "numbers q4 lfl stats statistics benchmark current walk away left without buying 80 71 26 data opportunity", "keywords_ar": "أرقام إحصاء معيار غادروا دون شراء بيانات فرصة الوضع الحالي", "en": {"title": "Why this matters right now", "body": "The numbers show the opportunity: in Q4, 80% of potential customers left without buying, only 15% engaged with more than one brand, and like-for-like transactions were down 26%. With conversion around 71%, nearly 1 in 3 customers still walks away without purchasing."}, "ar": {"title": "لماذا هذا مهم الآن", "body": "الأرقام تُظهر الفرصة: في الربع الأخير غادر ٨٠٪ من العملاء المحتملين دون شراء، وتفاعل ١٥٪ فقط مع أكثر من علامة، وانخفضت المعاملات المماثلة ٢٦٪. ومع معدل تحويل نحو ٧١٪، لا يزال قرابة عميل من كل ٣ يغادر دون شراء."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "fi-why", "keywords_en": "first impression matter 7 seconds seven trust loyalty why important welcome new customer", "keywords_ar": "الانطباع الأول سبع ثوان ثقة ولاء لماذا مهم ترحيب عميل جديد", "en": {"title": "Why first impressions matter", "body": "First impressions form in about 7 seconds — and 55% comes from body language, 38% from tone, only 7% from words. A warm first impression builds trust instantly, makes customers more likely to buy, encourages loyalty and repeat visits, sets you apart from competitors, and shapes what they tell others. You get one chance — make it count."}, "ar": {"title": "لماذا الانطباع الأول مهم", "body": "يتكوّن الانطباع الأول خلال نحو ٧ ثوانٍ — و٥٥٪ منه من لغة الجسد، و٣٨٪ من نبرة الصوت، و٧٪ فقط من الكلمات. الانطباع الدافئ يبني الثقة فوراً، ويزيد احتمال الشراء، ويشجّع الولاء وتكرار الزيارة، ويميّزك عن المنافسين، ويؤثّر على ما يقوله العميل للآخرين. لديك فرصة واحدة — استثمرها."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/233495/great-first-impression-art-of-selling-h-m", "title": {"en": "Great First Impression — Art of Selling (H&M)", "ar": "انطباع أول رائع — فن البيع (إتش آند إم)"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/286721/first-impression", "title": {"en": "First Impression", "ar": "الانطباع الأول"}}]}, {"id": "fi-nonverbal", "keywords_en": "body language non verbal nonverbal posture eye contact smile tone signals 55 38 7 how you say", "keywords_ar": "لغة الجسد غير لفظي وضعية تواصل بصري ابتسامة نبرة إشارات كيف تقول", "en": {"title": "Body language & non-verbal cues", "body": "Most of a first impression is non-verbal — 55% body language and 38% tone versus just 7% words. Smile genuinely, make eye contact, and keep an open, inviting posture. Read the customer's signals and adjust your approach. It's not just what you say, but how you say it."}, "ar": {"title": "لغة الجسد والإشارات غير اللفظية", "body": "معظم الانطباع الأول غير لفظي — ٥٥٪ لغة جسد و٣٨٪ نبرة صوت مقابل ٧٪ فقط للكلمات. ابتسم بصدق، وتواصل بالعين، وحافظ على وضعية منفتحة ومرحّبة. اقرأ إشارات العميل وعدّل أسلوبك. المهم ليس ما تقوله فقط، بل كيف تقوله."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}}, {"id": "fi-loyal", "keywords_en": "loyal returning guest repeat customer recognize acknowledge loyalty aura perks regular remember", "keywords_ar": "عميل عائد مخلص متكرر ولاء أورا مزايا تعرف تذكر منتظم", "en": {"title": "Recognizing loyal & returning guests", "body": "Spot and acknowledge returning customers, and personalize the interaction based on their past visits and preferences. Use loyalty programmes and exclusive perks (like AURA) to make them feel recognised and strengthen the relationship. A returning guest who feels remembered comes back more often."}, "ar": {"title": "التعرّف على العملاء العائدين", "body": "تعرّف على العملاء العائدين ورحّب بهم، وخصّص التعامل بناءً على زياراتهم السابقة وتفضيلاتهم. استخدم برامج الولاء والمزايا الحصرية (مثل AURA) ليشعروا بأنهم معروفون، ولتقوية العلاقة. العميل العائد الذي يشعر بأنه متذكَّر يعود أكثر."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}}, {"id": "disc-why", "keywords_en": "discovery matter understand needs 82 percent uncover why trust emotions people not product", "keywords_ar": "اكتشاف فهم احتياج ثمانين ثقة عاطفة لماذا الإنسان لا المنتج", "en": {"title": "Why discovery matters", "body": "Discovery means uncovering what the customer really needs before recommending. 82% of shoppers are more likely to buy from someone who understands their needs. It shifts the focus from product to people and builds trust, not just transactions — and since emotions drive most buying decisions, understanding them leads to loyalty and stronger sales."}, "ar": {"title": "لماذا الاكتشاف مهم", "body": "الاكتشاف يعني فهم ما يحتاجه العميل فعلاً قبل تقديم التوصية. ٨٢٪ من المتسوّقين أكثر ميلاً للشراء ممن يفهم احتياجهم. وهو ينقل التركيز من المنتج إلى الإنسان ويبني الثقة لا مجرد معاملة — ولأن العاطفة تقود معظم قرارات الشراء، فإن فهمها يقود إلى الولاء ومبيعات أقوى."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/267659/art-of-discovery", "title": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/208860/let-s-hear-from-marina-bath-body-works-vendome-mall-qatar", "title": {"en": "Let's Hear from Marina — Bath & Body Works, Qatar", "ar": "من مارينا — باث آند بودي ووركس، قطر"}}]}, {"id": "disc-listening", "keywords_en": "active listening discovery listen understand empathy unsaid just looking feel heard tune in", "keywords_ar": "إصغاء فعال اكتشاف استماع فهم تعاطف أتفرج مشاعر مسموع", "en": {"title": "Active listening (the heart of discovery)", "body": "Active listening is tuning in to what's said and unsaid — not waiting for your turn to talk. Listen to understand, ask with purpose and listen with empathy, and use the customer's own words and emotions in your recommendation. When someone says \"I'm just looking,\" stay with them. People buy confidence, comfort and pride — and they remember how you made them feel."}, "ar": {"title": "الإصغاء الفعّال (قلب الاكتشاف)", "body": "الإصغاء الفعّال هو الانتباه لما يُقال وما لا يُقال — لا انتظار دورك في الكلام. أصغِ لتفهم، واسأل بهدف وأصغِ بتعاطف، واستخدم كلمات العميل ومشاعره في توصيتك. حين يقول «أنا فقط أتفرّج»، ابقَ معه. الناس يشترون الثقة والراحة والفخر — ويتذكّرون كيف جعلتهم يشعرون."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-questions", "keywords_en": "open ended questions closed doors what brings you in occasion mood ask discovery great questions floor", "keywords_ar": "أسئلة مفتوحة مغلقة مناسبة مزاج ما أتى بك سؤال اكتشاف", "en": {"title": "Questions that open doors", "body": "Open-ended questions invite stories and reveal needs and emotions; closed yes/no questions shut conversation down. Use openers like \"What brings you in today?\", \"What's the occasion or mood you're shopping for?\", and \"How do you want this to feel?\" Avoid \"Do you need help?\" and \"Are you just browsing?\" Open questions spark connection."}, "ar": {"title": "أسئلة تفتح الأبواب", "body": "الأسئلة المفتوحة تدعو للقصص وتكشف الاحتياجات والمشاعر؛ أما أسئلة نعم/لا المغلقة فتُنهي الحوار. استخدم عبارات مثل «ما الذي أتى بك اليوم؟» و«ما المناسبة أو المزاج الذي تتسوّق له؟» و«كيف تريد أن تشعر بهذا؟» وتجنّب «هل تحتاج مساعدة؟» و«هل تتفرّج فقط؟» الأسئلة المفتوحة تصنع تواصلاً."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-personalization", "keywords_en": "personalization personalize mirror tone tailor lifestyle emotional cues browsing treat make them feel", "keywords_ar": "تخصيص نبرة نمط حياة إشارات عاطفية أتفرج تدلل شعور", "en": {"title": "Power of personalization", "body": "Personalization turns a casual visit into a memorable experience. Four ways: mirror their tone and pace; stay curious even at \"just browsing\" (\"Anything you're treating yourself to today?\"); tailor recommendations to their world — lifestyle, mood, occasion; and use emotional cues in your language (\"This feels like something you'd love for unwinding after a long day\"). Reflect who they are, don't push what you like."}, "ar": {"title": "قوة التخصيص", "body": "التخصيص يحوّل زيارة عابرة إلى تجربة تُذكر. أربع طرق: جارِ نبرتهم وإيقاعهم؛ ابقَ فضولياً حتى عند «أتفرّج فقط» («هل من شيء تدلّل به نفسك اليوم؟»)؛ خصّص التوصية لعالمهم — نمط الحياة والمزاج والمناسبة؛ واستخدم إشارات عاطفية («يبدو أنك ستحب هذا للاسترخاء بعد يوم طويل»). اعكس شخصيتهم لا تفرض ما يعجبك."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-resistance", "keywords_en": "resistance just looking hesitant rejection space rephrase not pushy handle objection browsing wall cold", "keywords_ar": "مقاومة أتفرج تردد رفض مساحة إعادة صياغة ملح اعتراض جدار", "en": {"title": "Handling resistance (\"I'm just looking\")", "body": "When a customer says \"I'm just looking\" or gives short answers, it's not rejection — it's hesitation. Don't break the wall, walk gently around it: rephrase your question more softly, give them space, or share a warm line like \"This one's been a favourite for people looking to unwind after work.\" Stay present, not pushy. Example: \"Of course — take your time! Anything you're in the mood for today?\""}, "ar": {"title": "التعامل مع التردّد («أنا فقط أتفرّج»)", "body": "حين يقول العميل «أنا فقط أتفرّج» أو يعطي إجابات قصيرة، فهذا ليس رفضاً بل تردّد. لا تكسر الجدار بل مُرّ حوله بلطف: أعد صياغة سؤالك بنعومة، أو امنحه مساحة، أو شارك عبارة دافئة مثل «هذا من المفضّل لمن يريد الاسترخاء بعد العمل». ابقَ حاضراً لا ملحّاً. مثال: «بالطبع — خذ وقتك! هل من شيء يناسب مزاجك اليوم؟»"}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "story-what", "keywords_en": "product storytelling story what is features feeling picture life sell think about it take it", "keywords_ar": "سرد قصة المنتج ما هو مزايا شعور تخيل حياة بيع", "en": {"title": "What is product storytelling?", "body": "Product storytelling means presenting a product through a short story and a moment, not a list of features. You bring it to life so the customer pictures it in their day. Customers don't fall in love with features — they fall in love with what life feels like with the product. A good story turns \"I'll think about it\" into \"I'll take it.\""}, "ar": {"title": "ما هو سرد قصة المنتج؟", "body": "سرد قصة المنتج يعني تقديم المنتج عبر قصة قصيرة ولحظة، لا قائمة مزايا. تجعله حيّاً ليتخيّله العميل في يومه. العملاء لا يعشقون المزايا — بل يعشقون شعور الحياة مع المنتج. القصة الجيدة تحوّل «سأفكّر بالأمر» إلى «سآخذه»."}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/273549/art-of-product-storytelling-maclex-d-costa-h-m", "title": {"en": "Art of Product Storytelling — Maclex D'Costa (H&M)", "ar": "فن سرد قصة المنتج — ماكليكس دي كوستا (إتش آند إم)"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/276578/art-of-product-storytelling", "title": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}]}, {"id": "story-why", "keywords_en": "why stories sell attention feeling picture conversion basket loyalty scene maybe later take it", "keywords_ar": "لماذا القصص تبيع انتباه مشاعر تخيل تحويل سلة ولاء مشهد", "en": {"title": "Why stories sell", "body": "A quick scene grabs attention better than a spec (\"Picture stepping out after work in this top that breathes the heat away\"). Stories create feelings, and feelings drive choices; they help customers picture the product in their life, and they move people from \"maybe later\" to \"I'll take it.\" Stories lift conversion, basket size, and loyalty."}, "ar": {"title": "لماذا القصص تبيع", "body": "المشهد السريع يجذب الانتباه أكثر من المواصفة («تخيّل خروجك بعد العمل بهذا القميص الذي يطرد الحر»). القصص تصنع مشاعر، والمشاعر تقود القرارات؛ وتساعد العميل على تخيّل المنتج في حياته، وتنقله من «ربما لاحقاً» إلى «سآخذه». القصص ترفع التحويل وحجم السلة والولاء."}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}, {"id": "story-formula", "keywords_en": "story formula moment sensory feel words personal tie close scene example how to tell", "keywords_ar": "صيغة قصة لحظة حسي كلمات رابط شخصي مشهد مثال كيف", "en": {"title": "The storytelling formula", "body": "Use a simple four-part formula: Moment + simple sensory \"feel-it\" words + a personal tie-in + close with a scene they can live today. Example — instead of \"linen dress, breathable fabric,\" say: \"This linen dress is your easy win for warm days — light on the skin, easy to move in, perfect for chilly AC moments. You'll wear it from lunch to late coffee and still feel fresh.\""}, "ar": {"title": "صيغة سرد القصة", "body": "استخدم صيغة بسيطة من أربعة أجزاء: لحظة + كلمات حسّية «تُشعرك» بسيطة + رابط شخصي + الختام بمشهد يعيشونه اليوم. مثال — بدل «فستان كتّان، قماش يتنفّس» قل: «هذا الفستان الكتّاني خيارك السهل للأيام الحارة — خفيف على البشرة، مريح في الحركة، مثالي لأجواء التكييف الباردة. سترتدينه من الغداء إلى قهوة المساء وتبقين منتعشة.»"}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}, {"id": "rec-why", "keywords_en": "elevated recommendation add on why important atv ipt expertise trust upsell complete experience", "keywords_ar": "توصية إضافة لماذا متوسط الفاتورة قطع خبرة ثقة تجربة", "en": {"title": "Why elevated recommendations matter", "body": "A good recommendation shows you understand the customer and turns a single purchase into a complete experience. Smart add-ons build trust, not pressure — you're showing care and expertise, not pushing. Done consistently, it lifts service quality a ion, not a pitch. Speak like a person, keep it short and clear, and share tips as if helping a friend. Always link the suggestion back to what they already chose so it stays relevant, and let the choice feel like theirs. Say \"A lot of people who love what you picked also enjoy this one\" — not \"This is the best, you should get it.\""}, "ar": {"title": "اجعلها تبدو عفوية", "body": "أفضل التوصيات تأتي من حوار حقيقي لا من خطبة بيع. تكلّم كإنسان، وأبقِ الكلام قصيراً واضحاً، وشارك النصيحة كأنك تساعد صديقاً. اربط الاقتراح دائماً بما اختاره ليبقى ملائماً، واجعل القرار يبدو قراره هو. قل «كثير ممن أحبّوا ما اخترته يحبّون هذا أيضاً» — لا «هذا الأفضل، عليك أخذه»."}, "source": {"en": "Art of Elevated Recommendation", "ar": "فن التوصية المتقنة"}}]};

/* ==================== SEARCH ENGINE (no AI) ==================== */
const STOP = new Set(("the a an is are do i to my of for and or in on at with how what why when who can you your it this that me we our us if not no yes some any as be قد "+
  "في من ما هو هي كيف لماذا متى هل على عن مع او و أو ال إلى عند اذا إذا هذا هذه ان أن كي لكي").split(/\s+/));
function normalize(s){ return (s||"").toLowerCase()
  .replace(/[\u064B-\u0652\u0670]/g,"").replace(/\u0640/g,"")
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/[ى]/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
  .replace(/[^a-z0-9\u0600-\u06FF]+/g," ").replace(/\s+/g," ").trim(); }
function stem(t){ if(/^[a-z0-9]+$/.test(t)) return t.replace(/(ings?|edly|ed|ly|es|s)$/,"");
  let x=t.replace(/^(وال|فال|بال|كال|ال|و|ف|ب|ك|ل)/,"").replace(/(ات|ون|ين|ها|هم|ة|ه|ي)$/,""); return x.length>=2?x:t; }
function tokens(s){ return normalize(s).split(" ").filter(w=>w.length>=2 && !STOP.has(w)).map(stem); }
function hs(str){ return new Set(tokens(str)); }

let LIB = EMBEDDED.cards, INDEX = [];
function buildIndex(){ INDEX = LIB.map(c=>({ card:c,
  en:{ title:hs(c.en.title), kw:hs(c.keywords_en||""), body:hs(c.en.title+" "+c.en.body+" "+(c.keywords_en||"")) },
  ar:{ title:hs(c.ar.title), kw:hs(c.keywords_ar||""), body:hs(c.ar.title+" "+c.ar.body+" "+(c.keywords_ar||"")) } })); }

function search(query,l){
  const q=tokens(query); if(!q.length) return {best:null,related:[]};
  const scored=INDEX.map(ix=>{ const f=ix[l]; let s=0;
    q.forEach(tok=>{ if(f.title.has(tok)) s+=3; else if(f.kw.has(tok)) s+=3; else if(f.body.has(tok)) s+=1;
      else { for(const h of f.body){ if(h.length>=4 && (h.includes(tok)||tok.includes(h))){ s+=1; break; } } } });
    return {card:ix.card,score:s}; }).sort((a,b)=>b.score-a.score);
  const best=scored[0].score>=2?scored[0]:null;
  const related=scored.filter(x=>x!==scored[0] && x.score>=2).slice(0,2).map(x=>x.card);
  return {best,related};
}

const UI={
 en:{title:"CX Assistant",subtitle:"Art of Selling — finds the best match from your library",ph:"Ask about the Art of Selling…",

   introSmall:"Type your question — I find the right guidance from your training content.",src:"Source",seeAlso:"Related:",openDoc:"Open full module",watch:"Watch video",

   chips:["What is conversion rate?","How do I make a great first impression?","Good questions to ask a customer?","How do I recommend an add-on naturally?"]},
 ar:{title:"مساعد تجربة العميل",subtitle:"فن البيع — يجد أفضل إجابة من مكتبتك",ph:"اسأل عن فن البيع…",

   introSmall:"اكتب سؤالك — أجد لك الإرشاد المناسب من محتوى تدريبك.",src:"المصدر",seeAlso:"ذات صلة:",openDoc:"افتح الوحدة كاملة",watch:"شاهد الفيديو",

};
let lang="en"; const $=id=>document.getElementById(id), scroll=$("scroll");
function setLang(l){ lang=l; document.body.setAttribute("dir",l==="ar"?"rtl":"ltr");
  $("btnEn").classList.toggle("on",l==="en"); $("btnAr").classList.toggle("on",l==="ar");
  const u=UI[l]; $("title").textContent=u.title; $("subtitle").textContent=u.subtitle; $("input").placeholder=u.ph; $("foot").textContent=u.foot; renderIntro(); }
function renderIntro(){ scroll.innerHTML=""; const u=UI[lang];
  const w=document.createElement("div"); w.className="intro"; w.innerHTML=`<div class="big">${u.introBig}</div><div class="small">${u.introSmall}</div>`;
  const chips=document.createElement("div"); chips.className="chips";
  u.chips.forEach(c=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=c; b.onclick=()=>{ $("input").value=c; ask(); }; chips.appendChild(b); });
  w.appendChild(chips); scroll.appendChild(w); }
function dropIntro(){ const i=scroll.querySelector(".intro"); if(i) i.remove(); }
function addUser(text){ dropIntro(); const r=document.createElement("div"); r.className="row me";
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text; r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight; }

const PLAY=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
function videoNodes(card){
  let vids=[]; if(Array.isArray(card.videos)) vids=card.videos; else if(card.video) vids=[card.video];
  if(!vids.length) return null;
  const linkVids=vids.filter(v=>!v.type||v.type==="link");
  const embedVids=vids.filter(v=>["youtube","mp4","stream","embed"].includes(v.type));
  const frag=document.createDocumentFragment();
  embedVids.forEach(v=>{ const wrap=document.createElement("div"); wrap.className="video";
    if(v.title){ const cap=document.createElement("div"); cap.className="vcap"; cap.innerHTML=PLAY+`<span>${v.title[lang]||v.title.en}</span>`; wrap.appendChild(cap); }
    let m; if(v.type==="youtube"){ m=document.createElement("iframe"); m.src="https://www.youtube-nocookie.com/embed/"+v.id; m.allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"; m.allowFullscreen=true; }
    else if(v.type==="mp4"){ m=document.createElement("video"); m.src=v.url; m.controls=true; }
    else { m=document.createElement("iframe"); m.src=v.url; m.allowFullscreen=true; }
    m.className="vframe"; wrap.appendChild(m); frag.appendChild(wrap); });
  if(linkVids.length){ const box=document.createElement("div"); box.className="vids";
    linkVids.forEach(v=>{ const a=document.createElement("a"); a.className="openbtn"; a.href=v.url; a.target="_blank"; a.rel="noopener";
      const t=v.title?(v.title[lang]||v.title.en):""; a.innerHTML=PLAY+`<span>${UI[lang].watch}${t?": "+t:""}</span>`; box.appendChild(a); });
    frag.appendChild(box); }
  return frag;
}

function addAnswer(card,related){
  const r=document.createElement("div"); r.className="row bot"; const b=document.createElement("div"); b.className="bubble";
  const t=document.createElement("div"); t.className="a-title"; t.textContent=card[lang].title; b.appendChild(t);
  const body=document.createElement("div"); body.textContent=card[lang].body; b.appendChild(body);
  const vids=videoNodes(card); if(vids) b.appendChild(vids);
  if(card.link){ const wrap=document.createElement("div"); wrap.className="doc"; const a=document.createElement("a"); a.className="openbtn"; a.href=card.link; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>${UI[lang].openDoc}</span>`; wrap.appendChild(a); b.appendChild(wrap); }
  const s=document.createElement("div"); s.className="src";
  s.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg><span>${UI[lang].src}: ${card.source[lang]}</span>`; b.appendChild(s);
  if(related&&related.length){ const rel=document.createElement("div"); rel.className="related";
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=UI[lang].seeAlso; rel.appendChild(lbl);
    related.forEach(rc=>{ const c=document.createElement("button"); c.className="chip"; c.textContent=rc[lang].title; c.onclick=()=>{ $("input").value=rc[lang].title; ask(); }; rel.appendChild(c); });
    b.appendChild(rel); }
  r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight;
}
function addWarn(text){ const r=document.createElement("div"); r.className="row bot"; const b=document.createElement("div"); b.className="bubble warn"; b.textContent=text; r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight; }
function addTyping(){ const r=document.createElement("div"); r.className="row bot"; r.id="typing"; r.innerHTML=`<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>`; scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight; }
function rmTyping(){ const t=$("typing"); if(t) t.remove(); }
function autoGrow(el){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,120)+"px"; }
function onKey(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(); } }
function ask(){ const q=$("input").value.trim(); if(!q) return; $("input").value=""; autoGrow($("input")); addUser(q); addTyping();
  setTimeout(()=>{ rmTyping(); const {best,related}=search(q,lang); if(best) addAnswer(best.card,related); else addWarn(UI[lang].notFound); $("input").focus(); },260); }

async function boot(){
  try{ const r=await fetch("./library.json",{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&Array.isArray(j.cards)&&j.cards.length) LIB=j.cards; } }
  catch(e){ /* offline / preview → use embedded */ }
  buildIndex(); setLang("en");
}
boot();
