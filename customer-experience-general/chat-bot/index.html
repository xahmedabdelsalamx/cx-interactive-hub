<style>
  :root{
    --brand:#E94858;
    --brand-deep:#C9313F;
    --brand-ink:#8E1F2A;
    --brand-soft:#FDECEE;
    --brand-glow:rgba(233,72,88,.28);

    --bg:#F7F7F9;
    --surface:#FFFFFF;
    --ink:#14161B;
    --ink-2:#3D434F;
    --muted:#727A89;
    --line:#E9EBF0;
    --line-2:#F1F3F7;

    --user-bg:#14161B;
    --warn-bg:#FFF8E8; --warn-line:#F0DFB2; --warn-ink:#6B5312;

    --r-lg:22px; --r-md:16px; --r-sm:12px;
    --shadow-sm:0 1px 2px rgba(20,22,27,.05);
    --shadow:0 2px 4px rgba(20,22,27,.04), 0 12px 28px rgba(20,22,27,.07);
    --shadow-lg:0 8px 20px rgba(20,22,27,.08), 0 28px 60px rgba(20,22,27,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1014; --surface:#15181E; --ink:#F2F4F8; --ink-2:#C7CDD9; --muted:#8B93A3;
      --line:#252A33; --line-2:#1D222A; --user-bg:#E94858; --brand-soft:#26161A;
      --warn-bg:#241F12; --warn-line:#4A3F1F; --warn-ink:#E8D89E;
      --shadow:0 2px 4px rgba(0,0,0,.3), 0 12px 28px rgba(0,0,0,.35);
      --shadow-lg:0 8px 20px rgba(0,0,0,.4), 0 28px 60px rgba(0,0,0,.5);
    }
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-feature-settings:"cv02","cv03","cv04","ss01";
  }
  body[dir="rtl"]{
    font-family:"Cairo","Noto Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",Arial,sans-serif;
    font-feature-settings:normal;
  }
  body[dir="rtl"] .bubble, body[dir="rtl"] textarea, body[dir="rtl"] .chip{ line-height:1.85; }
  body[dir="rtl"] .a-title{ line-height:1.6; }

  /* ambient brand wash */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(1100px 520px at 50% -18%, rgba(233,72,88,.10), transparent 62%),
      radial-gradient(760px 420px at 108% 4%, rgba(233,72,88,.06), transparent 60%);
  }

  .app{
    position:relative; z-index:1;
    max-width:780px; margin:0 auto; height:100dvh;
    display:flex; flex-direction:column; background:var(--surface);
  }
  @media(min-width:820px){
    .app{ height:100dvh; border-inline:1px solid var(--line); box-shadow:var(--shadow-lg); }
  }

  /* ================= HEADER ================= */
  header{
    padding:14px 20px; display:flex; align-items:center; gap:13px;
    border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--surface) 86%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    position:sticky; top:0; z-index:5;
  }
  .avatar{
    width:46px;height:46px;border-radius:14px;flex:none; position:relative;
    background:var(--brand-soft); overflow:hidden;
    box-shadow:0 0 0 1px var(--line), 0 6px 16px var(--brand-glow);
  }
  .avatar img{ width:100%;height:100%;object-fit:cover;display:block; }
  .live{
    position:absolute; inset-inline-end:-2px; bottom:-2px; width:13px;height:13px;border-radius:50%;
    background:#2DBE7E; border:2.5px solid var(--surface);
  }
  .htext{ flex:1; min-width:0; }
  .brandline{ display:flex; align-items:center; gap:8px; }
  .htext h1{
    font-size:17.5px;margin:0;font-weight:800;letter-spacing:.11em;
    background:linear-gradient(96deg, var(--brand) 0%, var(--brand-deep) 62%, var(--brand) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .pill{
    font-size:9.5px; font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    color:var(--brand-ink); background:var(--brand-soft);
    border:1px solid color-mix(in srgb, var(--brand) 22%, transparent);
    padding:3px 7px; border-radius:6px; line-height:1; flex:none;
  }
  @media (prefers-color-scheme: dark){ .pill{ color:#FF9BA5; } }
  .htext p{ font-size:12.5px;margin:3px 0 0;color:var(--muted); font-weight:450; }
  .toggle{ display:flex; background:var(--line-2); border:1px solid var(--line); border-radius:999px; padding:3px; flex:none; }
  .toggle button{
    border:0;background:transparent;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:700;
    color:var(--muted);cursor:pointer;line-height:1; transition:.18s cubic-bezier(.32,.72,0,1); font-family:inherit;
  }
  .toggle button.on{ background:var(--brand); color:#fff; box-shadow:0 2px 8px var(--brand-glow); }

  /* ================= CHAT ================= */
  .scroll{ flex:1; overflow-y:auto; padding:24px 20px 8px; display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth; }
  .row{ display:flex; gap:10px; align-items:flex-end; animation:rise .34s cubic-bezier(.22,1,.36,1) both; }
  @keyframes rise{ from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none} }
  .row.me{ justify-content:flex-end; }
  .mini{ width:28px;height:28px;border-radius:9px;flex:none;overflow:hidden;background:var(--brand-soft);
    box-shadow:0 0 0 1px var(--line); margin-bottom:2px; }
  .mini img{ width:100%;height:100%;object-fit:cover;display:block }

  .bubble{ max-width:min(560px,84%); padding:14px 16px; border-radius:var(--r-md); font-size:14.7px; line-height:1.62; }
  .row.me .bubble{
    background:var(--user-bg); color:#fff; border-end-end-radius:5px; font-weight:450;
    box-shadow:var(--shadow-sm);
  }
  .row.bot .bubble{
    background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
    border-end-start-radius:5px; box-shadow:var(--shadow);
  }
  .bubble.warn{ background:var(--warn-bg); border-color:var(--warn-line); color:var(--warn-ink); }

  .a-title{
    font-weight:750; color:var(--ink); margin-bottom:6px; font-size:15px; letter-spacing:-.012em;
    display:flex; gap:8px; align-items:flex-start;
  }
  .a-title::before{
    content:""; width:3px; align-self:stretch; min-height:17px; border-radius:2px; flex:none; margin-top:2px;
    background:linear-gradient(var(--brand), var(--brand-deep));
  }

  /* media / actions */
  .vids{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .video{ margin-top:12px; }
  .vcap{ font-size:12.5px;color:var(--muted);margin-bottom:7px;display:flex;gap:6px;align-items:center; }
  .vframe{ width:100%; aspect-ratio:16/9; border:0; border-radius:var(--r-sm); background:#000; display:block; }
  .openbtn{
    display:inline-flex;align-items:center;gap:9px;font-size:13px;font-weight:650;
    color:var(--brand-ink); text-decoration:none; border:1px solid color-mix(in srgb, var(--brand) 24%, var(--line));
    padding:10px 14px;border-radius:var(--r-sm); background:var(--brand-soft); width:fit-content; max-width:100%;
    transition:.18s cubic-bezier(.32,.72,0,1);
  }
  .openbtn span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .openbtn:hover{ background:var(--brand); color:#fff; border-color:var(--brand); transform:translateY(-1px); box-shadow:0 6px 16px var(--brand-glow); }
  .openbtn svg{ width:14px;height:14px;flex:none }
  @media (prefers-color-scheme: dark){ .openbtn{ color:#FF9BA5; } .openbtn:hover{ color:#fff; } }
  .doc{ margin-top:12px; }

  .src{ margin-top:13px; padding-top:11px; border-top:1px solid var(--line-2); font-size:11.5px; color:var(--muted); display:flex; gap:7px; align-items:center; }
  .src svg{ width:13px;height:13px;opacity:.65;flex:none }
  .related{ margin-top:13px; display:flex; flex-direction:column; gap:7px; }
  .related .lbl{ font-size:11px; color:var(--muted); font-weight:650; letter-spacing:.05em; text-transform:uppercase; }

  /* ================= INTRO ================= */
  .intro{ text-align:center; padding:26px 6px 6px; animation:rise .5s cubic-bezier(.22,1,.36,1) both; }
  .hero{
    width:92px;height:92px;border-radius:26px;margin:0 auto 16px; overflow:hidden; position:relative;
    background:var(--brand-soft); box-shadow:0 0 0 1px var(--line), 0 16px 42px var(--brand-glow);
    animation:float 5.5s ease-in-out infinite;
  }
  .hero img{ width:100%;height:100%;object-fit:cover;display:block }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .intro .big{ color:var(--ink); font-weight:750; font-size:20px; letter-spacing:-.028em; margin-bottom:7px; }
  .intro .small{ font-size:13.6px; color:var(--muted); max-width:400px; margin:0 auto; line-height:1.6; }
  .chips{ display:flex; flex-wrap:wrap; gap:9px; margin-top:20px; justify-content:center; }
  .chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    padding:10px 14px; border-radius:999px; font-size:13px; cursor:pointer; line-height:1.3; text-align:start;
    font-family:inherit; font-weight:500; transition:.18s cubic-bezier(.32,.72,0,1); box-shadow:var(--shadow-sm);
  }
  .chip:hover{ border-color:var(--brand); color:var(--brand-ink); background:var(--brand-soft); transform:translateY(-2px); box-shadow:0 8px 18px var(--brand-glow); }
  @media (prefers-color-scheme: dark){ .chip:hover{ color:#FF9BA5; } }
  .related .chip{ box-shadow:none; }

  .platform{ display:flex; align-items:center; justify-content:center; margin-top:14px; }
  .platform img{ height:34px; width:auto; display:block; opacity:.95; }
  @media (prefers-color-scheme: dark){ .platform img{ filter:brightness(1.5) saturate(1.1); } }

  /* thinking */
  .dots{ display:inline-flex; gap:5px; padding:3px 2px; }
  .dots i{ width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.35;animation:pulse 1.25s infinite ease-in-out; }
  .dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
  @keyframes pulse{ 0%,65%,100%{transform:scale(.72);opacity:.3} 32%{transform:scale(1);opacity:1} }

  /* ================= COMPOSER ================= */
  .composer{
    border-top:1px solid var(--line); padding:14px 18px calc(16px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  }
  .field{
    display:flex; align-items:flex-end; gap:9px; background:var(--line-2);
    border:1.5px solid var(--line); border-radius:18px; padding:6px 6px 6px 15px;
    transition:.2s cubic-bezier(.32,.72,0,1);
  }
  body[dir="rtl"] .field{ padding:6px 15px 6px 6px; }
  .field:focus-within{ border-color:var(--brand); background:var(--surface); box-shadow:0 0 0 4px color-mix(in srgb, var(--brand) 12%, transparent); }
  textarea{
    flex:1; border:0; background:transparent; resize:none; font:inherit; font-size:14.7px; color:var(--ink);
    padding:9px 0; max-height:130px; outline:none; line-height:1.5;
  }
  textarea::placeholder{ color:var(--muted); }
  .send{
    width:40px;height:40px;border-radius:13px;border:0;cursor:pointer;display:grid;place-items:center;flex:none;
    background:linear-gradient(140deg, var(--brand), var(--brand-deep)); color:#fff;
    box-shadow:0 4px 14px var(--brand-glow); transition:.18s cubic-bezier(.32,.72,0,1);
  }
  .send:hover{ transform:translateY(-1px) scale(1.03); box-shadow:0 8px 22px var(--brand-glow); }
  .send:active{ transform:scale(.95); }
  .send svg{ width:18px;height:18px }
  .foot{ text-align:center; font-size:11.3px; color:var(--muted); margin-top:11px; line-height:1.55; }
  .foot a{ color:var(--brand); text-decoration:none; font-weight:650; border-bottom:1px solid color-mix(in srgb, var(--brand) 35%, transparent); padding-bottom:1px; }
  .foot a:hover{ border-bottom-color:var(--brand); }

  ::-webkit-scrollbar{ width:9px } ::-webkit-scrollbar-track{ background:transparent }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:9px; border:2.5px solid var(--surface) }
  ::-webkit-scrollbar-thumb:hover{ background:var(--muted) }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; scroll-behavior:auto } }
</style>
</head>

const EMBEDDED = {"meta": {"title": "CX Assistant Library — Art of Selling (Retail)", "note": "This is the only file you edit to add content. Each item in 'cards' is one topic. Copy a card, change the text, and you've added knowledge. 'videos' and 'link' are optional — delete them if a card has none.", "videoTypes": "link (opens the video page — use for ConnectNow/SharePoint links that need sign-in) | youtube (use the video id) | stream (embed URL) | mp4 (direct file URL)"}, "cards": [{"id": "definition", "keywords_en": "conversion rate convert percentage formula calculate what is meaning definition visitors buyers footfall", "keywords_ar": "معدل التحويل نسبة معادلة حساب تعريف يعني ما هو زوار مشترين عميل عملاء", "en": {"title": "What is a conversion rate?", "body": "Conversion rate is the percentage of store visitors who make a purchase. Formula: Number of Sales ÷ Number of Visitors × 100. Example: if 100 people enter and 20 buy, your conversion rate is 20% — 1 in every 5 visitors buys something."}, "ar": {"title": "ما هو معدل التحويل؟", "body": "معدل التحويل هو نسبة الزوّار الذين يقومون بالشراء من إجمالي من دخل المتجر. المعادلة: عدد المبيعات ÷ عدد الزوّار × ١٠٠. مثال: إذا دخل ١٠٠ شخص واشترى ٢٠، فمعدل التحويل ٢٠٪ — أي واحد من كل ٥ زوّار يشتري."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/275387/boosting-sales-through-conversion", "title": {"en": "Boosting Sales Through Conversion", "ar": "رفع المبيعات عبر التحويل"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/286720/conversion", "title": {"en": "Conversion", "ar": "التحويل"}}], "link": "https://connectnow.alshaya.com/sites/customer-experience-hub/SitePageModern/230871/the-art-of-driving-conversion?channelId=230797"}, {"id": "why", "keywords_en": "why important matters reason revenue satisfaction demand stock", "keywords_ar": "لماذا مهم أهمية سبب إيراد رضا طلب مخزون عميل عملاء", "en": {"title": "Why does conversion rate matter?", "body": "A higher conversion rate means more sales from the same footfall — you don't need more visitors, just more buyers. It also reflects customer satisfaction: if people leave without buying, something needs fixing. And it helps forecast demand and manage stock."}, "ar": {"title": "لماذا معدل التحويل مهم؟", "body": "ارتفاع معدل التحويل يعني مبيعات أكثر من نفس عدد الزوّار — لست بحاجة لزوّار أكثر بل لمشترين أكثر. كما يعكس رضا الزبائن: إذا غادروا دون شراء فهناك ما يجب تحسينه. ويساعد في توقّع الطلب وإدارة المخزون."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "sales-math", "keywords_en": "sales atv average transaction footfall one percent 1% increase impact revenue calculate math formula kd more sales", "keywords_ar": "مبيعات متوسط الفاتورة زيادة تأثير حساب معادلة دينار واحد بالمئة مبيعات أكثر عميل عملاء", "en": {"title": "How conversion impacts sales", "body": "Sales = Footfall × Conversion × ATV (average transaction value). Example: 10,000 × 25% × 14 KD = 35,000 KD. If you raise conversion by just 1% (to 26%), sales become 36,400 KD — about a 4% increase in sales from a single 1% gain."}, "ar": {"title": "كيف يؤثّر التحويل على المبيعات", "body": "المبيعات = عدد الزوّار × معدل التحويل × متوسط قيمة الفاتورة. مثال: ١٠٬٠٠٠ × ٢٥٪ × ١٤ د.ك = ٣٥٬٠٠٠ د.ك. وإذا رفعت التحويل ١٪ فقط (إلى ٢٦٪) تصبح المبيعات ٣٦٬٤٠٠ د.ك — أي زيادة نحو ٤٪."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "personalized", "keywords_en": "personalized personal needs name tailor recommend recommendation skincare individual", "keywords_ar": "شخصية احتياج اسم توصية تخصيص اهتمام عميل عملاء", "en": {"title": "Personalized service", "body": "Understand each customer's needs. Greet warmly, ask open-ended questions, use their name if known, and tailor recommendations to what they're interested in. Customers buy more when they feel understood and valued."}, "ar": {"title": "الخدمة الشخصية", "body": "افهم احتياج كل زبون. رحّب به بحرارة، واطرح أسئلة مفتوحة، واستخدم اسمه إن عرفته، وقدّم توصيات تناسب اهتمامه. الزبون يشتري أكثر حين يشعر بأنه مفهوم وذو قيمة."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "product-knowledge", "keywords_en": "product knowledge expert features benefits compare comparison know products trust advice", "keywords_ar": "معرفة المنتج خبير مزايا فوائد مقارنة ثقة نصيحة عميل عملاء", "en": {"title": "Product knowledge", "body": "Be the expert. Know product features, benefits and uses, offer comparisons to help customers decide, and share tips or extra uses they may not know. Confidence in your knowledge builds trust — and trust leads to more sales."}, "ar": {"title": "المعرفة بالمنتج", "body": "كن الخبير. اعرف مزايا المنتجات وفوائدها واستخداماتها، وقدّم مقارنات تساعد الزبون على القرار، وشارك نصائح قد لا يعرفها. ثقتك بمعرفتك تبني ثقة الزبون — والثقة تقود إلى مبيعات أكثر."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "upsell", "keywords_en": "upsell upselling cross sell crosssell add more higher premium complement bundle suggest push without pushy extra item", "keywords_ar": "بيع أعلى بيع متقاطع منتج أعلى إضافة يكمل اقتراح دون إلحاح ضغط عميل عملاء", "en": {"title": "Upselling & cross-selling", "body": "Upselling means suggesting a higher-end product and highlighting its added value. Cross-selling means suggesting items that go together (e.g. a t-shirt with new jeans). Keep it subtle and frame it as a benefit to the customer, not a sales push."}, "ar": {"title": "البيع الأعلى والبيع المتقاطع", "body": "البيع الأعلى هو اقتراح منتج أرقى مع إبراز قيمته المضافة. البيع المتقاطع هو اقتراح منتجات متكاملة (مثل قميص مع بنطال جينز). اجعله لطيفاً وقدّمه كفائدة للزبون لا كضغط للبيع."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "urgency", "keywords_en": "urgency limited stock offer deal fomo hurry scarcity ends today promotion now quick", "keywords_ar": "إلحاح عرض محدود مخزون ينتهي ترويج الآن سرعة فرصة عميل عملاء", "en": {"title": "Creating urgency", "body": "Highlight limited-time offers or low stock to encourage action now. Use phrases like \"only a few left\" or \"offer ends today.\" Fear of missing out is a strong motivator. Example: \"This promotion is only available this weekend — don't miss out!\""}, "ar": {"title": "خلق شعور بالإلحاح", "body": "أبرز العروض محدودة الوقت أو قلّة المخزون لتشجيع الزبون على التصرّف الآن. استخدم عبارات مثل «بقيت قطع قليلة» أو «العرض ينتهي اليوم». الخوف من تفويت الفرصة محفّز قوي. مثال: «هذا العرض متاح هذا الأسبوع فقط — لا تفوّته!»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "followup", "keywords_en": "follow up followup check back engage out of stock return relationship loyalty come back", "keywords_ar": "متابعة تواصل غير متوفر علاقة ولاء عودة عميل عملاء", "en": {"title": "Follow-up", "body": "Stay engaged through the whole shopping journey. After helping a customer, check back to see if they need anything else. Offer to follow up on out-of-stock items. Consistent engagement builds relationships and brings customers back."}, "ar": {"title": "المتابعة", "body": "ابقَ متواصلاً طوال رحلة التسوّق. بعد مساعدة الزبون، عُد إليه لتتأكد إن كان يحتاج شيئاً آخر. اعرض المتابعة بشأن المنتجات غير المتوفرة. التواصل المستمر يبني العلاقات ويعيد الزبائن."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "greeting", "keywords_en": "greet greeting hello welcome smile eye contact approach start how to greet", "keywords_ar": "ترحيب تحية أهلا ابتسامة تواصل بصري استقبال كيف أرحب عميل عملاء", "en": {"title": "Warm greeting", "body": "Smile genuinely, make eye contact, and use a warm, personal greeting — not a robotic one. Example: for an unsure customer, \"Hi! Let me know if there's anything specific you're looking for today.\""}, "ar": {"title": "الترحيب الحار", "body": "ابتسم بصدق، وحافظ على التواصل البصري، واستخدم ترحيباً حاراً وشخصياً لا آلياً. مثال: لزبون متردد، «أهلاً! أخبرني إن كنت تبحث عن شيء محدد اليوم.»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "listening", "keywords_en": "listen listening active understand paraphrase interrupt body language attention", "keywords_ar": "إصغاء استماع فهم مقاطعة لغة الجسد انتباه عميل عملاء", "en": {"title": "Active listening", "body": "Focus fully on the customer, use body language like nodding, and paraphrase their needs to confirm — \"So you're looking for a gift for someone who loves skincare?\" Avoid interrupting or jumping to solutions too early."}, "ar": {"title": "الإصغاء الفعّال", "body": "ركّز كلياً على الزبون، واستخدم لغة الجسد مثل الإيماء، وأعد صياغة احتياجه للتأكد — «إذاً أنت تبحث عن هدية لمن يحب العناية بالبشرة؟» تجنّب المقاطعة أو التسرّع في تقديم الحلول."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "open-questions", "keywords_en": "open ended questions ask questions conversation yes no what how engage talk", "keywords_ar": "أسئلة مفتوحة سؤال حوار نعم لا محادثة تفاعل عميل عملاء", "en": {"title": "Open-ended questions", "body": "Open-ended questions gather more detail than yes/no ones. Instead of \"Are you looking for a specific item?\" ask \"What brings you in today? Are you shopping for yourself or someone else?\" This makes the interaction feel like a conversation, not a transaction."}, "ar": {"title": "الأسئلة المفتوحة", "body": "الأسئلة المفتوحة تجمع تفاصيل أكثر من أسئلة نعم/لا. بدل «هل تبحث عن منتج معيّن؟» اسأل «ما الذي أتى بك اليوم؟ هل تتسوّق لنفسك أم لشخص آخر؟» هذا يجعل التعامل حواراً لا مجرد معاملة."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "closing", "keywords_en": "close closing seal deal hesitant unsure not sure doubt reassure register checkout guide buy convince undecided", "keywords_ar": "إتمام إغلاق متردد غير متأكد طمأنة إقناع صندوق توجيه شراء حائر عميل عملاء", "en": {"title": "Closing the sale", "body": "Closing should feel natural and supportive, not pushy. Use assumptive phrases like \"Would you like to take this to the register?\" Highlight benefits, and reassure hesitant customers: \"You can always exchange it if it's not the perfect fit.\""}, "ar": {"title": "إتمام البيع", "body": "إتمام البيع يجب أن يكون طبيعياً وداعماً لا ملحّاً. استخدم عبارات افتراضية مثل «هل تودّ أخذه إلى الصندوق؟» أبرز الفوائد، وطمئن الزبون المتردد: «يمكنك دائماً استبداله إن لم يكن مناسباً.»"}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "journey", "keywords_en": "journey stages entry browsing decision checkout touchpoints steps where impact stage", "keywords_ar": "رحلة مراحل دخول تصفح قرار دفع خطوات أين مرحلة عميل عملاء", "en": {"title": "Where you impact conversion", "body": "You can influence conversion at four stages: Entry & Greeting, Product Browsing, Decision Making, and Checkout. Improve engagement at each stage — a good greeting at entry, helpful guidance while browsing, reassurance at decision time, and a smooth checkout."}, "ar": {"title": "أين تؤثّر على التحويل", "body": "يمكنك التأثير على التحويل في أربع مراحل: الدخول والترحيب، تصفّح المنتجات، اتخاذ القرار، والدفع. حسّن التفاعل في كل مرحلة — ترحيب عند الدخول، إرشاد أثناء التصفّح، طمأنة عند القرار، ودفع سلس."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "measurement", "keywords_en": "measure measured cctv camera count footfall pos heat map track tool sensor how measured tracking", "keywords_ar": "قياس كاميرا عد زوار نقاط البيع خريطة حرارية أداة تتبع كيف يقاس عميل عملاء", "en": {"title": "How conversion is measured", "body": "Stores use cameras and tools to measure conversion. Entrance cameras count footfall and filter out staff/non-target entries; floor cameras track engagement and wait times with heat mapping; POS cameras link transactions to actual customers. This data is combined with POS for an accurate rate."}, "ar": {"title": "كيف يُقاس التحويل", "body": "تستخدم المتاجر الكاميرات والأدوات لقياس التحويل. كاميرات المدخل تحسب الزوّار وتستبعد الموظفين؛ كاميرات الصالة تتابع التفاعل وأوقات الانتظار عبر الخرائط الحرارية؛ كاميرات الصندوق تربط المعاملات بالزبائن الفعليين."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "context", "keywords_en": "numbers q4 lfl stats statistics benchmark current walk away left without buying 80 71 26 data opportunity", "keywords_ar": "أرقام إحصاء معيار غادروا دون شراء بيانات فرصة الوضع الحالي عميل عملاء", "en": {"title": "Why this matters right now", "body": "The numbers show the opportunity: in Q4, 80% of potential customers left without buying, only 15% engaged with more than one brand, and like-for-like transactions were down 26%. With conversion around 71%, nearly 1 in 3 customers still walks away without purchasing."}, "ar": {"title": "لماذا هذا مهم الآن", "body": "الأرقام تُظهر الفرصة: في الربع الأخير غادر ٨٠٪ من الزبائن المحتملين دون شراء، وتفاعل ١٥٪ فقط مع أكثر من علامة، وانخفضت المعاملات المماثلة ٢٦٪. ومع معدل تحويل نحو ٧١٪، لا يزال قرابة زبون من كل ٣ يغادر دون شراء."}, "source": {"en": "Art of Driving Conversion", "ar": "فن رفع معدل التحويل"}}, {"id": "fi-why", "keywords_en": "first impression matter 7 seconds seven trust loyalty why important welcome new customer", "keywords_ar": "الانطباع الأول سبع ثوان ثقة ولاء لماذا مهم ترحيب زبون جديد عميل عملاء", "en": {"title": "Why first impressions matter", "body": "First impressions form in about 7 seconds — and 55% comes from body language, 38% from tone, only 7% from words. A warm first impression builds trust instantly, makes customers more likely to buy, encourages loyalty and repeat visits, sets you apart from competitors, and shapes what they tell others. You get one chance — make it count."}, "ar": {"title": "لماذا الانطباع الأول مهم", "body": "يتكوّن الانطباع الأول خلال نحو ٧ ثوانٍ — و٥٥٪ منه من لغة الجسد، و٣٨٪ من نبرة الصوت، و٧٪ فقط من الكلمات. الانطباع الدافئ يبني الثقة فوراً، ويزيد احتمال الشراء، ويشجّع الولاء وتكرار الزيارة، ويميّزك عن المنافسين، ويؤثّر على ما يقوله الزبون للآخرين. لديك فرصة واحدة — استثمرها."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/233495/great-first-impression-art-of-selling-h-m", "title": {"en": "Great First Impression — Art of Selling (H&M)", "ar": "انطباع أول رائع — فن البيع (إتش آند إم)"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/286721/first-impression", "title": {"en": "First Impression", "ar": "الانطباع الأول"}}], "link": "https://connectnow.alshaya.com/sites/customer-experience-hub/SitePageModern/233474/the-power-of-first-impression?channelId=230797"}, {"id": "fi-nonverbal", "keywords_en": "body language non verbal nonverbal posture eye contact smile tone signals 55 38 7 how you say", "keywords_ar": "لغة الجسد غير لفظي وضعية تواصل بصري ابتسامة نبرة إشارات كيف تقول عميل عملاء", "en": {"title": "Body language & non-verbal cues", "body": "Most of a first impression is non-verbal — 55% body language and 38% tone versus just 7% words. Smile genuinely, make eye contact, and keep an open, inviting posture. Read the customer's signals and adjust your approach. It's not just what you say, but how you say it."}, "ar": {"title": "لغة الجسد والإشارات غير اللفظية", "body": "معظم الانطباع الأول غير لفظي — ٥٥٪ لغة جسد و٣٨٪ نبرة صوت مقابل ٧٪ فقط للكلمات. ابتسم بصدق، وتواصل بالعين، وحافظ على وضعية منفتحة ومرحّبة. اقرأ إشارات الزبون وعدّل أسلوبك. المهم ليس ما تقوله فقط، بل كيف تقوله."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}}, {"id": "fi-loyal", "keywords_en": "loyal returning guest repeat customer recognize acknowledge loyalty aura perks regular remember", "keywords_ar": "زبون عائد مخلص متكرر ولاء أورا مزايا تعرف تذكر منتظم عميل عملاء", "en": {"title": "Recognizing loyal & returning guests", "body": "Spot and acknowledge returning customers, and personalize the interaction based on their past visits and preferences. Use loyalty programmes and exclusive perks (like AURA) to make them feel recognised and strengthen the relationship. A returning guest who feels remembered comes back more often."}, "ar": {"title": "التعرّف على الزبائن العائدين", "body": "تعرّف على الزبائن العائدين ورحّب بهم، وخصّص التعامل بناءً على زياراتهم السابقة وتفضيلاتهم. استخدم برامج الولاء والمزايا الحصرية (مثل AURA) ليشعروا بأنهم معروفون، ولتقوية العلاقة. الزبون العائد الذي يشعر بأنه متذكَّر يعود أكثر."}, "source": {"en": "Art of First Impression", "ar": "فن الانطباع الأول"}}, {"id": "disc-why", "keywords_en": "discovery matter understand needs 82 percent uncover why trust emotions people not product", "keywords_ar": "اكتشاف فهم احتياج ثمانين ثقة عاطفة لماذا الإنسان لا المنتج عميل عملاء", "en": {"title": "Why discovery matters", "body": "Discovery means uncovering what the customer really needs before recommending. 82% of shoppers are more likely to buy from someone who understands their needs. It shifts the focus from product to people and builds trust, not just transactions — and since emotions drive most buying decisions, understanding them leads to loyalty and stronger sales."}, "ar": {"title": "لماذا الاكتشاف مهم", "body": "الاكتشاف يعني فهم ما يحتاجه الزبون فعلاً قبل تقديم التوصية. ٨٢٪ من المتسوّقين أكثر ميلاً للشراء ممن يفهم احتياجهم. وهو ينقل التركيز من المنتج إلى الإنسان ويبني الثقة لا مجرد معاملة — ولأن العاطفة تقود معظم قرارات الشراء، فإن فهمها يقود إلى الولاء ومبيعات أقوى."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/267659/art-of-discovery", "title": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/208860/let-s-hear-from-marina-bath-body-works-vendome-mall-qatar", "title": {"en": "Let's Hear from Marina — Bath & Body Works, Qatar", "ar": "من مارينا — باث آند بودي ووركس، قطر"}}], "link": "https://connectnow.alshaya.com/sites/customer-experience-hub/SitePageModern/249416/m3-art-of-discovery?channelId=230797"}, {"id": "disc-listening", "keywords_en": "active listening discovery listen understand empathy unsaid just looking feel heard tune in", "keywords_ar": "إصغاء فعال اكتشاف استماع فهم تعاطف أتفرج مشاعر مسموع عميل عملاء", "en": {"title": "Active listening (the heart of discovery)", "body": "Active listening is tuning in to what's said and unsaid — not waiting for your turn to talk. Listen to understand, ask with purpose and listen with empathy, and use the customer's own words and emotions in your recommendation. When someone says \"I'm just looking,\" stay with them. People buy confidence, comfort and pride — and they remember how you made them feel."}, "ar": {"title": "الإصغاء الفعّال (قلب الاكتشاف)", "body": "الإصغاء الفعّال هو الانتباه لما يُقال وما لا يُقال — لا انتظار دورك في الكلام. أصغِ لتفهم، واسأل بهدف وأصغِ بتعاطف، واستخدم كلمات الزبون ومشاعره في توصيتك. حين يقول «أنا فقط أتفرّج»، ابقَ معه. الناس يشترون الثقة والراحة والفخر — ويتذكّرون كيف جعلتهم يشعرون."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-questions", "keywords_en": "open ended questions closed doors what brings you in occasion mood ask discovery great questions floor", "keywords_ar": "أسئلة مفتوحة مغلقة مناسبة مزاج ما أتى بك سؤال اكتشاف عميل عملاء", "en": {"title": "Questions that open doors", "body": "Open-ended questions invite stories and reveal needs and emotions; closed yes/no questions shut conversation down. Use openers like \"What brings you in today?\", \"What's the occasion or mood you're shopping for?\", and \"How do you want this to feel?\" Avoid \"Do you need help?\" and \"Are you just browsing?\" Open questions spark connection."}, "ar": {"title": "أسئلة تفتح الأبواب", "body": "الأسئلة المفتوحة تدعو للقصص وتكشف الاحتياجات والمشاعر؛ أما أسئلة نعم/لا المغلقة فتُنهي الحوار. استخدم عبارات مثل «ما الذي أتى بك اليوم؟» و«ما المناسبة أو المزاج الذي تتسوّق له؟» و«كيف تريد أن تشعر بهذا؟» وتجنّب «هل تحتاج مساعدة؟» و«هل تتفرّج فقط؟» الأسئلة المفتوحة تصنع تواصلاً."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-personalization", "keywords_en": "personalization personalize mirror tone tailor lifestyle emotional cues browsing treat make them feel", "keywords_ar": "تخصيص نبرة نمط حياة إشارات عاطفية أتفرج تدلل شعور عميل عملاء", "en": {"title": "Power of personalization", "body": "Personalization turns a casual visit into a memorable experience. Four ways: mirror their tone and pace; stay curious even at \"just browsing\" (\"Anything you're treating yourself to today?\"); tailor recommendations to their world — lifestyle, mood, occasion; and use emotional cues in your language (\"This feels like something you'd love for unwinding after a long day\"). Reflect who they are, don't push what you like."}, "ar": {"title": "قوة التخصيص", "body": "التخصيص يحوّل زيارة عابرة إلى تجربة تُذكر. أربع طرق: جارِ نبرتهم وإيقاعهم؛ ابقَ فضولياً حتى عند «أتفرّج فقط» («هل من شيء تدلّل به نفسك اليوم؟»)؛ خصّص التوصية لعالمهم — نمط الحياة والمزاج والمناسبة؛ واستخدم إشارات عاطفية («يبدو أنك ستحب هذا للاسترخاء بعد يوم طويل»). اعكس شخصيتهم لا تفرض ما يعجبك."}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "disc-resistance", "keywords_en": "resistance just looking hesitant rejection space rephrase not pushy handle objection browsing wall cold", "keywords_ar": "مقاومة أتفرج تردد رفض مساحة إعادة صياغة ملح اعتراض جدار عميل عملاء", "en": {"title": "Handling resistance (\"I'm just looking\")", "body": "When a customer says \"I'm just looking\" or gives short answers, it's not rejection — it's hesitation. Don't break the wall, walk gently around it: rephrase your question more softly, give them space, or share a warm line like \"This one's been a favourite for people looking to unwind after work.\" Stay present, not pushy. Example: \"Of course — take your time! Anything you're in the mood for today?\""}, "ar": {"title": "التعامل مع التردّد («أنا فقط أتفرّج»)", "body": "حين يقول الزبون «أنا فقط أتفرّج» أو يعطي إجابات قصيرة، فهذا ليس رفضاً بل تردّد. لا تكسر الجدار بل مُرّ حوله بلطف: أعد صياغة سؤالك بنعومة، أو امنحه مساحة، أو شارك عبارة دافئة مثل «هذا من المفضّل لمن يريد الاسترخاء بعد العمل». ابقَ حاضراً لا ملحّاً. مثال: «بالطبع — خذ وقتك! هل من شيء يناسب مزاجك اليوم؟»"}, "source": {"en": "Art of Discovery", "ar": "فن الاكتشاف"}}, {"id": "story-what", "keywords_en": "product storytelling story what is features feeling picture life sell think about it take it", "keywords_ar": "سرد قصة المنتج ما هو مزايا شعور تخيل حياة بيع عميل عملاء", "en": {"title": "What is product storytelling?", "body": "Product storytelling means presenting a product through a short story and a moment, not a list of features. You bring it to life so the customer pictures it in their day. Customers don't fall in love with features — they fall in love with what life feels like with the product. A good story turns \"I'll think about it\" into \"I'll take it.\""}, "ar": {"title": "ما هو سرد قصة المنتج؟", "body": "سرد قصة المنتج يعني تقديم المنتج عبر قصة قصيرة ولحظة، لا قائمة مزايا. تجعله حيّاً ليتخيّله الزبون في يومه. الزبائن لا يعشقون المزايا — بل يعشقون شعور الحياة مع المنتج. القصة الجيدة تحوّل «سأفكّر بالأمر» إلى «سآخذه»."}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}, "videos": [{"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/273549/art-of-product-storytelling-maclex-d-costa-h-m", "title": {"en": "Art of Product Storytelling — Maclex D'Costa (H&M)", "ar": "فن سرد قصة المنتج — ماكليكس دي كوستا (إتش آند إم)"}}, {"type": "link", "url": "https://connectnow.alshaya.com/sites/customer-experience-hub/videos/276578/art-of-product-storytelling", "title": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}], "link": "https://connectnow.alshaya.com/sites/customer-experience-hub/SitePageModern/267831/m4-art-of-product-storytelling?channelId=230797"}, {"id": "story-why", "keywords_en": "why stories sell attention feeling picture conversion basket loyalty scene maybe later take it", "keywords_ar": "لماذا القصص تبيع انتباه مشاعر تخيل تحويل سلة ولاء مشهد عميل عملاء", "en": {"title": "Why stories sell", "body": "A quick scene grabs attention better than a spec (\"Picture stepping out after work in this top that breathes the heat away\"). Stories create feelings, and feelings drive choices; they help customers picture the product in their life, and they move people from \"maybe later\" to \"I'll take it.\" Stories lift conversion, basket size, and loyalty."}, "ar": {"title": "لماذا القصص تبيع", "body": "المشهد السريع يجذب الانتباه أكثر من المواصفة («تخيّل خروجك بعد العمل بهذا القميص الذي يطرد الحر»). القصص تصنع مشاعر، والمشاعر تقود القرارات؛ وتساعد الزبون على تخيّل المنتج في حياته، وتنقله من «ربما لاحقاً» إلى «سآخذه». القصص ترفع التحويل وحجم السلة والولاء."}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}, {"id": "story-formula", "keywords_en": "story formula moment sensory feel words personal tie close scene example how to tell", "keywords_ar": "صيغة قصة لحظة حسي كلمات رابط شخصي مشهد مثال كيف عميل عملاء", "en": {"title": "The storytelling formula", "body": "Use a simple four-part formula: Moment + simple sensory \"feel-it\" words + a personal tie-in + close with a scene they can live today. Example — instead of \"linen dress, breathable fabric,\" say: \"This linen dress is your easy win for warm days — light on the skin, easy to move in, perfect for chilly AC moments. You'll wear it from lunch to late coffee and still feel fresh.\""}, "ar": {"title": "صيغة سرد القصة", "body": "استخدم صيغة بسيطة من أربعة أجزاء: لحظة + كلمات حسّية «تُشعرك» بسيطة + رابط شخصي + الختام بمشهد يعيشونه اليوم. مثال — بدل «فستان كتّان، قماش يتنفّس» قل: «هذا الفستان الكتّاني خيارك السهل للأيام الحارة — خفيف على البشرة، مريح في الحركة، مثالي لأجواء التكييف الباردة. سترتدينه من الغداء إلى قهوة المساء وتبقين منتعشة.»"}, "source": {"en": "Art of Product Storytelling", "ar": "فن سرد قصة المنتج"}}, {"id": "rec-why", "keywords_en": "elevated recommendation add on why important atv ipt expertise trust upsell complete experience", "keywords_ar": "توصية إضافة لماذا متوسط الفاتورة قطع خبرة ثقة تجربة عميل عملاء", "en": {"title": "Why elevated recommendations matter", "body": "A good recommendation shows you understand the customer and turns a single purchase into a complete experience. Smart add-ons build trust, not pressure — you're showing care and expertise, not pushing. Done consistently, it lifts service quality and store results: better experiences, higher ATV and stronger IPT, because customers trust you more."}, "ar": {"title": "لماذا التوصية المتقنة مهمة", "body": "التوصية الجيدة تُظهر أنك فهمت الزبون، وتحوّل عملية شراء واحدة إلى تجربة متكاملة. الإضافات الذكية تبني الثقة لا الضغط — فأنت تُظهر الاهتمام والخبرة لا الإلحاح. وحين تلتزم بها ترتفع جودة الخدمة ونتائج المتجر: تجربة أفضل، ومتوسط فاتورة أعلى، وعدد قطع أكبر، لأن الزبون يثق بك أكثر."}, "source": {"en": "Art of Elevated Recommendation", "ar": "فن التوصية المتقنة"}}, {"id": "rec-method", "keywords_en": "spot link suggest confirm method steps recommend add on how technique complete pair matching", "keywords_ar": "لاحظ اربط اقترح أكد طريقة خطوات توصية كيف يكمل مطابق عميل عملاء", "en": {"title": "Spot, Link, Suggest, Confirm", "body": "Recommend naturally with four small steps. Spot: see what they're buying and find a clue (holding perfume? maybe matching lotion). Link: connect it to something they said or liked (\"You said she likes floral scents — this matches perfectly\"). Suggest: offer one product that completes it (\"Most people pair this candle with the matching diffuser so the scent lasts longer\"). Confirm: ask kindly (\"Would you like to add that too?\")."}, "ar": {"title": "لاحِظ، اربط، اقترح، أكّد", "body": "أوصِ بطريقة طبيعية عبر أربع خطوات صغيرة. لاحِظ: انظر ما يشتريه وابحث عن إشارة (يحمل عطراً؟ ربما لوشن بنفس العطر). اربط: صِله بشيء قاله أو أحبّه («قلت إنها تحب العطور الزهرية — هذا يناسبها تماماً»). اقترح: قدّم منتجاً واحداً يُكمّله («معظم الناس يقرنون هذه الشمعة بالموزّع المطابق ليدوم العطر»). أكّد: اسأل بلطف («هل تودّ إضافته أيضاً؟»)."}, "source": {"en": "Art of Elevated Recommendation", "ar": "فن التوصية المتقنة"}}, {"id": "rec-natural", "keywords_en": "natural effortless conversational not pushy pitch friend link empower awkward sound sales talk", "keywords_ar": "طبيعي عفوي حوار ملح خطبة صديق ربط قرار محرج عميل عملاء", "en": {"title": "Making it sound effortless", "body": "The best recommendations come from a real conversation, not a pitch. Speak like a person, keep it short and clear, and share tips as if helping a friend. Always link the suggestion back to what they already chose so it stays relevant, and let the choice feel like theirs. Say \"A lot of people who love what you picked also enjoy this one\" — not \"This is the best, you should get it.\""}, "ar": {"title": "اجعلها تبدو عفوية", "body": "أفضل التوصيات تأتي من حوار حقيقي لا من خطبة بيع. تكلّم كإنسان، وأبقِ الكلام قصيراً واضحاً، وشارك النصيحة كأنك تساعد صديقاً. اربط الاقتراح دائماً بما اختاره ليبقى ملائماً، واجعل القرار يبدو قراره هو. قل «كثير ممن أحبّوا ما اخترته يحبّون هذا أيضاً» — لا «هذا الأفضل، عليك أخذه»."}, "source": {"en": "Art of Elevated Recommendation", "ar": "فن التوصية المتقنة"}}, {"id": "cr-intro", "keywords_en": "conflict resolution complaint upset angry customer difficult situation overview why loyal", "keywords_ar": "حل خلاف نزاع شكوى زبون غاضب منزعج موقف صعب لماذا وفي عميل عملاء", "en": {"title": "Handling conflict & complaints", "body": "Every difficult situation is a chance to create a loyal customer. Customers rarely remember a perfect transaction, but they always remember how they were treated when something went wrong. Conflict resolution isn't about winning an argument — it's about understanding, resolving, and leaving the customer feeling respected."}, "ar": {"title": "التعامل مع الخلافات والشكاوى", "body": "كل موقف صعب فرصة لكسب زبون وفيّ. نادراً ما يتذكّر الزبائن معاملة مثالية، لكنهم دائماً يتذكّرون كيف عوملوا حين حدث خطأ. حل الخلاف ليس ربح الجدال — بل الفهم والحل وترك الزبون يشعر بالاحترام."}, "source": {"en": "Conflict Resolution", "ar": "حل الخلافات والتعامل مع الشكاوى"}}, {"id": "cr-understand", "keywords_en": "understand listen first heard acknowledge feelings interrupt receipt exchange calm before solve", "keywords_ar": "فهم إصغاء مسموع اعتراف شعور مقاطعة فاتورة استبدال قبل الحل هدوء عميل عملاء", "en": {"title": "Understand before you solve", "body": "Customers want to feel heard before they get answers. Before explaining policy or offering solutions: listen without interrupting, keep positive body language, let them finish, and acknowledge how they feel. People calm down when they believe someone genuinely understands them. Example: if a customer is upset they can't exchange without a receipt, listen and acknowledge the frustration first, then discuss options."}, "ar": {"title": "افهم قبل أن تحُل", "body": "يريد الزبون أن يشعر بأنه مسموع قبل أن يحصل على إجابات. قبل شرح السياسة أو تقديم الحلول: أصغِ دون مقاطعة، وحافظ على لغة جسد إيجابية، ودعه يُكمل، واعترف بشعوره. يهدأ الناس حين يشعرون أن أحداً يفهمهم حقاً. مثال: إذا انزعج زبون لعدم إمكان الاستبدال دون فاتورة، أصغِ واعترف بإحباطه أولاً ثم ناقش الخيارات."}, "source": {"en": "Conflict Resolution", "ar": "حل الخلافات والتعامل مع الشكاوى"}}, {"id": "cr-calm", "keywords_en": "stay calm pressure angry raised voice tone defensive argue blame frustrated shouting control emotions", "keywords_ar": "هدوء ضغط غاضب صوت مرتفع نبرة دفاعي جدال لوم محبط صراخ عميل عملاء", "en": {"title": "Stay calm under pressure", "body": "A customer's emotions should never con /* ==================== SEARCH ENGINE (no AI key needed) ==================== */
const STOP = new Set(("the a an is are do i to my of for and or in on at with how what why when who can you your it this that me we our us if not no yes some any as be قد "+
  "في من ما هو هي كيف لماذا متى هل على عن مع او و أو ال إلى عند اذا إذا هذا هذه ان أن كي لكي").split(/\s+/));
function normalize(s){ return (s||"").toLowerCase()
  .replace(/[\u064B-\u0652\u0670]/g,"").replace(/\u0640/g,"")
  .replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/[ى]/g,"ي").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
  .replace(/[^a-z0-9\u0600-\u06FF]+/g," ").replace(/\s+/g," ").trim(); }
function stem(t){ if(/^[a-z0-9]+$/.test(t)) return t.replace(/(ings?|edly|ed|ly|es|s)$/,"");
  let x=t.replace(/^(وال|فال|بال|كال|ال|و|ف|ب|ك|ل)/,"").replace(/(ات|ون|ين|ها|هم|ة|ه|ي)$/,""); return x.length>=2?x:t; }
function tokens(s){ return normalize(s).split(" ").filter(w=>w.length>=2 && !STOP.has(w)).map(stem); }
function hs(str){ return new Set(tokens(str)); }

let LIB = EMBEDDED.cards, INDEX = [];
function buildIndex(){ INDEX = LIB.map(c=>({ card:c,
  en:{ title:hs(c.en.title), kw:hs(c.keywords_en||""), body:hs(c.en.title+" "+c.en.body+" "+(c.keywords_en||"")) },
  ar:{ title:hs(c.ar.title), kw:hs(c.keywords_ar||""), body:hs(c.ar.title+" "+c.ar.body+" "+(c.keywords_ar||"")) } })); }

function search(query,l){
  const q=tokens(query); if(!q.length) return {best:null,related:[]};
  const scored=INDEX.map(ix=>{ const f=ix[l]; let s=0;
    q.forEach(tok=>{ if(f.title.has(tok)) s+=3; else if(f.kw.has(tok)) s+=3; else if(f.body.has(tok)) s+=1;
      else { for(const h of f.body){ if(h.length>=4 && (h.includes(tok)||tok.includes(h))){ s+=1; break; } } } });
    return {card:ix.card,score:s}; }).sort((a,b)=>b.score-a.score);
  const best=scored[0].score>=2?scored[0]:null;
  const related=scored.filter(x=>x!==scored[0] && x.score>=2).slice(0,2).map(x=>x.card);
  return {best,related};
}

let lang="en"; const $=id=>document.getElementById(id), scroll=$("scroll");

function setLang(l){
  lang=l; document.body.setAttribute("dir",l==="ar"?"rtl":"ltr");
  document.documentElement.lang=l;
  $("btnEn").classList.toggle("on",l==="en"); $("btnAr").classList.toggle("on",l==="ar");
  const u=UI[l];
  $("title").textContent=u.title; $("pill").textContent=u.pill; $("subtitle").textContent=u.subtitle;
  $("input").placeholder=u.ph; $("foot").innerHTML=u.foot;
  $("hublogo").src=CXHUB;
  renderIntro();
}
function renderIntro(){
  scroll.innerHTML=""; const u=UI[lang];
  const w=document.createElement("div"); w.className="intro";
  w.innerHTML=`<div class="hero"><img src="${AVATAR}" alt="ATLAS"></div>
    <div class="big">${u.introBig}</div><div class="small">${u.introSmall}</div>`;
  const chips=document.createElement("div"); chips.className="chips";
  u.chips.forEach(c=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=c; b.onclick=()=>{ $("input").value=c; ask(); }; chips.appendChild(b); });
  w.appendChild(chips); scroll.appendChild(w);
}
function dropIntro(){ const i=scroll.querySelector(".intro"); if(i) i.remove(); }
function addUser(text){
  dropIntro(); const r=document.createElement("div"); r.className="row me";
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight;
}
function botRow(){
  const r=document.createElement("div"); r.className="row bot";
  const m=document.createElement("div"); m.className="mini"; m.innerHTML=`<img src="${AVATAR}" alt="">`;
  r.appendChild(m); return r;
}

const PLAY=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
function videoNodes(card){
  let vids=[]; if(Array.isArray(card.videos)) vids=card.videos; else if(card.video) vids=[card.video];
  if(!vids.length) return null;
  const linkVids=vids.filter(v=>!v.type||v.type==="link");
  const embedVids=vids.filter(v=>["youtube","mp4","stream","embed"].includes(v.type));
  const frag=document.createDocumentFragment();
  embedVids.forEach(v=>{ const wrap=document.createElement("div"); wrap.className="video";
    if(v.title){ const cap=document.createElement("div"); cap.className="vcap"; cap.innerHTML=PLAY+`<span>${v.title[lang]||v.title.en}</span>`; wrap.appendChild(cap); }
    let m; if(v.type==="youtube"){ m=document.createElement("iframe"); m.src="https://www.youtube-nocookie.com/embed/"+v.id; m.allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"; m.allowFullscreen=true; }
    else if(v.type==="mp4"){ m=document.createElement("video"); m.src=v.url; m.controls=true; }
    else { m=document.createElement("iframe"); m.src=v.url; m.allowFullscreen=true; }
    m.className="vframe"; wrap.appendChild(m); frag.appendChild(wrap); });
  if(linkVids.length){ const box=document.createElement("div"); box.className="vids";
    linkVids.forEach(v=>{ const a=document.createElement("a"); a.className="openbtn"; a.href=v.url; a.target="_blank"; a.rel="noopener";
      const t=v.title?(v.title[lang]||v.title.en):""; a.innerHTML=PLAY+`<span>${UI[lang].watch}${t?": "+t:""}</span>`; box.appendChild(a); });
    frag.appendChild(box); }
  return frag;
}

function addAnswer(card,related){
  const r=botRow(); const b=document.createElement("div"); b.className="bubble";
  const t=document.createElement("div"); t.className="a-title"; t.appendChild(document.createTextNode(card[lang].title)); b.appendChild(t);
  const body=document.createElement("div"); body.textContent=card[lang].body; b.appendChild(body);
  const vids=videoNodes(card); if(vids) b.appendChild(vids);
  if(card.link){ const wrap=document.createElement("div"); wrap.className="doc";
    const a=document.createElement("a"); a.className="openbtn"; a.href=card.link; a.target="_blank"; a.rel="noopener";
    a.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg><span>${UI[lang].openDoc}</span>`;
    wrap.appendChild(a); b.appendChild(wrap); }
  const s=document.createElement("div"); s.className="src";
  s.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg><span>${UI[lang].src}: ${card.source[lang]}</span>`;
  b.appendChild(s);
  if(related&&related.length){ const rel=document.createElement("div"); rel.className="related";
    const lbl=document.createElement("div"); lbl.className="lbl"; lbl.textContent=UI[lang].seeAlso; rel.appendChild(lbl);
    related.forEach(rc=>{ const c=document.createElement("button"); c.className="chip"; c.textContent=rc[lang].title; c.onclick=()=>{ $("input").value=rc[lang].title; ask(); }; rel.appendChild(c); });
    b.appendChild(rel); }
  r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight;
}
function addWarn(text){
  const r=botRow(); const b=document.createElement("div"); b.className="bubble warn"; b.textContent=text;
  r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight;
}
function addTyping(){
  const r=botRow(); r.id="typing";
  const b=document.createElement("div"); b.className="bubble"; b.innerHTML=`<span class="dots"><i></i><i></i><i></i></span>`;
  r.appendChild(b); scroll.appendChild(r); scroll.scrollTop=scroll.scrollHeight;
}
function rmTyping(){ const t=$("typing"); if(t) t.remove(); }
function autoGrow(el){ el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,130)+"px"; }
function onKey(e){ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ask(); } }
function ask(){
  const q=$("input").value.trim(); if(!q) return;
  $("input").value=""; autoGrow($("input")); addUser(q); addTyping();
  setTimeout(()=>{ rmTyping(); const {best,related}=search(q,lang);
    if(best) addAnswer(best.card,related); else addWarn(UI[lang].notFound);
    $("input").focus(); },300);
}

async function boot(){
  try{ const r=await fetch("./library.json",{cache:"no-store"});
    if(r.ok){ const j=await r.json(); if(j&&Array.isArray(j.cards)&&j.cards.length) LIB=j.cards; } }
  catch(e){ /* preview / offline → use embedded copy */ }
  buildIndex(); setLang("en");
}
boot();
