<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CX Onboarding Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#e43c50;
  --grad:linear-gradient(135deg,#e43c50 0%,#f06a7c 55%,#ff9bab 100%);
  --ink:#221b3a; --ink-soft:#6a6385;
  --bg:#f6f3fb; --card:#fff; --line:#efeaf6;
  --shadow:0 18px 50px -18px rgba(60,30,90,.45);
  --radius:22px; --font:'Cairo',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--bg);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:14px;position:relative;overflow-x:hidden;}

/* floaters */
#floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;opacity:.16;filter:saturate(.9);animation:drift 18s ease-in-out infinite;}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.floater{animation:none}}

/* header / footer */
.wrap{width:100%;max-width:460px;z-index:1;display:flex;flex-direction:column;gap:14px;flex:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-logos{display:flex;align-items:center;gap:10px}
.cx-logo{height:34px;width:auto}
.div-logo{height:30px;width:auto;display:none}
.langbtn{border:1.5px solid var(--line);border-radius:999px;background:#fff;color:var(--brand);
  font-family:var(--font);font-weight:800;font-size:13px;padding:6px 14px;cursor:pointer;transition:.15s}
.langbtn:hover{border-color:var(--brand);transform:translateY(-1px)}

footer{margin-top:auto;padding-top:10px;text-align:center}
.footcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:12px 16px;
  display:flex;align-items:center;justify-content:center;gap:10px}
.footLine{font-weight:700;font-size:12.5px}
.foot-logo{height:24px}

/* cards / screens */
.screen{display:none;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px;position:relative;overflow:hidden}
.brandbar{height:6px;background:var(--grad);border-radius:6px;width:74px;margin:0 auto 16px}
.h1{font-size:22px;font-weight:900;text-align:center;margin:2px 0 4px}
.h2{font-size:19px;font-weight:800;text-align:center;margin:6px 0}
.h3{font-size:16px;font-weight:800;text-align:center;margin:4px 0}
.muted{color:var(--ink-soft);text-align:center;font-size:14px;line-height:1.6}
.small{font-size:12.5px}

/* fields + buttons */
.field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}
.field input,.field select,.fbk-area{font-family:var(--font);font-size:15px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:14px;background:#faf8ff;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.btn{font-family:var(--font);font-weight:800;font-size:16px;color:#fff;background:var(--grad);
  border:none;border-radius:16px;padding:14px 18px;width:100%;cursor:pointer;margin-top:8px;
  box-shadow:0 12px 26px -12px var(--brand);transition:transform .15s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* media slots (AURA-consistent breathing) */
.media-slot{display:flex;justify-content:center;margin:0 auto 14px}
.media-anim{position:relative;display:flex;align-items:center;justify-content:center;border-radius:20px;overflow:hidden;
  animation:mediaIn .6s cubic-bezier(.2,.9,.3,1.3) both, mediaIdle 5.2s ease-in-out .65s infinite}
@keyframes mediaIn{from{opacity:0;transform:translateY(16px) scale(.84)}to{opacity:1;transform:none}}
@keyframes mediaIdle{0%,100%{transform:translateY(0) scale(1) rotate(0)}25%{transform:translateY(-7px) scale(1.022) rotate(-1.3deg)}
  50%{transform:translateY(0) scale(1.012)}75%{transform:translateY(-5px) scale(1.022) rotate(1.3deg)}}
@media(prefers-reduced-motion:reduce){.media-anim{animation:mediaIn .4s ease both}}
.media-anim.frame{background:linear-gradient(135deg,#fff6f7,#fef0f4)}
.media-img,.media-lottie{display:block;width:100%;height:100%;object-fit:contain}
.media-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;
  border:2px dashed #e7c7cf;border-radius:18px;background:#fff7f8}
.media-ph .pe{font-size:30px}.media-ph .ps{font-weight:700;font-size:10.5px;color:#b98a95}
.media-sm{width:128px;height:128px}.media-md{width:172px;height:172px}.media-swipe{width:150px;height:140px}

/* world + character */
.world-logo{display:block;max-width:230px;width:78%;height:auto;margin:6px auto 14px}
.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.char-cell{background:#faf8ff;border:1.5px solid var(--line);border-radius:18px;padding:10px 6px;cursor:pointer;transition:.15s;font-family:var(--font)}
.char-cell:hover{border-color:var(--brand);transform:translateY(-2px)}
.char-name{font-weight:800;font-size:12px;margin-top:6px;color:var(--ink)}
.round-list{margin:10px 4px;padding-inline-start:22px;line-height:2;font-weight:600}

/* round chrome */
.round-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.round-tag{font-weight:800;font-size:12.5px;color:var(--brand);background:#fff;border:1.5px solid var(--line);padding:5px 12px;border-radius:999px}
.round-title{font-weight:900;font-size:17px;text-align:center;margin:4px 0 10px}

/* swipe */
.swipe-stage{min-height:240px;display:flex;justify-content:center;align-items:center}
.swipe-card{background:#faf8ff;border:1.5px solid var(--line);border-radius:20px;padding:16px;width:100%;text-align:center}
.swipe-prompt{font-weight:700;font-size:16px;line-height:1.6;margin:6px 0 0}
.swipe-btns{display:flex;gap:10px;margin-top:14px}
.swipe-btns .btn{margin-top:0}

/* scenario */
.scn-bubble{background:#faf8ff;border:1.5px solid var(--line);border-radius:18px;padding:14px;font-weight:700;line-height:1.6;margin:8px 0 12px;text-align:center}
.scn-opts{display:flex;flex-direction:column;gap:10px}
.scn-opt{font-family:var(--font);font-weight:700;font-size:14.5px;text-align:start;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s;color:var(--ink)}
.scn-opt:hover{border-color:var(--brand)}
.scn-opt.ok{background:#e8f8ef;border-color:#19b36b;color:#0c7a45}
.scn-opt.no{background:#fdecef;border-color:#e43c50;color:#b02338}

/* feedback line */
.fb{min-height:0;opacity:0;transition:.2s;text-align:center;font-weight:800;margin-top:12px;border-radius:12px;padding:0}
.fb.show{opacity:1;padding:11px 14px}
.fb.ok{background:#e8f8ef;color:#0c7a45}
.fb.no{background:#fdecef;color:#b02338}

/* result */
.badge{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:2px auto 8px;box-shadow:var(--shadow)}
.badge.ok{background:linear-gradient(135deg,#caf3dd,#8fe5b8)}
.badge.no{background:linear-gradient(135deg,#ffe0e6,#ffb3c0)}
.score-big{font-size:40px;font-weight:900;text-align:center;color:var(--brand)}
.breakdown{margin:14px 0;display:flex;flex-direction:column;gap:8px}
.bd-row{display:flex;justify-content:space-between;background:#faf8ff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13.5px}
.fbk{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.star{font-size:30px;background:none;border:none;cursor:pointer;color:#dcd3ea;transition:.12s}
.star.on{color:#ffba2e}
.fbk-area{margin:8px 0;resize:vertical}
</style>
</head>
<body>

<div id="floaters"></div>

<div class="wrap">

  <!-- HEADER -->
  <div class="topbar">
    <div class="brand-logos">
      <img id="cxLogoTop" class="cx-logo" src="assets/logos/cx-hub.jpg" alt="CX Hub">
      <img id="divLogo" class="div-logo" alt="">
    </div>
    <button id="langBtn" class="langbtn"><span id="langLabel">EN</span></button>
  </div>

  <!-- SCREENS -->
  <section class="screen active" id="screen-intake">
    <div class="card">
      <div class="brandbar"></div>
      <h1 class="h1">CX Onboarding Challenge</h1>
      <p class="muted">سجّل دخولك للبدء</p>
      <div id="intakeForm" style="margin-top:16px"></div>
    </div>
  </section>

  <section class="screen" id="screen-world">
    <div class="card" id="worldCard"></div>
  </section>

  <section class="screen" id="screen-character">
    <div class="card" id="charCard"></div>
  </section>

  <section class="screen" id="screen-intro">
    <div class="card" id="introCard"></div>
  </section>

  <section class="screen" id="screen-round">
    <div class="card">
      <div class="round-head">
        <span class="round-tag" id="roundTag"></span>
      </div>
      <div class="round-title" id="roundTitle"></div>
      <div id="roundMount"></div>
    </div>
  </section>

  <section class="screen" id="screen-result">
    <div class="card" id="resultCard"></div>
  </section>

  <!-- FOOTER -->
  <footer>
    <a id="cxLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
      <div class="footcard">
        <span class="footLine" id="footLine">Developed by Customer Experience</span>
        <img class="foot-logo" src="assets/logos/cx-hub.jpg" alt="CX Hub">
      </div>
    </a>
  </footer>

</div>

<!-- load order: lottie player, config, worlds, media, division data, engine -->
<script src="lottie-player.js"></script>
<script src="config/shared.js"></script>
<script src="config/worlds.js"></script>
<script src="media/media-config.js"></script>
<script src="divisions/retail.js"></script>
<!-- <script src="divisions/hospitality.js"></script>  (add when built) -->
<!-- <script src="divisions/starbucks.js"></script>    (add when built) -->
<script src="engine.js"></script>
</body>
</html>
