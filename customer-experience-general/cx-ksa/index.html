<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CX Onboarding Challenge</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#005430;
  --grad:linear-gradient(135deg,#005430 0%,#0a8a55 100%);
  --ink:#221b3a; --ink-soft:#6a6385;
  --card:#fff; --line:#eef1ef;
  --shadow:0 22px 60px -22px rgba(10,20,15,.55);
  --radius:26px; --font:'Cairo',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);
  background-color:#005430;
  background-image:linear-gradient(135deg,#00351f,#005430,#00733f,#005430);
  background-size:230% 230%;animation:bgshift 17s ease infinite;
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:16px 14px;position:relative;overflow-x:hidden}
@keyframes bgshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@media(prefers-reduced-motion:reduce){body{animation:none}}

/* floaters */
#floaters{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.floater{position:absolute;opacity:.16;animation:drift 18s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.floater{animation:none}}

.wrap{width:100%;max-width:500px;z-index:1;display:flex;flex-direction:column;gap:12px}

/* ===== THE MAIN WINDOW (single big white card) ===== */
.window{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:18px 20px 26px;min-height:548px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.win-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.win-logos{display:flex;align-items:center;gap:12px;min-height:44px}
.cx-logo{height:42px;width:auto}
.div-logo{height:38px;width:auto;display:none}
.langbtn{border:1.5px solid var(--line);border-radius:999px;background:#f7faf8;color:var(--brand);
  font-family:var(--font);font-weight:800;font-size:13px;padding:7px 15px;cursor:pointer;transition:.15s;flex:none}
.langbtn:hover{border-color:var(--brand);transform:translateY(-1px)}
.win-body{flex:1;display:flex;flex-direction:column;justify-content:center}

/* screens */
.screen{display:none;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both}
.screen.active{display:block}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1;transform:none}}
.brandbar{height:6px;background:var(--grad);border-radius:6px;width:74px;margin:0 auto 16px}
.h1{font-size:23px;font-weight:900;text-align:center;margin:2px 0 4px}
.h2{font-size:19px;font-weight:800;text-align:center;margin:6px 0}
.h3{font-size:16px;font-weight:800;text-align:center;margin:4px 0}
.muted{color:var(--ink-soft);text-align:center;font-size:14px;line-height:1.6}
.small{font-size:12.5px}

/* fields + buttons */
.field{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:13px}
.field input,.field select,.fbk-area{font-family:var(--font);font-size:15px;padding:12px 14px;
  border:1.5px solid var(--line);border-radius:14px;background:#f7faf8;color:var(--ink);width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}

.btn{position:relative;overflow:hidden;font-family:var(--font);font-weight:800;font-size:16px;color:#fff;
  background:var(--grad);border:none;border-radius:16px;padding:14px 18px;width:100%;cursor:pointer;margin-top:8px;
  box-shadow:0 12px 26px -12px var(--brand);transition:transform .15s,filter .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.3);transform:none}
/* shine sweep */
.btn::after{content:"";position:absolute;top:0;left:-60%;width:42%;height:100%;
  background:linear-gradient(110deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg);animation:sweep 3.4s ease-in-out infinite;pointer-events:none}
.btn:disabled::after{display:none}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
@media(prefers-reduced-motion:reduce){.btn::after{display:none}}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}
.btn.ghost::after{background:linear-gradient(110deg,transparent,rgba(0,84,48,.10),transparent)}
.btn.light{background:#fff;color:var(--brand);box-shadow:0 12px 26px -12px rgba(0,0,0,.4)}
.btn.light::after{background:linear-gradient(110deg,transparent,rgba(0,0,0,.06),transparent)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* media slots (breathing) */
.media-slot{display:flex;justify-content:center;margin:0 auto 14px}
.media-anim{position:relative;display:flex;align-items:center;justify-content:center;border-radius:20px;overflow:hidden;
  animation:mediaIn .6s cubic-bezier(.2,.9,.3,1.3) both, mediaIdle 5.2s ease-in-out .65s infinite}
@keyframes mediaIn{from{opacity:0;transform:translateY(16px) scale(.84)}to{opacity:1;transform:none}}
@keyframes mediaIdle{0%,100%{transform:translateY(0) scale(1) rotate(0)}25%{transform:translateY(-7px) scale(1.022) rotate(-1.3deg)}
  50%{transform:translateY(0) scale(1.012)}75%{transform:translateY(-5px) scale(1.022) rotate(1.3deg)}}
@media(prefers-reduced-motion:reduce){.media-anim{animation:mediaIn .4s ease both}}
.media-anim.frame{background:linear-gradient(135deg,#f4f9f6,#eef6f1)}
.media-img,.media-lottie{display:block;width:100%;height:100%;object-fit:contain}
.media-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:100%;
  border:2px dashed #cfe3d8;border-radius:18px;background:#f5faf7}
.media-ph .pe{font-size:30px}.media-ph .ps{font-weight:700;font-size:10.5px;color:#7fae96}
.media-sm{width:128px;height:128px}.media-md{width:172px;height:172px}.media-swipe{width:150px;height:140px}

/* world reveal */
.world-logo{display:block;max-width:248px;width:82%;height:auto;margin:8px auto 16px}
.round-list{margin:10px 4px;padding-inline-start:22px;line-height:2;font-weight:600}

/* ===== CHARACTER STAGE (game-style, gradient hero inside the window) ===== */
.stage-hero{position:relative;overflow:hidden;background:var(--grad);background-size:180% 180%;
  animation:bgshift 14s ease infinite;border-radius:20px;padding:12px 6px 14px;margin:6px 0 14px;
  box-shadow:inset 0 2px 26px rgba(0,0,0,.18)}
.hero-logo{display:block;height:26px;width:auto;margin:2px auto 2px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.char-stage{position:relative;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:330px}
.char-arrow{position:absolute;top:46%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:none;
  background:#fff;color:var(--brand);font-size:22px;font-weight:900;box-shadow:0 8px 18px -6px rgba(0,0,0,.5);cursor:pointer;transition:.15s;z-index:4}
.char-arrow:hover{transform:translateY(-50%) scale(1.08)}
.char-arrow.prev{inset-inline-start:4px}
.char-arrow.next{inset-inline-end:4px}
.char-figwrap{position:relative;display:flex;align-items:flex-end;justify-content:center;height:320px}
.pedestal{position:absolute;bottom:14px;width:188px;height:52px;border-radius:50%;z-index:1;
  background:radial-gradient(ellipse at 50% 38%, rgba(255,255,255,.5), rgba(255,255,255,.08) 58%, transparent 72%);
  box-shadow:0 24px 28px -8px rgba(0,0,0,.4)}
.char-figure{position:relative;height:284px;width:auto;object-fit:contain;z-index:2;
  filter:drop-shadow(0 16px 16px rgba(0,0,0,.32));animation:charFloat 4.2s ease-in-out infinite}
@keyframes charFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.char-figure,.char-figure-ph,.stage-hero{animation:none}}
.char-figure-ph{position:relative;z-index:2;height:266px;width:148px;border:2px dashed rgba(255,255,255,.85);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;background:rgba(255,255,255,.14);animation:charFloat 4.2s ease-in-out infinite}
.char-figure-ph .pe{font-size:58px}.char-figure-ph .ps{font-weight:800;font-size:12px;opacity:.9}
.char-name{font-weight:900;font-size:22px;color:#fff;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.35);margin-top:2px}
.char-dots{display:flex;justify-content:center;gap:8px;margin:8px 0 2px}
.char-dots span{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);transition:.2s}
.char-dots span.on{background:#fff;transform:scale(1.25)}

/* round chrome */
.round-head{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.round-tag{font-weight:800;font-size:12.5px;color:var(--brand);background:#f7faf8;border:1.5px solid var(--line);padding:5px 12px;border-radius:999px}
.round-title{font-weight:900;font-size:17px;text-align:center;margin:8px 0 8px}

/* progress dots */
.progress{display:flex;justify-content:center;gap:7px;margin:4px 0 12px}
.progress span{width:8px;height:8px;border-radius:50%;background:#e3dcef;transition:.2s}
.progress span.on{background:var(--brand);transform:scale(1.25)}
.progress span.done{background:var(--brand);opacity:.5}

/* swipe */
.q-area{min-height:230px}
.swipe-card{background:#f7faf8;border:1.5px solid var(--line);border-radius:20px;padding:16px;width:100%;text-align:center}
.swipe-prompt{font-weight:700;font-size:16px;line-height:1.6;margin:6px 0 0}
.swipe-btns{display:flex;gap:10px;margin-top:14px}
.choice{flex:1;font-family:var(--font);font-weight:800;font-size:15px;padding:13px;border:1.5px solid var(--line);
  border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;transition:.15s}
.choice:hover{border-color:var(--brand)}
.choice.sel{background:var(--brand);color:#fff;border-color:var(--brand)}

/* scenario */
.scn-bubble{background:#f7faf8;border:1.5px solid var(--line);border-radius:18px;padding:14px;font-weight:700;line-height:1.6;margin:8px 0 12px;text-align:center}
.scn-opts{display:flex;flex-direction:column;gap:10px}
.scn-opt{font-family:var(--font);font-weight:700;font-size:14.5px;text-align:start;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;transition:.15s;color:var(--ink)}
.scn-opt:hover{border-color:var(--brand)}
.scn-opt.ok{background:#e8f8ef;border-color:#19b36b;color:#0c7a45}
.scn-opt.no{background:#fdecef;border-color:#e43c50;color:#b02338}

/* feedback line */
.fb{opacity:0;transition:.2s;text-align:center;font-weight:800;margin-top:12px;border-radius:12px;padding:0}
.fb.show{opacity:1;padding:11px 14px}
.fb.ok{background:#e8f8ef;color:#0c7a45}
.fb.no{background:#fdecef;color:#b02338}

/* question nav */
.qnav{display:flex;gap:10px;margin-top:14px}
.qnav .btn{margin-top:0}

/* bonus tag */
.ri-tag.bonus,.round-tag.bonus{color:#9a5b00;background:#fff7e6;border-color:#ffdf9e}
.bd-row.bonus{background:linear-gradient(135deg,#fff7e6,#ffeccc);border:1px solid #ffdf9e}

/* RUSH mode */
.rush-hud{display:flex;align-items:center;gap:10px;margin:2px 0 8px}
.rush-en-ico{font-size:18px}
.rush-energy{flex:1;height:14px;border-radius:999px;background:#eee;overflow:hidden}
.rush-energy-fill{height:100%;width:50%;background:linear-gradient(90deg,#ffba2e,#f15a24);transition:width .3s ease}
.rush-streak{font-weight:800;font-size:13px;color:var(--brand);white-space:nowrap}
.rush-count{text-align:center;font-weight:800;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
.rush-timer{height:8px;border-radius:999px;background:#eee;overflow:hidden;margin-bottom:12px}
.rush-timer-fill{height:100%;width:100%;background:var(--grad);transition:width .08s linear}
.rush-q{min-height:230px}
.rush-prompt{font-weight:800;font-size:16.5px;text-align:center;margin:8px 0 14px;line-height:1.6}
.rush-opts{display:flex;flex-direction:column;gap:10px}
.rush-opt{font-family:var(--font);font-weight:800;font-size:15px;padding:14px;border:1.5px solid var(--line);
  border-radius:14px;background:#fff;color:var(--ink);cursor:pointer;transition:.12s}
.rush-opt:hover{border-color:var(--brand)}
.rush-opt:disabled{cursor:default}
.rush-opt.ok{background:#e8f8ef;border-color:#19b36b;color:#0c7a45}
.rush-opt.no{background:#fdecef;border-color:#e43c50;color:#b02338}

/* result */
.badge{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;margin:2px auto 8px;box-shadow:var(--shadow)}
.badge.ok{background:linear-gradient(135deg,#caf3dd,#8fe5b8)}
.badge.no{background:linear-gradient(135deg,#ffe0e6,#ffb3c0)}
.score-big{font-size:40px;font-weight:900;text-align:center;color:var(--brand)}
.breakdown{margin:14px 0;display:flex;flex-direction:column;gap:8px}
.bd-row{display:flex;justify-content:space-between;background:#f7faf8;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13.5px}
.fbk{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.stars{display:flex;justify-content:center;gap:6px;margin:8px 0}
.star{font-size:30px;background:none;border:none;cursor:pointer;color:#dcd3ea;transition:.12s}
.star.on{color:#ffba2e}
.fbk-area{margin:8px 0;resize:vertical}

/* footer — attached just under the window */
footer{margin-top:0}
.footcard{background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:13px 16px;text-align:center}
.foot-logos{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.foot-logos img{width:auto}
.foot-cx{height:34px}
.foot-alshaya{height:36px}
.foot-divider{width:1px;height:26px;background:var(--line)}
.foot-copy{font-weight:800;font-size:13px;color:var(--ink)}
.foot-dev{color:var(--ink-soft);font-size:11.5px;margin-top:3px;line-height:1.5}
.foot-dev a{color:var(--brand);font-weight:800;text-decoration:none}
.foot-dev a:hover{text-decoration:underline}

/* round intro screen */
.round-intro{text-align:center}
.ri-tag{display:inline-block;font-weight:800;font-size:12.5px;color:var(--brand);background:#f7faf8;border:1.5px solid var(--line);padding:6px 14px;border-radius:999px;margin-bottom:10px}
.ri-title{font-size:20px;font-weight:900;margin:6px 0 8px}
.ri-text{color:var(--ink-soft);font-size:14.5px;line-height:1.7;margin-bottom:6px}

/* result extras */
a.btn{display:block;text-align:center;text-decoration:none;line-height:1.2}
.result-head{font-size:22px;font-weight:900;text-align:center;margin:4px 0 2px}
.score-ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:900;color:var(--brand);position:relative}
.score-ring::before{content:"";position:absolute;inset:0;border-radius:50%;padding:10px;
  background:conic-gradient(var(--brand) calc(var(--p,0)*1%), #e9e4f1 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 11px),#000 calc(100% - 10px))}
.score-saved{display:flex;align-items:center;justify-content:center;gap:6px;color:#0c7a45;font-weight:700;font-size:13px;margin-top:12px}

/* badge card (division-coloured) */
.badgecard{position:relative;overflow:hidden;border-radius:22px;padding:22px 18px 24px;margin:16px 0 10px;color:#fff;
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.3);background-size:200% 200%;animation:bgshift 12s ease infinite}
.badge-logo{display:block;height:30px;width:auto;margin:0 auto 16px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.badge-medal{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
  margin:4px auto 16px;box-shadow:0 12px 30px rgba(0,0,0,.28);border:6px solid #ffba2e}
.badge-star{font-size:60px;line-height:1;color:#ffba2e}
.badge-mastery{letter-spacing:3px;font-weight:800;font-size:12px;color:#ffe08a;text-align:center;text-transform:uppercase}
.badge-name{font-size:25px;font-weight:900;text-align:center;margin-top:6px}
.badge-sub{text-align:center;font-weight:800;opacity:.96;margin-top:2px}
.badge-score{text-align:center;font-weight:800;margin-top:6px}
.badge-date{text-align:center;opacity:.85;font-size:13px;margin-top:6px}
.badge-foot{text-align:center;font-weight:800;font-size:12.5px;margin-top:12px;opacity:.95;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}

/* confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
#confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;opacity:.95;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(560deg)}}
@media(prefers-reduced-motion:reduce){#confetti{display:none}}
</style>
</head>
<body>

<div id="floaters"></div>
<div id="confetti"></div>

<div class="wrap">

  <!-- ===== MAIN WINDOW ===== -->
  <div class="window">

    <div class="win-head">
      <div class="win-logos">
        <img id="cxLogoTop" class="cx-logo" src="assets/logos/cx-hub-color.png" alt="CX Hub">
        <img id="divLogo" class="div-logo" alt="">
      </div>
      <button id="langBtn" class="langbtn"><span id="langLabel">EN</span></button>
    </div>

    <div class="win-body">

      <section class="screen active" id="screen-intake">
        <div class="brandbar"></div>
        <h1 class="h1" id="intakeTitle"></h1>
        <p class="muted" id="intakeSub"></p>
        <div id="intakeForm" style="margin-top:16px"></div>
      </section>

      <section class="screen" id="screen-world"><div id="worldCard"></div></section>

      <section class="screen" id="screen-character"><div id="charMount"></div></section>

      <section class="screen" id="screen-intro"><div id="introCard"></div></section>

      <section class="screen" id="screen-roundintro"><div id="roundIntroCard"></div></section>

      <section class="screen" id="screen-round">
        <div class="round-head"><span class="round-tag" id="roundTag"></span></div>
        <div class="round-title" id="roundTitle"></div>
        <div id="roundMount"></div>
      </section>

      <section class="screen" id="screen-result"><div id="resultCard"></div></section>

    </div>
  </div>

  <!-- FOOTER (attached under the window) -->
  <footer><div id="footerMount"></div></footer>

</div>

<script src="lottie-player.js"></script>
<script src="config/shared.js"></script>
<script src="config/worlds.js"></script>
<script src="media/media-config.js"></script>
<script src="divisions/retail.js"></script>
<!-- <script src="divisions/hospitality.js"></script> -->
<!-- <script src="divisions/starbucks.js"></script> -->
<script src="engine.js"></script>
</body>
</html>
