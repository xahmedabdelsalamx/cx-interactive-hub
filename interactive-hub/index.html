<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CX Interactive Hub</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#0e1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<!-- Lottie player: lets any icon/image be a Lottie animation via {lottie:"..."} in config.js -->
<script src="https://unpkg.com/@lottiefiles/lottie-player@2.0.8/dist/lottie-player.js"></script>
</head>
<body>

<div class="world-bg" id="worldBg"><div class="base"></div><div class="orb a"></div><div class="orb b"></div></div>

<div class="topbar"><div class="wrap">
  <button class="brandmark" onclick="CXHub.goHome()">
    <span class="chip"><img src="assets/logos/cx-hub.png" alt="CX Hub"></span>
    <span class="bt" data-t="brand">CX Interactive Hub</span>
  </button>
  <div class="tb-right">
    <span class="player-chip" id="playerChip"><span class="av" id="pcAv"></span><span class="nm" id="pcName"></span></span>
    <div class="langtoggle">
      <button id="btn-en" class="active" onclick="CXHub.setLang('en')">EN</button>
      <button id="btn-ar" onclick="CXHub.setLang('ar')">العربية</button>
    </div>
  </div>
</div></div>

<div id="app"></div>

<div class="modal-back" id="modalBack" onclick="if(event.target===this)CXHub.closeModal()">
  <div class="modal" id="modal"></div>
</div>

<footer><div class="wrap">
  <div class="fx"><img src="assets/logos/cx-hub.png" alt="CX Hub"></div>
  <p><span data-t="f_dev">Developed by the Customer Experience team</span> · 2026 · <span data-t="f_q">Any queries?</span>
     <a href="mailto:ahmed.abdelsalam@alshaya.com" data-t="f_contact">contact here</a></p>
</div></footer>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
